- name: Rotate the shop worker logs and remove the oversized ones
  hosts: all
  gather_facts: false
  tasks:
    # Free space first: on a full disk Ansible cannot even create its remote
    # temp directory, so the copy below would fail before anything was freed.
    - name: Find rotated worker logs that were never removed
      ansible.builtin.find:
        paths: /var/log/shop
        patterns: "*.log.*"
      register: rotated
    - name: Remove them
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ rotated.files }}"
    - name: Measure the live worker log
      ansible.builtin.stat:
        path: /var/log/shop/worker.log
      register: live
    - name: Truncate the live worker log when it outgrew the rule
      ansible.builtin.command: truncate -s 0 /var/log/shop/worker.log
      when: live.stat.exists and live.stat.size > 104857600
      changed_when: true
    # A shell, not copy: copy stages its file in a remote temp directory, which
    # a disk with no free byte cannot hold, even in check mode. It writes the
    # rule only when it differs, so the verify run changes nothing.
    - name: Install a logrotate rule for the worker
      ansible.builtin.shell: |
        rule='/var/log/shop/*.log {
          daily
          rotate 7
          maxsize 100M
          compress
          missingok
          notifempty
          copytruncate
        }'
        if [ "$(cat /etc/logrotate.d/shop 2>/dev/null)" = "$rule" ]; then
          echo kept
        else
          printf '%s\n' "$rule" > /etc/logrotate.d/shop
          echo written
        fi
      register: rule
      changed_when: rule.stdout == "written"
