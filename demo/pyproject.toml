[project]
name = "cloudfall-demo"
version = "0.1.0"
description = "The hosted Cloudfall demo: a live Nemotron on a recorded incident"
requires-python = ">=3.14"
license = "AGPL-3.0-only"
dependencies = [
    "cloudfall",
    "starlette>=0.46,<2",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "mypy>=1.15,<2", "pytest>=8,<9"]

[tool.uv]
package = true

[tool.uv.sources]
# The demo is deployed from this directory alone, so Cloudfall comes from git,
# pinned: bump the rev to ship a new Cloudfall to the demo.
cloudfall = { git = "https://github.com/cloudfall-dev/cloudfall", rev = "3ff7f00e949da4bfe850672c333d505ccbd4b14e" }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudfall_demo"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
