name: Feature request
description: A capability Cloudfall should have
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what stops you today
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like Cloudfall to handle it
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What you do now instead
