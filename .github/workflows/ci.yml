---
name: CI

"on":
  push:
    branches:
      - main
  pull_request:
  # shipmill's release workflow and publish.yml run these checks on the commit they release
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions: {}

jobs:
  # Every supported Python (docs/compatibility.md); 3.14 keeps the job name
  # `checks` that the release and publish runs, and the gates, already read
  checks:
    name: ${{ matrix.python == '3.14' && 'checks' || format('checks (Python {0})', matrix.python) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy

      - name: Test
        run: uv run pytest

      - name: Demo
        working-directory: demo
        run: |
          uv sync --locked
          uv run mypy
          uv run pytest

      - name: Validate example state
        run: uv run cloudfall config validate --project config/examples

      - name: Render Ansible inventory
        run: >-
          uv run cloudfall-engine inventory render --project config/examples
          --output tmp/ansible-inventory.json

      - name: Ansible syntax checks
        env:
          ANSIBLE_CONFIG: engine/ansible/ansible.cfg
        run: |
          for playbook in engine/ansible/playbooks/*.yml; do
            uv run ansible-playbook --syntax-check \
              --inventory config/examples/tmp/ansible-inventory.json \
              "${playbook}"
          done

      - name: Ansible lint
        env:
          ANSIBLE_CONFIG: engine/ansible/ansible.cfg
        run: uv run ansible-lint engine/ansible
