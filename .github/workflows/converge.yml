---
name: Converge

# The roles converged for real on Debian 13 with systemd, through the same
# commands an operator runs: bootstrap, baseline, services, a deploy, a
# failing deploy that rolls back, a restart, an nginx Domain with a
# self-signed certificate, a rollback, a backup and its restore drill, then
# the converge again, which must change nothing (D-17). The host is a disposable
# privileged container on the runner, reached over SSH on loopback; it is a
# test host only, Cloudfall runs no containers of its own (D-10).
"on":
  push:
    branches:
      - main
  pull_request:
  # release.yml and publish.yml converge the commit they release, and release
  # nothing unless this passed on it (D-23)
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions: {}

# A release or publish run converges in a group of its own, so a push to main
# never cancels the converge a release waits for, nor the other way round
concurrency:
  group: >-
    converge-${{
      inputs.ref && format('{0}-{1}', inputs.ref, github.run_id) || github.ref
    }}
  cancel-in-progress: true

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        # Every cloudfall command runs from the fixture project, so the
        # inventory, artifacts, receipts and backups land in its tmp/
        working-directory: engine/tests/converge/project
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty on push and pull_request: the commit that started the run
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # A release from a line that predates the converge harness (0.7.x) has
      # no fixture project to run: the job passes with a notice, and every
      # step below runs only on a tree that carries it (D-28, #516)
      - name: Check the tree carries the converge harness
        id: harness
        working-directory: .
        run: |
          if [ -d engine/tests/converge/project ]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::no engine/tests/converge/project in this tree, so nothing is converged (D-28)"
            echo "present=false" >> "${GITHUB_OUTPUT}"
          fi

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.harness.outputs.present == 'true'
        with:
          python-version: "3.14"

      - name: Install dependencies
        if: steps.harness.outputs.present == 'true'
        run: uv sync --locked

      - name: Start the Debian 13 host with systemd as PID 1
        if: steps.harness.outputs.present == 'true'
        run: |
          docker build --tag cloudfall-converge ..
          docker run --detach --name converge \
            --privileged --cgroupns=host \
            --volume /sys/fs/cgroup:/sys/fs/cgroup:rw \
            --tmpfs /run --tmpfs /run/lock \
            --publish 127.0.0.1:2222:2222 \
            cloudfall-converge

      - name: Reach the host over SSH with a throwaway key
        if: steps.harness.outputs.present == 'true'
        run: |
          install --directory --mode=0700 ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -C converge -f ~/.ssh/converge
          docker exec --interactive converge \
            sh -c 'cat > /root/.ssh/authorized_keys && chmod 0600 /root/.ssh/authorized_keys' \
            < ~/.ssh/converge.pub
          cat >> ~/.ssh/config <<'EOF'
          Host 127.0.0.1
            User root
            Port 2222
            IdentityFile ~/.ssh/converge
            IdentitiesOnly yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
          EOF
          for _ in $(seq 30); do
            if ssh 127.0.0.1 true; then
              break
            fi
            sleep 2
          done
          ssh 127.0.0.1 'systemctl is-system-running --wait; systemctl --no-pager --failed'

      - name: Declare the key and render the inventory
        if: steps.harness.outputs.present == 'true'
        run: |
          uv run cloudfall add ssh-key ~/.ssh/converge.pub --owner ci --project .
          uv run cloudfall config validate --project .
          uv run cloudfall-engine inventory render --project . --output tmp/ansible-inventory.json

      - name: Bootstrap
        if: steps.harness.outputs.present == 'true'
        run: uv run cloudfall-engine playbook run bootstrap

      - name: Baseline
        if: steps.harness.outputs.present == 'true'
        run: uv run cloudfall baseline converge --project . --yes

      # A key that goes from active to revoked is gone after the next
      # baseline run, and the declared active key still logs in (#354, D-22)
      - name: Revoke a key, which the baseline removes
        if: steps.harness.outputs.present == 'true'
        run: |
          ssh-keygen -q -t ed25519 -N '' -C spare -f ~/.ssh/spare
          spare="$(cut -d ' ' -f 2 ~/.ssh/spare.pub)"
          uv run cloudfall add ssh-key ~/.ssh/spare.pub --owner spare --project .
          uv run cloudfall-engine inventory render --project . --output tmp/ansible-inventory.json
          uv run cloudfall baseline converge --project . --yes
          ssh 127.0.0.1 grep --quiet --fixed-strings "${spare}" /root/.ssh/authorized_keys
          sed -i 's/^  lifecycle: active$/  lifecycle: revoked/' ssh-public-keys/spare.yaml
          grep --quiet '^  lifecycle: revoked$' ssh-public-keys/spare.yaml
          uv run cloudfall config validate --project .
          uv run cloudfall-engine inventory render --project . --output tmp/ansible-inventory.json
          uv run cloudfall baseline converge --project . --yes
          if ssh 127.0.0.1 grep --quiet --fixed-strings "${spare}" /root/.ssh/authorized_keys; then
            echo "::error::the revoked key is still in root's authorized_keys"
            exit 1
          fi
          ssh 127.0.0.1 true

      # The ledger owner's password, sops-encrypted to a throwaway age key in
      # sops' default key file, as an operator's secrets directory holds it
      - name: Create the owner role password the services read
        if: steps.harness.outputs.present == 'true'
        env:
          SOPS_VERSION: v3.13.3
          SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --yes --quiet --no-install-recommends age
          curl --fail --silent --show-error --location --output "${RUNNER_TEMP}/sops" \
            "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
          echo "${SOPS_SHA256}  ${RUNNER_TEMP}/sops" | sha256sum --check --strict
          sudo install -m 0755 "${RUNNER_TEMP}/sops" /usr/local/bin/sops
          install --directory --mode=0700 ~/.config/sops/age tmp/env
          age-keygen --output ~/.config/sops/age/keys.txt 2>/dev/null
          recipient="$(age-keygen -y ~/.config/sops/age/keys.txt)"
          (umask 077 && printf 'LEDGER_PASSWORD=%s\n' "$(openssl rand -hex 24)" > tmp/env/ledger.env)
          install --directory secrets/production/postgresql-main
          sops --encrypt --age "${recipient}" --input-type dotenv --output-type dotenv \
            tmp/env/ledger.env > secrets/production/postgresql-main/ledger.env

      - name: Services
        if: steps.harness.outputs.present == 'true'
        run: uv run cloudfall-engine playbook run services

      # The verifier the controller computed is one PostgreSQL accepts
      - name: Log in as the owner role with its password
        if: steps.harness.outputs.present == 'true'
        run: |
          cut --delimiter='=' --fields=2- tmp/env/ledger.env \
            | ssh 127.0.0.1 'PGPASSWORD="$(cat)" psql --host=127.0.0.1 --username=ledger --dbname=ledger --no-psqlrc --tuples-only --command="SELECT current_user"' \
            | grep --quiet --word-regexp ledger

      - name: Build a healthy and a failing release
        if: steps.harness.outputs.present == 'true'
        run: |
          app=/tmp/cloudfall-converge-app
          cp -R ../app "${app}"
          git -C "${app}" init --quiet --initial-branch=main
          git -C "${app}" add .
          git -C "${app}" -c user.name=converge -c user.email=converge@example.invalid \
            commit --quiet --message "A release that passes its health gate"
          git -C "${app}" tag healthy
          printf 'raise SystemExit("this release fails its health gate on purpose")\n' \
            > "${app}/app.py"
          git -C "${app}" -c user.name=converge -c user.email=converge@example.invalid \
            commit --quiet --all --message "A release that exits at start"
          git -C "${app}" tag failing
          git -C "${app}" switch --quiet --detach healthy
          git -C "${app}" -c user.name=converge -c user.email=converge@example.invalid \
            commit --quiet --allow-empty --message "A second release of the healthy code"
          git -C "${app}" tag second
          for ref in healthy failing second; do
            release="$(uv run cloudfall-engine artifact build probe-web --project . \
              --ref "${ref}" --format json | jq --raw-output .data.release)"
            echo "${ref}=${release}" >> "${GITHUB_ENV}"
          done
          # The app starts only on PROBE_START=serve
          install -d -m 0700 tmp/env
          printf 'PROBE_START=serve\n' > tmp/env/good.env
          printf 'PROBE_START=refuse\n' > tmp/env/bad.env

      - name: Deploy the healthy release
        if: steps.harness.outputs.present == 'true'
        run: |
          uv run cloudfall deploy probe-web --project . --release "${healthy}" \
            --env-file tmp/env/good.env --yes
          uv run cloudfall health probe-web --project .
          test "$(ssh 127.0.0.1 readlink /srv/apps/probe/web/current)" \
            = "/srv/apps/probe/web/releases/${healthy}"

      - name: Deploy the failing release, which rolls back
        if: steps.harness.outputs.present == 'true'
        run: |
          if uv run cloudfall deploy probe-web --project . --release "${failing}" --yes; then
            echo "::error::the failing release passed its health gate"
            exit 1
          fi
          current="$(ssh 127.0.0.1 readlink /srv/apps/probe/web/current)"
          if [ "${current}" != "/srv/apps/probe/web/releases/${healthy}" ]; then
            echo "::error::current is ${current}, not the healthy release ${healthy}"
            exit 1
          fi
          uv run cloudfall health probe-web --project .

      # Each release reads its own environment file (#353, D-21): a deploy that
      # fails only because of its new environment, as another release and as a
      # redeploy of the current one, leaves the previous release running on
      # its previous environment, through the rollback and the next restart
      - name: Deploy healthy code with a bad environment, which rolls back
        if: steps.harness.outputs.present == 'true'
        run: |
          expected=/srv/apps/probe/web/shared/env/probe-web.${healthy}.env
          for release in "${second}" "${healthy}"; do
            if uv run cloudfall deploy probe-web --project . --release "${release}" \
              --env-file tmp/env/bad.env --yes; then
              echo "::error::release ${release} passed its health gate on a bad environment"
              exit 1
            fi
            current="$(ssh 127.0.0.1 readlink /srv/apps/probe/web/current)"
            if [ "${current}" != "/srv/apps/probe/web/releases/${healthy}" ]; then
              echo "::error::current is ${current}, not the healthy release ${healthy}"
              exit 1
            fi
            files="$(ssh 127.0.0.1 systemctl show --property=EnvironmentFiles --value probe-web)"
            if [ "${files%% *}" != "${expected}" ]; then
              echo "::error::the unit reads ${files}, not ${expected}"
              exit 1
            fi
            test "$(ssh 127.0.0.1 cat "${expected}")" = "PROBE_START=serve"
            uv run cloudfall health probe-web --project .
            ssh 127.0.0.1 systemctl restart probe-web
            uv run cloudfall health probe-web --project .
          done
          # The failed redeploy copy and its environment file are gone
          test -z "$(ssh 127.0.0.1 find /srv/apps/probe/web/releases \
            /srv/apps/probe/web/shared/env -name "'*.redeploy-*'")"

      # cloudfall restart starts a new process of the same release behind
      # the health check
      - name: Restart the component
        if: steps.harness.outputs.present == 'true'
        run: |
          before="$(ssh 127.0.0.1 systemctl show --property=MainPID --value probe-web)"
          uv run cloudfall restart probe-web --project . --yes
          after="$(ssh 127.0.0.1 systemctl show --property=MainPID --value probe-web)"
          if [ "${after}" = "0" ] || [ "${after}" = "${before}" ]; then
            echo "::error::probe-web runs as PID ${after}, not a new process (was ${before})"
            exit 1
          fi
          test "$(ssh 127.0.0.1 readlink /srv/apps/probe/web/current)" \
            = "/srv/apps/probe/web/releases/${healthy}"
          uv run cloudfall health probe-web --project .

      # No ACME server reaches the container, so the job places a self-signed
      # certificate where certbot would, and domains apply renders the TLS
      # virtual host without --issue-certificate; the host then serves the
      # probe over HTTPS with that certificate and redirects HTTP to it
      - name: Serve the probe through an nginx Domain with a self-signed certificate
        if: steps.harness.outputs.present == 'true'
        run: |
          name=probe.converge.test
          install --directory --mode=0700 tmp/tls
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes \
            -days 2 -subj "/CN=${name}" -addext "subjectAltName=DNS:${name}" \
            -keyout tmp/tls/privkey.pem -out tmp/tls/fullchain.pem 2>/dev/null
          ssh 127.0.0.1 install --directory --mode=0755 "/etc/letsencrypt/live/${name}"
          ssh 127.0.0.1 "cat > /etc/letsencrypt/live/${name}/fullchain.pem" \
            < tmp/tls/fullchain.pem
          ssh 127.0.0.1 "umask 077 && cat > /etc/letsencrypt/live/${name}/privkey.pem" \
            < tmp/tls/privkey.pem
          ssh 127.0.0.1 "grep --quiet ' ${name}\$' /etc/hosts || echo '127.0.0.1 ${name}' >> /etc/hosts"
          uv run cloudfall domains apply probe-site --project . --yes
          test -f record/deployments/probe-site.json
          ssh 127.0.0.1 python3 - "${name}" <<'PY'
          import http.client
          import ssl
          import sys

          name = sys.argv[1]
          context = ssl.create_default_context(
              cafile=f"/etc/letsencrypt/live/{name}/fullchain.pem"
          )
          # The certificate is its own issuer; strict mode wants a CA apart
          context.verify_flags &= ~ssl.VERIFY_X509_STRICT
          secure = http.client.HTTPSConnection(name, 443, context=context, timeout=10)
          secure.request("GET", "/health")
          status = secure.getresponse().status
          if status != 200:
              sys.exit(f"https://{name}/health answered {status}, not 200")
          plain = http.client.HTTPConnection(name, 80, timeout=10)
          plain.request("GET", "/health")
          response = plain.getresponse()
          location = response.getheader("Location")
          if response.status != 301 or location != f"https://{name}/health":
              sys.exit(f"http://{name}/health answered {response.status} {location}")
          PY

      - name: Roll back to a release and get its environment back
        if: steps.harness.outputs.present == 'true'
        run: |
          uv run cloudfall deploy probe-web --project . --release "${second}" \
            --env-file tmp/env/good.env --yes
          uv run cloudfall rollback probe-web --project . --release "${healthy}" --yes
          test "$(ssh 127.0.0.1 readlink /srv/apps/probe/web/current)" \
            = "/srv/apps/probe/web/releases/${healthy}"
          files="$(ssh 127.0.0.1 systemctl show --property=EnvironmentFiles --value probe-web)"
          test "${files%% *}" = "/srv/apps/probe/web/shared/env/probe-web.${healthy}.env"
          uv run cloudfall health probe-web --project .

      # The drill fails on a dump that holds no table (#225), so each database
      # gets one first
      - name: Back up and run the restore drill
        if: steps.harness.outputs.present == 'true'
        run: |
          for database in probe ledger; do
            ssh 127.0.0.1 runuser -u postgres -- psql --dbname="${database}" --set=ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE IF NOT EXISTS visits (id integer PRIMARY KEY);
          INSERT INTO visits SELECT generate_series(1, 100) ON CONFLICT DO NOTHING;
          SQL
          done
          for service in postgresql-main redis-cache; do
            uv run cloudfall backup run "${service}" --project .
            uv run cloudfall backup verify "${service}" --project .
          done

      # Every playbook runs, so one run names each that is not idempotent
      - name: Converge again, changing nothing
        if: steps.harness.outputs.present == 'true'
        run: |
          changed=()
          for playbook in bootstrap baseline services; do
            uv run cloudfall-engine playbook run "${playbook}" 2>&1 \
              | tee "tmp/rerun-${playbook}.log"
            recap="$(grep -E 'ok=[0-9]+ +changed=[0-9]+' "tmp/rerun-${playbook}.log")"
            if [ -z "${recap}" ]; then
              echo "::error::${playbook} printed no play recap"
              exit 1
            fi
            if grep -E 'changed=[1-9]' <<<"${recap}"; then
              echo "::error::${playbook} changed the host on its second run"
              awk '/^(TASK|RUNNING HANDLER) /{task=$0} /^changed:/{print task; print}' \
                "tmp/rerun-${playbook}.log"
              changed+=("${playbook}")
            fi
          done
          test "${#changed[@]}" -eq 0

      - name: Show the host's state after a failure
        if: failure() && steps.harness.outputs.present == 'true'
        run: |
          docker exec converge systemctl --no-pager --failed
          docker exec converge journalctl --no-pager --lines=300
