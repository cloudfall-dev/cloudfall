---
argument_specs:
  main:
    short_description: Migrate one external PostgreSQL database into a declared service
    options:
      cloudfall_data_migration_service:
        type: dict
        required: true
        description: The rendered declared PostgreSQL service receiving the data
      cloudfall_data_migration_database:
        type: str
        required: true
        description: Declared database name inside the service to restore into
      cloudfall_data_migration_source_url_file:
        type: path
        required: true
        description: >-
          Controller-side file whose only content is the source database
          connection URL; the URL itself never crosses a command line
      cloudfall_data_migration_schemas:
        type: list
        elements: str
        required: false
        default: []
        description: >-
          Source schemas to copy; empty copies every non-system schema of the
          source, as a pg_dump without --schema does
      cloudfall_data_migration_receipt_directory:
        type: str
        required: false
        default: ""
        description: Controller directory receiving the migration receipt
      cloudfall_data_migration_url_path:
        type: path
        required: false
        default: /root/.cloudfall-data-source-url
      cloudfall_data_migration_dump_path:
        type: path
        required: false
        default: /var/tmp/cloudfall-data-migration.dump
      cloudfall_data_migration_count_query:
        type: str
        required: false
        description: >-
          Deterministic per-table row-count query used on both sides; it reads
          the selected schemas from the psql variable cloudfall_data_schemas
          and returns one schema,table,rows line per base table
      cloudfall_data_migration_source_schemas_query:
        type: str
        required: false
        description: >-
          Query returning every non-system schema of the source as one JSON
          array, used when no schema is named
      cloudfall_data_migration_target_tables_query:
        type: str
        required: false
        description: >-
          Query counting the target's tables in the selected schemas, read
          from the psql variable cloudfall_data_schemas
