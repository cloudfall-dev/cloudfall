---
argument_specs:
  main:
    short_description: Install Alloy without removing legacy log agents
    options: &cloudfall_logging_collector_options
      cloudfall_logging_collector_stack:
        type: dict
        required: true
        options:
          id:
            type: str
            required: true
          environment:
            type: str
            required: true
          migration:
            type: dict
            required: true
            options:
              mode:
                type: str
                choices:
                  - parallel
                  - none
                required: true
              preserveLegacyAgents:
                type: bool
                required: false
          software:
            type: dict
            required: true
            options:
              lokiPackageVersion:
                type: str
                required: true
              grafanaPackageVersion:
                type: str
                required: true
              alloyPackageVersion:
                type: str
                required: true
              prometheusPackageVersion:
                type: str
          metrics:
            type: dict
            required: true
            options:
              backend:
                type: dict
                required: true
              collection:
                type: dict
                required: true
                options:
                  intervalSeconds:
                    type: int
                    required: true
          backend:
            type: dict
            required: true
          gateway:
            type: dict
            required: true
            options:
              serverName:
                type: str
                required: true
              listenAddress:
                type: str
                required: true
              port:
                type: int
                required: true
              tls:
                type: dict
                required: true
          grafana:
            type: dict
            required: true
          alerting:
            type: dict
          collectors:
            type: dict
            required: true
            options:
              servers:
                type: list
                elements: str
                required: true
              clientTls:
                type: dict
                required: true
                options:
                  caPath:
                    type: path
                    required: true
                  certificatePath:
                    type: path
                    required: true
                  keyPath:
                    type: path
                    required: true
              journal:
                type: dict
                required: true
                options:
                  enabled:
                    type: bool
                    required: true
                  maxAgeHours:
                    type: int
                    required: true
              files:
                type: list
                elements: dict
                required: true
      cloudfall_services:
        type: list
        elements: dict
        default: []
      cloudfall_logging_collector_metrics_role:
        type: str
        default: alloy
      cloudfall_logging_collector_credentials_directory:
        type: path
        default: /run/credentials/alloy.service
      cloudfall_logging_collector_elasticsearch_password_path:
        type: path
        default: /etc/elasticsearch/cloudfall-password
      cloudfall_logging_collector_elasticsearch_ca_path:
        type: path
        default: /etc/elasticsearch/certs/ca.crt
  # services.yml re-renders the exporters of a converged host (#329)
  exporters:
    short_description: Re-render the Alloy files where logging deploy set Alloy up
    options: *cloudfall_logging_collector_options
