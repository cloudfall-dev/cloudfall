---
cloudfall_logging_collector_stack: {}
cloudfall_logging_collector_metrics_role: alloy
cloudfall_logging_collector_grafana_repository_key_url: >-
  https://apt.grafana.com/gpg-full.key
cloudfall_logging_collector_grafana_repository_key_path: /etc/apt/keyrings/grafana.asc
cloudfall_logging_collector_grafana_repository_url: https://apt.grafana.com
# Owner of the files Cloudfall delivers (S-011); the tasks that follow give
# Alloy its own read access, as for files provided by hand
cloudfall_logging_collector_file_owner: root
cloudfall_logging_collector_file_group: root
# Where the gateway name is pinned to the backend's address (S-011)
cloudfall_logging_collector_hosts_file: /etc/hosts
# Where the APT preferences that hold the pinned packages go (#294)
cloudfall_logging_collector_apt_preferences_dir: /etc/apt/preferences.d
