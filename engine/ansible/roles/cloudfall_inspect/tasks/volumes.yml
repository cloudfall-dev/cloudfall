---
# Volumes the server's host requirements name (S-014): LVM's report and what
# is mounted at each path, read only
- name: Read LVM's report of logical volumes
  ansible.builtin.command:
    argv:
      - lvs
      - -a
      - --reportformat
      - json
      - --units
      - b
      - --nosuffix
      - -o
      - lv_name,vg_name,segtype,lv_size,devices,lv_dm_path,lv_health_status
  register: cloudfall_inspect_lvs
  changed_when: false
  failed_when: false

- name: Read LVM's physical volume names
  ansible.builtin.command:
    argv: [pvs, --reportformat, json, -o, pv_name]
  register: cloudfall_inspect_pvs
  changed_when: false
  failed_when: false

# realpath follows every link (by-id, by-path, by-partuuid, /dev/mapper), so
# audit compares the devices a declared path and an LV's devices name (#293).
# It exits 1 when a path does not resolve; its message is evidence. Any other
# exit fails the task.
- name: Resolve each declared physical volume and each LVM one to its device
  ansible.builtin.command:
    argv: [realpath, --canonicalize-existing, --, "{{ cloudfall_inspect_device_path }}"]
  loop: >-
    {{ ((cloudfall_inspect_volumes | map(attribute='physicalVolumes') | flatten)
        + cloudfall_inspect_pv_names) | unique | list }}
  loop_control:
    loop_var: cloudfall_inspect_device_path
  register: cloudfall_inspect_devices
  changed_when: false
  failed_when: cloudfall_inspect_devices.rc not in [0, 1]
  vars:
    cloudfall_inspect_pv_names: >-
      {{ ((cloudfall_inspect_pvs.stdout | from_json).report
          | map(attribute='pv', default=[]) | flatten
          | map(attribute='pv_name') | list)
         if cloudfall_inspect_pvs.rc == 0 else [] }}

- name: Read what is mounted at each volume's path
  ansible.builtin.command:
    argv:
      - findmnt
      - --noheadings
      - --output
      - SOURCE
      - --mountpoint
      - "{{ cloudfall_inspect_volume_item.path }}"
  loop: "{{ cloudfall_inspect_volumes }}"
  loop_control:
    loop_var: cloudfall_inspect_volume_item
    label: "{{ cloudfall_inspect_volume_item.path }}"
  register: cloudfall_inspect_volume_mounts
  changed_when: false
  failed_when: cloudfall_inspect_volume_mounts.rc not in [0, 1]

- name: Attach volume evidence
  ansible.builtin.set_fact:
    cloudfall_inspect_snapshot: >-
      {{
        cloudfall_inspect_snapshot | combine(
          {'spec': {'volumes': {
            'lvsJson': (cloudfall_inspect_lvs.stdout
                        if cloudfall_inspect_lvs.rc == 0 else none),
            'mounts': cloudfall_inspect_volume_mount_evidence,
            'devices': cloudfall_inspect_device_evidence}}},
          recursive=true
        )
      }}
  vars:
    cloudfall_inspect_device_evidence: >-
      {%- set found = {} -%}
      {%- for read in cloudfall_inspect_devices.results -%}
      {%- set _ = found.update({read.cloudfall_inspect_device_path: {
            'device': (read.stdout | trim) if read.rc == 0 else none,
            'error': none if read.rc == 0 else (read.stderr | trim)}}) -%}
      {%- endfor -%}
      {{ found }}
    cloudfall_inspect_volume_mount_evidence: >-
      {%- set found = {} -%}
      {%- for read in cloudfall_inspect_volume_mounts.results -%}
      {%- set _ = found.update({read.cloudfall_inspect_volume_item.path:
            (read.stdout | trim) if read.rc == 0 else none}) -%}
      {%- endfor -%}
      {{ found }}
