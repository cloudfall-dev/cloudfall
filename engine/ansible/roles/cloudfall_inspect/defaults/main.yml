---
cloudfall_inspect_collector_version: "0.4.0"
cloudfall_inspect_logging_backend: {}
cloudfall_inspect_components: []
cloudfall_inspect_baseline: {}
cloudfall_inspect_server_id: ""
# The certificates the server's host requirements name (S-011): [{name, path}]
cloudfall_inspect_certificates: []
# The volumes the server's host requirements name (S-014):
# [{name, path, physicalVolumes}]
cloudfall_inspect_volumes: []
# The AlertChannel the server's baseline names (S-015), or empty
cloudfall_inspect_alert_channel: ""
cloudfall_inspect_alerting_root: /etc/cloudfall/alerting
cloudfall_inspect_alerting_sender: /usr/local/sbin/cloudfall-alert
cloudfall_inspect_mdadm_conf: /etc/mdadm/mdadm.conf
cloudfall_inspect_smartd_conf: /etc/smartd.conf
# The Elasticsearch services whose home is this server (S-012): their users
# and roles are read here, once per cluster
cloudfall_inspect_elasticsearch_services: []
cloudfall_inspect_elasticsearch_password_path: /etc/elasticsearch/cloudfall-password
# The bundled Grafana dashboards on a logging backend (S-016); the backend role writes here
cloudfall_inspect_grafana_dashboards: /etc/grafana/dashboards/cloudfall
