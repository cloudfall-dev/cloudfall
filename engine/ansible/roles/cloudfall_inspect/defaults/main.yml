---
cloudfall_inspect_collector_version: "0.4.0"
cloudfall_inspect_logging_backend: {}
cloudfall_inspect_components: []
cloudfall_inspect_baseline: {}
cloudfall_inspect_server_id: ""
# The certificates the server's host requirements name (S-011): [{name, path}]
cloudfall_inspect_certificates: []
# The volumes the server's host requirements name (S-014):
# [{name, path, physicalVolumes}]
cloudfall_inspect_volumes: []
# The AlertChannel the server's baseline names (S-015), or empty
cloudfall_inspect_alert_channel: ""
# The configuration file of the Elasticsearch node on the server (S-012), or
# empty when the server is no node
cloudfall_inspect_elasticsearch_configuration: ""
cloudfall_inspect_alerting_root: /etc/cloudfall/alerting
cloudfall_inspect_alerting_sender: /usr/local/sbin/cloudfall-alert
cloudfall_inspect_mdadm_conf: /etc/mdadm/mdadm.conf
cloudfall_inspect_smartd_conf: /etc/smartd.conf
# The Elasticsearch services whose home is this server (S-012): their users
# and roles are read here, once per cluster
cloudfall_inspect_elasticsearch_services: []
cloudfall_inspect_elasticsearch_password_path: /etc/elasticsearch/cloudfall-password
# The project CA a node with remoteAccess serves HTTPS under
# (elasticsearch_cluster.TRANSPORT_CA_PATH)
cloudfall_inspect_elasticsearch_ca_path: /etc/elasticsearch/certs/ca.crt
# The MariaDB services of this server (S-019): their databases and users are
# read as root through the socket, never a password or hash
cloudfall_inspect_mariadb_services: []
cloudfall_inspect_mariadb_client: /usr/bin/mariadb
# The one file the MariaDB role writes its managed settings to
cloudfall_inspect_mariadb_settings_path: /etc/mysql/mariadb.conf.d/90-cloudfall.cnf
# The fields of SHOW SLAVE STATUS audit reads, one "Field: value" line each
cloudfall_inspect_mariadb_link_pattern: >-
  ^\s*(Slave_IO_Running|Slave_SQL_Running|Seconds_Behind_Master|Master_Server_Id):\s*(.*?)\s*$
cloudfall_inspect_mariadb_queries:
  users: >-
    SELECT CONCAT(User, '@', Host) FROM mysql.global_priv WHERE Host <> ''
  managedUsers: >-
    SELECT CONCAT(User, '@', Host) FROM mysql.roles_mapping
    WHERE Role = 'cloudfall-managed' AND Admin_option = 'N'
  # The flag reads 'true' on the older series and 1 on 11.8, as in
  # cloudfall_mariadb_account_locked (#452)
  lockedUsers: >-
    SELECT CONCAT(User, '@', Host) FROM mysql.global_priv
    WHERE JSON_VALUE(Priv, '$.account_locked') IN ('true', '1')
  # Each remote account's TLS requirement as "user@host TYPE": an absent
  # ssl_type is 0 (NONE); REQUIRE SSL, which converge sets, is 1 (ANY)
  sslTypes: >-
    SELECT CONCAT(User, '@', Host, ' ',
    ELT(IFNULL(JSON_VALUE(Priv, '$.ssl_type'), '0') + 1,
    'NONE', 'ANY', 'X509', 'SPECIFIED'))
    FROM mysql.global_priv WHERE Host NOT IN ('', 'localhost')
  databases: SELECT SCHEMA_NAME FROM information_schema.SCHEMATA
  managedDatabases: >-
    SELECT DISTINCT REPLACE(d.Db, '\\_', '_') FROM mysql.db d
    JOIN mysql.roles_mapping m ON m.User = d.User AND m.Host = d.Host
    WHERE m.Role = 'cloudfall-managed' AND m.Admin_option = 'N'
# The bundled Grafana dashboards on a logging backend (S-016); the backend role writes here
cloudfall_inspect_grafana_dashboards: /etc/grafana/dashboards/cloudfall
