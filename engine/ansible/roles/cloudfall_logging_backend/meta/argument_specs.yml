---
argument_specs:
  main:
    short_description: Install a loopback backend and mTLS ingestion gateway
    options:
      cloudfall_logging_backend_stack:
        type: dict
        required: true
        options:
          id:
            type: str
            required: true
          environment:
            type: str
            required: true
          migration:
            type: dict
            required: true
            options:
              mode:
                type: str
                choices:
                  - parallel
                  - none
                required: true
              preserveLegacyAgents:
                type: bool
                required: false
          software:
            type: dict
            required: true
            options:
              lokiPackageVersion:
                type: str
                required: true
              grafanaPackageVersion:
                type: str
                required: true
              alloyPackageVersion:
                type: str
                required: true
              prometheusPackageVersion:
                type: str
          metrics:
            type: dict
            required: true
            options:
              backend:
                type: dict
                required: true
                options:
                  listenAddress:
                    type: str
                    choices:
                      - 127.0.0.1
                    required: true
                  port:
                    type: int
                    required: true
                  storagePath:
                    type: path
                    required: true
                  retentionHours:
                    type: int
                    required: true
              collection:
                type: dict
                required: true
                options:
                  intervalSeconds:
                    type: int
                    required: true
          backend:
            type: dict
            required: true
            options:
              server:
                type: str
                required: true
              listenAddress:
                type: str
                choices:
                  - 127.0.0.1
                required: true
              port:
                type: int
                required: true
              storage:
                type: dict
                required: true
                options:
                  type:
                    type: str
                    choices:
                      - filesystem
                    required: true
                  path:
                    type: path
                    required: true
              retentionHours:
                type: int
                required: true
          gateway:
            type: dict
            required: true
            options:
              serverName:
                type: str
                required: true
              listenAddress:
                type: str
                choices:
                  - 0.0.0.0
                  - "::"
                required: true
              port:
                type: int
                required: true
              tls:
                type: dict
                required: true
                options:
                  certificatePath:
                    type: path
                    required: true
                  keyPath:
                    type: path
                    required: true
                  clientCaPath:
                    type: path
                    required: true
          grafana:
            type: dict
            required: true
            options:
              listenAddress:
                type: str
                choices:
                  - 127.0.0.1
                required: true
              port:
                type: int
                required: true
              adminPasswordPath:
                type: path
                required: true
          collectors:
            type: dict
            required: true
            options:
              servers:
                type: list
                elements: str
                required: true
              clientTls:
                type: dict
                required: true
                options:
                  caPath:
                    type: path
                    required: true
                  certificatePath:
                    type: path
                    required: true
                  keyPath:
                    type: path
                    required: true
              journal:
                type: dict
                required: true
                options:
                  enabled:
                    type: bool
                    required: true
                  maxAgeHours:
                    type: int
                    required: true
              files:
                type: list
                elements: dict
                required: true
          alerting:
            type: dict
            options:
              alertmanager:
                type: dict
                required: true
                options:
                  listenAddress:
                    type: str
                    choices:
                      - 127.0.0.1
                    required: true
                  port:
                    type: int
                    required: true
                  packageVersion:
                    type: str
              receivers:
                type: list
                elements: dict
                required: true
      cloudfall_alert_rules:
        type: list
        elements: dict
        default: []
        options:
          id:
            type: str
            required: true
          environment:
            type: str
            required: true
          expr:
            type: str
            required: true
          for:
            type: str
            required: true
          severity:
            type: str
            choices:
              - warning
              - critical
            required: true
          summary:
            type: str
            required: true
