---
# Secrets Cloudfall keeps for the stack (S-011), by server id: each item names
# the host path the stack declares and a 0600 file the controller staged with
# its value. A file already on the host is kept as it is, so a secret a person
# provided by hand is never overwritten.
- name: Create directories for delivered logging secrets
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ cloudfall_logging_backend_secret_owner }}"
    group: "{{ cloudfall_logging_backend_secret_group }}"
    mode: "0755"
  loop: >-
    {{ cloudfall_logging_secret_files[cloudfall_server_id]
       | map(attribute='path') | map('dirname') | unique | list }}

- name: Deliver logging secrets kept by Cloudfall
  ansible.builtin.copy:
    src: "{{ item.source }}"
    dest: "{{ item.path }}"
    owner: "{{ cloudfall_logging_backend_secret_owner }}"
    group: "{{ cloudfall_logging_backend_secret_group }}"
    mode: "0600"
    force: false
  loop: "{{ cloudfall_logging_secret_files[cloudfall_server_id] }}"
  loop_control:
    label: "{{ item.path }}"
  no_log: true
