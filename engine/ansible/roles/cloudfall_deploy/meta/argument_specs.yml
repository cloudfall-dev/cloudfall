---
argument_specs:
  main:
    short_description: Deploy one verified release of a declared component
    options:
      cloudfall_deploy_component:
        type: dict
        required: true
        options:
          id:
            type: str
            required: true
          application:
            type: str
            required: true
          application_user:
            type: str
            required: true
          install_root:
            type: path
            required: true
          repository:
            type: dict
            required: true
          runtime:
            type: dict
            required: true
            options:
              type:
                type: str
                required: true
              version:
                type: str
                required: true
              packageManager:
                type: str
                required: true
          service:
            type: dict
            required: true
            options:
              manager:
                type: str
                choices:
                  - systemd
                required: true
              name:
                type: str
                required: true
              command:
                type: list
                elements: str
                required: true
          healthCheck:
            type: dict
            required: true
            options:
              type:
                type: str
                choices:
                  - http
                  - none
                required: true
              scheme:
                type: str
                choices:
                  - http
                  - https
              port:
                type: int
              path:
                type: str
              expectedStatuses:
                type: list
                elements: int
              timeoutSeconds:
                type: int
              attempts:
                type: int
          retainUntilCleanup:
            type: bool
            required: true
          release:
            type: dict
            options:
              command:
                type: list
                elements: str
                required: true
              workingDirectory:
                type: str
              timeoutSeconds:
                type: int
                required: true
              server:
                type: str
                required: true
      cloudfall_deploy_release:
        type: str
        required: true
      cloudfall_deploy_artifact_archive:
        type: str
        required: true
      cloudfall_deploy_artifact_sha256:
        type: str
        required: true
      cloudfall_deploy_environment_file:
        type: str
        default: ""
      cloudfall_deploy_receipt_directory:
        type: str
        default: ""
      cloudfall_deploy_unit_settle_seconds:
        type: int
        default: 10
      cloudfall_deploy_systemd_run:
        type: str
        default: /usr/bin/systemd-run
      cloudfall_deploy_release_output_characters:
        type: int
        default: 2000
      cloudfall_deploy_release_failure_characters:
        type: int
        default: 500
      cloudfall_deploy_uv_version:
        type: str
        default: "0.12.10"
      cloudfall_deploy_uv_sha256:
        type: str
      cloudfall_deploy_uv_url:
        type: str
  rollback:
    short_description: Roll one component back to an existing release
    options:
      cloudfall_deploy_component:
        type: dict
        required: true
      cloudfall_deploy_release:
        type: str
        required: true
  restart:
    short_description: Restart one component behind its health check
    options:
      cloudfall_deploy_component:
        type: dict
        required: true
  health:
    short_description: Probe one component's declared health check
    options:
      cloudfall_deploy_component:
        type: dict
        required: true
