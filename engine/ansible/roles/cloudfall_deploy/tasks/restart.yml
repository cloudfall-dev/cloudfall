---
# Until cloudfall-dev/cloudfall#166 runs it, a command health check fails here,
# before anything changes, rather than letting the restart pass an unrun gate.
- name: Refuse a command health check this engine does not run yet
  ansible.builtin.fail:
    msg: >-
      Component {{ cloudfall_deploy_component.id }} declares a command health
      check, which this engine does not run yet
      (cloudfall-dev/cloudfall#166); nothing was changed
  when: cloudfall_deploy_component.healthCheck.type == "command"

- name: Validate restart target and declaration
  ansible.builtin.assert:
    that:
      - ansible_facts["distribution"] == "Debian"
      - ansible_facts["service_mgr"] == "systemd"
      - cloudfall_deploy_component.service.manager == "systemd"
    fail_msg: Restart requires a Debian systemd host

- name: Restart the component service
  ansible.builtin.systemd_service:
    name: "{{ cloudfall_deploy_component.service.name }}.service"
    state: restarted
    daemon_reload: true

- name: Require the restarted component to pass its health check
  ansible.builtin.include_tasks: health_gate.yml
