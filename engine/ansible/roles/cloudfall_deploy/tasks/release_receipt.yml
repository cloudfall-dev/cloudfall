---
# Records this server's entry in the run's release receipt, then writes the
# receipt: after the health gate passed, and from the gate's rescue after a
# failed command health check, with cloudfall_deploy_receipt_passed saying
# which. A component with a command health check records its result under
# healthCheck; http and none do not. release is the release the server ended
# on: the deployed one when its gate passed, the restored one (null for a
# first release that was stopped) when it failed. previousRelease is a release
# id: a same-release redeploy's directory, <release>.redeploy-<time>, names
# its release before the first dot.
#
# The entries of a run are a fact of the controller (localhost), a mapping
# from server to entry, so every server of the run, in every play of
# deploy.yml, adds to the same mapping in the order the servers deployed, and
# a rollback changes an entry where it is. The servers deploy one at a time
# (serial: 1), so one server at a time changes the entries and writes the
# receipt from them: the controller is the one place the receipt is written.
- name: Record the server's entry in the run's release receipt
  ansible.builtin.set_fact:
    cloudfall_deploy_run_entries: >-
      {{
        hostvars['localhost'].cloudfall_deploy_run_entries | default({})
        | combine({
          cloudfall_server_id: {
            'server': cloudfall_server_id,
            'release': (
              cloudfall_deploy_release
              if cloudfall_deploy_receipt_passed | bool
              else cloudfall_deploy_receipt_previous_release
            ),
            'previousRelease': cloudfall_deploy_receipt_previous_release,
            'deployedAt': ansible_facts['date_time']['iso8601'],
            'healthCheckPassed': cloudfall_deploy_receipt_passed | bool,
            'rolledBack': not cloudfall_deploy_receipt_passed | bool,
          } | combine(
            {'healthCheck': cloudfall_deploy_command_health_result}
            if cloudfall_deploy_component.healthCheck.type == 'command'
            else {}
          )
        })
      }}
  vars:
    cloudfall_deploy_receipt_previous_release: >-
      {{
        (cloudfall_deploy_previous_directory | basename).split('.') | first
        if cloudfall_deploy_previous_directory | length > 0
        else none
      }}
  delegate_to: localhost
  delegate_facts: true
  become: false
  when: not ansible_check_mode

- name: Write the run's release receipt
  ansible.builtin.include_tasks: receipt_write.yml
