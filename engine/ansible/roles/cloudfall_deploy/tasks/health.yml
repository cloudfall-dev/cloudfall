---
# Until cloudfall-dev/cloudfall#166 runs it, a command health check fails here
# rather than reporting healthy without having run.
- name: Refuse a command health check this engine does not run yet
  ansible.builtin.fail:
    msg: >-
      Component {{ cloudfall_deploy_component.id }} declares a command health
      check, which this engine does not run yet
      (cloudfall-dev/cloudfall#166); nothing was changed
  when: cloudfall_deploy_component.healthCheck.type == "command"

- name: Probe the component's declared health check
  ansible.builtin.include_tasks: health_gate.yml
