---
# Until cloudfall-dev/cloudfall#164 runs it, a command health check fails here,
# before anything changes, rather than letting the deploy pass an unrun gate.
- name: Refuse a command health check this engine does not run yet
  ansible.builtin.fail:
    msg: >-
      Component {{ cloudfall_deploy_component.id }} declares a command health
      check, which this engine does not run yet
      (cloudfall-dev/cloudfall#164); nothing was changed
  when: cloudfall_deploy_component.healthCheck.type == "command"

- name: Validate deployment target and declaration
  ansible.builtin.assert:
    that:
      - ansible_facts["distribution"] == "Debian"
      - ansible_facts["service_mgr"] == "systemd"
      - ansible_facts["architecture"] == "x86_64"
      - cloudfall_deploy_component.service.manager == "systemd"
      - cloudfall_deploy_component.runtime.type == "python"
      - cloudfall_deploy_component.runtime.packageManager == "uv"
      - cloudfall_deploy_release | length > 0
      - cloudfall_deploy_artifact_sha256 | length == 64
    fail_msg: >-
      The first deploy slice supports Debian x86_64 hosts and Python
      components managed by uv under systemd

- name: Compute release paths
  ansible.builtin.set_fact:
    cloudfall_deploy_release_directory: >-
      {{ cloudfall_deploy_component.install_root }}/releases/{{
        cloudfall_deploy_release
      }}
    cloudfall_deploy_current_link: >-
      {{ cloudfall_deploy_component.install_root }}/current
    cloudfall_deploy_shared_directory: >-
      {{ cloudfall_deploy_component.install_root }}/shared
    cloudfall_deploy_staging_archive: >-
      /tmp/cloudfall-{{ cloudfall_deploy_component.id }}-{{
        cloudfall_deploy_release
      }}.tar.gz

- name: Check the installed uv version
  ansible.builtin.command:
    argv:
      - /usr/local/bin/uv
      - --version
  register: cloudfall_deploy_uv_installed
  changed_when: false
  failed_when: false

- name: Install the pinned uv release
  when: >-
    cloudfall_deploy_uv_installed.rc != 0
    or cloudfall_deploy_uv_version not in cloudfall_deploy_uv_installed.stdout
  block:
    - name: Download the pinned uv archive
      ansible.builtin.get_url:
        url: "{{ cloudfall_deploy_uv_url }}"
        dest: /tmp/cloudfall-uv.tar.gz
        checksum: "sha256:{{ cloudfall_deploy_uv_sha256 }}"
        mode: "0644"

    - name: Unpack the uv archive
      ansible.builtin.unarchive:
        src: /tmp/cloudfall-uv.tar.gz
        dest: /tmp
        remote_src: true

    - name: Install the uv binary
      ansible.builtin.copy:
        src: /tmp/uv-x86_64-unknown-linux-gnu/uv
        dest: /usr/local/bin/uv
        remote_src: true
        owner: root
        group: root
        mode: "0755"

- name: Create release and shared directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ cloudfall_deploy_component.application_user }}"
    group: "{{ cloudfall_deploy_component.application_user }}"
    mode: "0755"
  loop:
    - "{{ cloudfall_deploy_component.install_root }}/releases"
    - "{{ cloudfall_deploy_release_directory }}"
    - "{{ cloudfall_deploy_shared_directory }}"
    - "{{ cloudfall_deploy_shared_directory }}/env"
    - "{{ cloudfall_deploy_shared_directory }}/uv"

- name: Transfer the release artifact
  ansible.builtin.copy:
    src: "{{ cloudfall_deploy_artifact_archive }}"
    dest: "{{ cloudfall_deploy_staging_archive }}"
    owner: root
    group: root
    mode: "0644"

- name: Verify the transferred artifact digest
  ansible.builtin.stat:
    path: "{{ cloudfall_deploy_staging_archive }}"
    checksum_algorithm: sha256
  register: cloudfall_deploy_staged

- name: Refuse a release whose digest does not match its metadata
  ansible.builtin.assert:
    that:
      - cloudfall_deploy_staged.stat.checksum
        == cloudfall_deploy_artifact_sha256
    fail_msg: >-
      Transferred artifact digest does not match the declared
      artifact metadata

- name: Unpack the verified release
  ansible.builtin.unarchive:
    src: "{{ cloudfall_deploy_staging_archive }}"
    dest: "{{ cloudfall_deploy_release_directory }}"
    remote_src: true
    owner: "{{ cloudfall_deploy_component.application_user }}"
    group: "{{ cloudfall_deploy_component.application_user }}"

- name: Remove the staged archive
  ansible.builtin.file:
    path: "{{ cloudfall_deploy_staging_archive }}"
    state: absent

- name: Install the component environment file
  ansible.builtin.copy:
    src: "{{ cloudfall_deploy_environment_file }}"
    dest: >-
      {{ cloudfall_deploy_shared_directory }}/env/{{
        cloudfall_deploy_component.id
      }}.env
    owner: root
    group: "{{ cloudfall_deploy_component.application_user }}"
    mode: "0640"
  when: cloudfall_deploy_environment_file | length > 0

- name: Materialize locked dependencies for the release
  ansible.builtin.command:
    argv:
      - /usr/local/bin/uv
      - sync
      - --frozen
      - --no-dev
    chdir: "{{ cloudfall_deploy_release_directory }}"
  become: true
  become_user: "{{ cloudfall_deploy_component.application_user }}"
  environment:
    HOME: "{{ cloudfall_deploy_shared_directory }}"
    UV_CACHE_DIR: "{{ cloudfall_deploy_shared_directory }}/uv/cache"
    UV_PYTHON_INSTALL_DIR: "{{ cloudfall_deploy_shared_directory }}/uv/python"
  changed_when: true

- name: Run the release command on the release server
  ansible.builtin.include_tasks: release_command.yml
  when:
    - not ansible_check_mode
    - cloudfall_deploy_component.release is defined
    - cloudfall_deploy_component.release.server == cloudfall_server_id

- name: Require the release command to have passed before switching
  ansible.builtin.assert:
    that:
      - cloudfall_deploy_release_evidence is mapping
      - cloudfall_deploy_release_evidence.exitCode == 0
    fail_msg: >-
      The release command of {{ cloudfall_deploy_component.id }} has not run
      on its release server {{ cloudfall_deploy_component.release.server }}
      in this deploy, so {{ cloudfall_server_id }} does not switch
  vars:
    cloudfall_deploy_release_evidence: >-
      {{
        hostvars[cloudfall_deploy_component.release.server]
        .cloudfall_deploy_release_command_result
        | default(none)
      }}
  when:
    - not ansible_check_mode
    - cloudfall_deploy_component.release is defined

- name: Inspect the currently active release
  ansible.builtin.stat:
    path: "{{ cloudfall_deploy_current_link }}"
    follow: false
    get_checksum: false
  register: cloudfall_deploy_current

- name: Record the rollback candidate
  ansible.builtin.set_fact:
    cloudfall_deploy_previous_directory: >-
      {{
        cloudfall_deploy_current.stat.lnk_source
        if cloudfall_deploy_current.stat.exists
        and cloudfall_deploy_current.stat.islnk
        else ""
      }}

- name: Compute service unit paths
  ansible.builtin.set_fact:
    cloudfall_deploy_unit_path: >-
      /etc/systemd/system/{{ cloudfall_deploy_component.service.name }}.service
    cloudfall_deploy_unit_kept_path: >-
      /etc/systemd/system/{{
        cloudfall_deploy_component.service.name
      }}.service.pre-cloudfall

- name: Inspect the existing service unit
  ansible.builtin.stat:
    path: "{{ cloudfall_deploy_unit_path }}"
    follow: false
    checksum_algorithm: sha256
  register: cloudfall_deploy_unit_existing

- name: Read the existing service unit
  ansible.builtin.slurp:
    src: "{{ cloudfall_deploy_unit_path }}"
  register: cloudfall_deploy_unit_existing_content
  when: cloudfall_deploy_unit_existing.stat.isreg | default(false)

- name: Recognize a hand-made service unit
  ansible.builtin.set_fact:
    cloudfall_deploy_unit_hand_made: >-
      {{
        (cloudfall_deploy_unit_existing.stat.isreg | default(false))
        and not (
          cloudfall_deploy_unit_existing_content.content | b64decode
        ).startswith('# Managed by Cloudfall')
      }}

- name: Inspect the kept pre-Cloudfall service unit
  ansible.builtin.stat:
    path: "{{ cloudfall_deploy_unit_kept_path }}"
    follow: false
    checksum_algorithm: sha256
  register: cloudfall_deploy_unit_kept_before
  when: cloudfall_deploy_unit_hand_made | bool

- name: Refuse to replace a hand-made unit that differs from the one already kept
  ansible.builtin.assert:
    that:
      - not cloudfall_deploy_unit_kept_before.stat.exists
        or cloudfall_deploy_unit_kept_before.stat.checksum
        == cloudfall_deploy_unit_existing.stat.checksum
    fail_msg: >-
      {{ cloudfall_deploy_unit_path }} is not managed by Cloudfall and differs
      from the unit already kept at {{ cloudfall_deploy_unit_kept_path }};
      move one of them away so Cloudfall keeps exactly the unit it replaces
  when: cloudfall_deploy_unit_hand_made | bool

- name: Record whether the hand-made service unit is enabled
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - is-enabled
      - "{{ cloudfall_deploy_component.service.name }}.service"
  register: cloudfall_deploy_unit_was_enabled
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - cloudfall_deploy_unit_hand_made | bool

- name: Record whether the hand-made service unit is active
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - is-active
      - --quiet
      - "{{ cloudfall_deploy_component.service.name }}.service"
  register: cloudfall_deploy_unit_was_active
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - cloudfall_deploy_unit_hand_made | bool

- name: Report the hand-made service unit a deploy would replace
  ansible.builtin.debug:
    msg: >-
      {{ cloudfall_deploy_unit_path }} is not managed by Cloudfall; a deploy
      keeps it at {{ cloudfall_deploy_unit_kept_path }} and replaces it with
      the managed unit
  when:
    - ansible_check_mode
    - cloudfall_deploy_unit_hand_made | bool

- name: Keep the hand-made service unit before replacing it
  ansible.builtin.copy:
    src: "{{ cloudfall_deploy_unit_path }}"
    dest: "{{ cloudfall_deploy_unit_kept_path }}"
    remote_src: true
    force: false
    owner: root
    group: root
    mode: "0644"
  when:
    - not ansible_check_mode
    - cloudfall_deploy_unit_hand_made | bool

- name: Install the managed service unit
  ansible.builtin.template:
    src: component.service.j2
    dest: "{{ cloudfall_deploy_unit_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Activate the release behind the health gate
  block:
    - name: Switch the current release symlink
      ansible.builtin.file:
        src: "{{ cloudfall_deploy_release_directory }}"
        dest: "{{ cloudfall_deploy_current_link }}"
        state: link
        force: true
        follow: false

    - name: Restart the component service
      ansible.builtin.systemd_service:
        name: "{{ cloudfall_deploy_component.service.name }}.service"
        enabled: true
        state: restarted
        daemon_reload: true

    - name: Gate the release on its declared health check
      ansible.builtin.uri:
        url: >-
          {{ cloudfall_deploy_component.healthCheck.scheme }}://127.0.0.1:{{
            cloudfall_deploy_component.healthCheck.port
          }}{{ cloudfall_deploy_component.healthCheck.path }}
        status_code: >-
          {{ cloudfall_deploy_component.healthCheck.expectedStatuses }}
        timeout: "{{ cloudfall_deploy_component.healthCheck.timeoutSeconds }}"
        return_content: false
      register: cloudfall_deploy_health
      retries: >-
        {{ cloudfall_deploy_component.healthCheck.attempts | int - 1 }}
      delay: 3
      until: >-
        cloudfall_deploy_health.status
        in cloudfall_deploy_component.healthCheck.expectedStatuses
      when:
        - not ansible_check_mode
        - cloudfall_deploy_component.healthCheck.type == "http"

    - name: Gate the release on an active service unit
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-active
          - --quiet
          - "{{ cloudfall_deploy_component.service.name }}.service"
      register: cloudfall_deploy_unit_started
      changed_when: false
      when:
        - not ansible_check_mode
        - cloudfall_deploy_component.healthCheck.type == "none"

    - name: Read the service unit restart count before settling
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - show
          - --property=NRestarts
          - --value
          - "{{ cloudfall_deploy_component.service.name }}.service"
      register: cloudfall_deploy_unit_restarts_before
      changed_when: false
      when:
        - not ansible_check_mode
        - cloudfall_deploy_component.healthCheck.type == "none"

    - name: Let the service unit settle
      ansible.builtin.pause:
        seconds: "{{ cloudfall_deploy_unit_settle_seconds }}"
      when:
        - not ansible_check_mode
        - cloudfall_deploy_component.healthCheck.type == "none"

    - name: Gate the release on a service unit still active after settling
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-active
          - --quiet
          - "{{ cloudfall_deploy_component.service.name }}.service"
      register: cloudfall_deploy_unit_settled
      changed_when: false
      when:
        - not ansible_check_mode
        - cloudfall_deploy_component.healthCheck.type == "none"

    - name: Read the service unit restart count after settling
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - show
          - --property=NRestarts
          - --value
          - "{{ cloudfall_deploy_component.service.name }}.service"
      register: cloudfall_deploy_unit_restarts_after
      changed_when: false
      when:
        - not ansible_check_mode
        - cloudfall_deploy_component.healthCheck.type == "none"

    - name: Gate the release on a service unit that did not restart while settling
      ansible.builtin.assert:
        that:
          - cloudfall_deploy_unit_restarts_before.stdout is match('^[0-9]+$')
          - cloudfall_deploy_unit_restarts_after.stdout is match('^[0-9]+$')
          - cloudfall_deploy_unit_restarts_after.stdout | int
            == cloudfall_deploy_unit_restarts_before.stdout | int
        fail_msg: >-
          {{ cloudfall_deploy_component.service.name }}.service restarted
          while settling (NRestarts {{
            cloudfall_deploy_unit_restarts_before.stdout
          }} to {{ cloudfall_deploy_unit_restarts_after.stdout }})
      when:
        - not ansible_check_mode
        - cloudfall_deploy_component.healthCheck.type == "none"
  rescue:
    - name: Restore the previous release symlink
      ansible.builtin.file:
        src: "{{ cloudfall_deploy_previous_directory }}"
        dest: "{{ cloudfall_deploy_current_link }}"
        state: link
        force: true
        follow: false
      when: cloudfall_deploy_previous_directory | length > 0

    - name: Restart the restored release
      ansible.builtin.systemd_service:
        name: "{{ cloudfall_deploy_component.service.name }}.service"
        state: restarted
        daemon_reload: true
      when: cloudfall_deploy_previous_directory | length > 0

    - name: Stop the failed first release
      ansible.builtin.systemd_service:
        name: "{{ cloudfall_deploy_component.service.name }}.service"
        state: stopped
      when: cloudfall_deploy_previous_directory | length == 0

    - name: Restore the pre-Cloudfall service unit
      ansible.builtin.copy:
        src: "{{ cloudfall_deploy_unit_kept_path }}"
        dest: "{{ cloudfall_deploy_unit_path }}"
        remote_src: true
        force: true
        owner: root
        group: root
        mode: "0644"
      when:
        - cloudfall_deploy_previous_directory | length == 0
        - not ansible_check_mode
        - cloudfall_deploy_unit_hand_made | bool

    - name: Reload systemd for the restored pre-Cloudfall unit
      ansible.builtin.systemd_service:
        daemon_reload: true
      when:
        - cloudfall_deploy_previous_directory | length == 0
        - not ansible_check_mode
        - cloudfall_deploy_unit_hand_made | bool

    - name: Restore the enabled state of the pre-Cloudfall unit
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - >-
            {{
              'reenable'
              if cloudfall_deploy_unit_was_enabled.stdout == 'enabled'
              else 'disable'
            }}
          - "{{ cloudfall_deploy_component.service.name }}.service"
      changed_when: true
      when:
        - cloudfall_deploy_previous_directory | length == 0
        - not ansible_check_mode
        - cloudfall_deploy_unit_hand_made | bool

    - name: Start the pre-Cloudfall unit that was active before the deploy
      ansible.builtin.systemd_service:
        name: "{{ cloudfall_deploy_component.service.name }}.service"
        state: started
      when:
        - cloudfall_deploy_previous_directory | length == 0
        - not ansible_check_mode
        - cloudfall_deploy_unit_hand_made | bool
        - cloudfall_deploy_unit_was_active.rc == 0

    - name: Fail the deployment after rolling back
      ansible.builtin.fail:
        msg: >-
          Release {{ cloudfall_deploy_release }} failed its health check and
          was {{
            'rolled back to '
            ~ (cloudfall_deploy_previous_directory | basename)
            if cloudfall_deploy_previous_directory | length > 0
            else 'stopped because no previous release exists'
          }}{{
            '; the pre-Cloudfall unit was restored from '
            ~ cloudfall_deploy_unit_kept_path
            ~ (
              ' and started'
              if cloudfall_deploy_unit_was_active.rc == 0
              else ' and left stopped as it was before the deploy'
            )
            if cloudfall_deploy_previous_directory | length == 0
            and not ansible_check_mode
            and cloudfall_deploy_unit_hand_made | bool
            else ''
          }}

- name: Ensure the controller receipt directory exists
  ansible.builtin.file:
    path: "{{ cloudfall_deploy_receipt_directory }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false
  when: cloudfall_deploy_receipt_directory | length > 0

- name: Write the release receipt on the controller
  ansible.builtin.copy:
    content: >-
      {{
        {
          'apiVersion': 'cloudfall/v1',
          'kind': 'ReleaseReceipt',
          'metadata': {
            'id': cloudfall_deploy_component.id,
            'description': 'Release receipt written by cloudfall_deploy',
          },
          'spec': {
            'component': cloudfall_deploy_component.id,
            'server': cloudfall_server_id,
            'release': cloudfall_deploy_release,
            'artifactSha256': cloudfall_deploy_artifact_sha256,
            'deployedAt': ansible_facts['date_time']['iso8601'],
            'previousRelease': (
              (cloudfall_deploy_previous_directory | basename)
              if cloudfall_deploy_previous_directory | length > 0
              else none
            ),
            'healthCheckPassed': true,
          } | combine(
            {
              'releaseCommand': hostvars[
                cloudfall_deploy_component.release.server
              ].cloudfall_deploy_release_command_result,
            }
            if cloudfall_deploy_component.release is defined
            else {}
          ),
        } | to_nice_json
      }}
    dest: >-
      {{ cloudfall_deploy_receipt_directory }}/{{
        cloudfall_deploy_component.id
      }}.json
    mode: "0644"
  delegate_to: localhost
  become: false
  when:
    - not ansible_check_mode
    - cloudfall_deploy_receipt_directory | length > 0
