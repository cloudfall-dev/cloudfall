---
# Sets one owner's password from the salted SHA-256 the controller computed
# (D-9): a new owner is created with it, its host and its profile, an
# existing one gets the hash alone. The hash is staged in a 0600 statement
# the client reads itself, removed after the run; neither the password nor
# the hash is on a command line, in a task argument shown, or in any output.
- name: Set the hash of owner {{ cloudfall_clickhouse_owner.owner }}
  vars:
    cloudfall_clickhouse_hash_and_salt: >-
      {{
        lookup('ansible.builtin.file',
               cloudfall_clickhouse_files.owners[cloudfall_clickhouse_owner.owner])
        | trim
      }}
    cloudfall_clickhouse_identified: >-
      IDENTIFIED WITH sha256_hash BY '{{
        cloudfall_clickhouse_hash_and_salt.split(':')[0] }}' SALT '{{
        cloudfall_clickhouse_hash_and_salt.split(':')[1] }}'
  block:
    # The plan checked its shape; checked again, the statement quotes it
    - name: Refuse a staged hash of an unexpected shape
      ansible.builtin.assert:
        that:
          - cloudfall_clickhouse_hash_and_salt is match('^[0-9a-f]{64}:[0-9a-f]{32}$')
        fail_msg: >-
          The staged hash of owner {{ cloudfall_clickhouse_owner.owner }} of
          service {{ cloudfall_clickhouse_service.id }} is not a salted SHA-256
        quiet: true

    - name: Stage the owner's statement, which holds its hash
      ansible.builtin.copy:
        content: >-
          {{
            ('CREATE USER ' ~ cloudfall_clickhouse_owner.owner ~ ' '
             ~ cloudfall_clickhouse_identified ~ ' HOST LOCAL SETTINGS PROFILE '
             ~ "'" ~ cloudfall_clickhouse_owner_profile ~ "'")
            if cloudfall_clickhouse_owner.create
            else ('ALTER USER ' ~ cloudfall_clickhouse_owner.owner ~ ' '
                  ~ cloudfall_clickhouse_identified)
          }}
        dest: "{{ cloudfall_clickhouse_statement_path }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Store the owner's hash
      ansible.builtin.command:
        argv:
          - "{{ cloudfall_clickhouse_client }}"
          - --config-file
          - "{{ cloudfall_clickhouse_client_config_path }}"
          - --queries-file
          - "{{ cloudfall_clickhouse_statement_path }}"
      changed_when: true
      no_log: true
  always:
    - name: Remove the owner's staged statement
      ansible.builtin.file:
        path: "{{ cloudfall_clickhouse_statement_path }}"
        state: absent
      no_log: true
