---
argument_specs:
  main:
    short_description: Converge one replica of a declared ClickHouse service
    options:
      cloudfall_clickhouse_service:
        type: dict
        required: true
        options:
          id:
            type: str
            required: true
          description:
            type: str
          serviceKind:
            type: str
            choices:
              - clickhouse
            required: true
          environment:
            type: str
            required: true
          server:
            type: str
            required: true
          bind:
            type: dict
            required: true
            options:
              address:
                type: str
                choices:
                  - 127.0.0.1
                required: true
              port:
                type: int
                required: true
          clickhouse:
            type: dict
            required: true
            options:
              version:
                type: str
                required: true
              maxServerMemoryMb:
                type: int
                required: true
              replicas:
                type: list
                elements: str
                required: true
              keeper:
                type: dict
                required: true
                options:
                  servers:
                    type: list
                    elements: str
                    required: true
              databases:
                type: list
                elements: dict
                required: true
                options:
                  name:
                    type: str
                    required: true
                  owner:
                    type: str
                    required: true
                  passwordRef:
                    type: dict
                    required: true
              clientAccess:
                type: dict
          backup:
            type: dict
          metrics:
            type: dict
      cloudfall_clickhouse_files:
        type: dict
        description: >-
          Controller paths of the staged cloudfall password
          ('cloudfallPassword') and of each owner's salted SHA-256 hash and
          its salt ('owners'), never an owner's password
