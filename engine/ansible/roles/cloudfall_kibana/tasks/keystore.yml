---
# Kibana's secrets, all in its keystore and none in a file a person reads
# (S-024-5): the token of the elastic/kibana service account it logs in to
# the node with, and the three encryption keys from the project's store.
#
# The token is made here, with the node's own tool, in the node's
# service_tokens file: it is valid on this node only and is not in the
# cluster's security index. It is made once, when the node or the keystore
# lacks it; whether each has it is read by name, never by value, so no task
# reads a secret back. The keys cross only a command's stdin; beside the
# keystore the role keeps a SHA-256 of them, so a second converge that finds
# the same keys changes nothing.
- name: Create Kibana's keystore when it has none
  ansible.builtin.command:
    argv:
      - "{{ cloudfall_kibana_keystore_tool }}"
      - create
    creates: "{{ cloudfall_kibana_keystore_path }}"
  environment:
    KBN_PATH_CONF: "{{ cloudfall_kibana_configuration_directory }}"

- name: Read the settings Kibana's keystore holds
  ansible.builtin.command:
    argv:
      - "{{ cloudfall_kibana_keystore_tool }}"
      - list
  environment:
    KBN_PATH_CONF: "{{ cloudfall_kibana_configuration_directory }}"
  register: cloudfall_kibana_keystore_settings
  changed_when: false

- name: Read whether the node's service_tokens file has Kibana's token
  ansible.builtin.command:
    argv:
      - grep
      - --quiet
      - "^elastic/kibana/{{ cloudfall_kibana_token_name }}:"
      - "{{ cloudfall_kibana_service_tokens_file }}"
  register: cloudfall_kibana_token_file
  # rc 1: no such token; rc 2: no service_tokens file yet
  failed_when: cloudfall_kibana_token_file.rc not in [0, 1, 2]
  changed_when: false

# A token the node has but the keystore lost can't be read back: it is
# deleted and made again, and so is one the keystore has but the node lost.
- name: Make Kibana's token when the node or the keystore lacks it
  when: >-
    cloudfall_kibana_token_file.rc != 0
    or cloudfall_kibana_token_setting
    not in cloudfall_kibana_keystore_settings.stdout_lines
  vars:
    cloudfall_kibana_token_pattern: >-
      ^SERVICE_TOKEN elastic/kibana/{{ cloudfall_kibana_token_name }} = (\S+)\s*$
  block:
    - name: Delete the token the keystore no longer holds
      ansible.builtin.command:
        argv:
          - "{{ cloudfall_kibana_service_tokens_tool }}"
          - delete
          - elastic/kibana
          - "{{ cloudfall_kibana_token_name }}"
      environment:
        ES_PATH_CONF: "{{ cloudfall_kibana_elasticsearch_configuration_directory }}"
      changed_when: true
      when: cloudfall_kibana_token_file.rc == 0

    - name: Create Kibana's token in the node's service_tokens file
      ansible.builtin.command:
        argv:
          - "{{ cloudfall_kibana_service_tokens_tool }}"
          - create
          - elastic/kibana
          - "{{ cloudfall_kibana_token_name }}"
      environment:
        ES_PATH_CONF: "{{ cloudfall_kibana_elasticsearch_configuration_directory }}"
      register: cloudfall_kibana_token
      changed_when: true
      failed_when: >-
        cloudfall_kibana_token.rc != 0
        or cloudfall_kibana_token.stdout
        is not search(cloudfall_kibana_token_pattern, multiline=True)
      no_log: true

    - name: Put the token in Kibana's keystore
      ansible.builtin.command:
        argv:
          - "{{ cloudfall_kibana_keystore_tool }}"
          - add
          - --stdin
          - --force
          - "{{ cloudfall_kibana_token_setting }}"
        stdin_add_newline: false
        stdin: >-
          {{
            cloudfall_kibana_token.stdout
            | regex_search(cloudfall_kibana_token_pattern, multiline=True)
            | split(' = ', 1) | last | trim
          }}
      environment:
        KBN_PATH_CONF: "{{ cloudfall_kibana_configuration_directory }}"
      changed_when: true
      no_log: true
      notify: Restart Kibana

# The tool runs as root and rewrites the file: the node reads it as it
# reads its users file.
- name: Keep the node's service_tokens file readable by the node
  ansible.builtin.file:
    path: "{{ cloudfall_kibana_service_tokens_file }}"
    owner: root
    group: elasticsearch
    mode: "0660"

- name: Read the digest of the encryption keys the keystore was given
  ansible.builtin.stat:
    path: "{{ cloudfall_kibana_keys_marker }}"
    checksum_algorithm: sha256
  register: cloudfall_kibana_keys_marker_file

- name: Put each encryption key in Kibana's keystore
  ansible.builtin.command:
    argv:
      - "{{ cloudfall_kibana_keystore_tool }}"
      - add
      - --stdin
      - --force
      - "{{ item.setting }}"
    stdin: "{{ lookup('ansible.builtin.file', item.source) }}"
    stdin_add_newline: false
  environment:
    KBN_PATH_CONF: "{{ cloudfall_kibana_configuration_directory }}"
  loop: "{{ cloudfall_kibana_keys }}"
  loop_control:
    label: "{{ item.setting }}"
  changed_when: true
  no_log: true
  notify: Restart Kibana
  when: >-
    not cloudfall_kibana_keys_marker_file.stat.exists
    or cloudfall_kibana_keys_marker_file.stat.checksum
    != (cloudfall_kibana_keys_digest | hash('sha256'))
    or cloudfall_kibana_keys
    | map(attribute='setting')
    | reject('in', cloudfall_kibana_keystore_settings.stdout_lines)
    | list | length > 0

- name: Keep the keystore readable by Kibana
  ansible.builtin.file:
    path: "{{ cloudfall_kibana_keystore_path }}"
    owner: root
    group: kibana
    mode: "0660"

- name: Create the Kibana role state directory for the digest
  ansible.builtin.file:
    path: "{{ cloudfall_kibana_state_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Record the digest of the encryption keys the keystore holds
  ansible.builtin.copy:
    dest: "{{ cloudfall_kibana_keys_marker }}"
    content: "{{ cloudfall_kibana_keys_digest }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
