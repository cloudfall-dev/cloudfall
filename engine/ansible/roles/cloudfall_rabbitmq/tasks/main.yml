---
# One node of a RabbitMQ service of one or three (S-023). Every refusal comes
# before the first task that changes the host (S-023-4), and so does the
# majority check of a cluster (S-023-11). One node is configured as a cluster
# that waits for two more, and with clientAccess takes clients over TLS on its
# IPv4 too, with the same certificate the nodes of three meet with.
- name: Validate RabbitMQ service target and declaration
  ansible.builtin.assert:
    that:
      - ansible_facts["distribution"] == "Debian"
      - ansible_facts["distribution_major_version"] | string == "13"
      - ansible_facts["service_mgr"] == "systemd"
      - cloudfall_rabbitmq_service.serviceKind == "rabbitmq"
      - cloudfall_server_id in cloudfall_rabbitmq_service.rabbitmq.nodes
      - cloudfall_rabbitmq_service.server in cloudfall_rabbitmq_service.rabbitmq.nodes
      - cloudfall_rabbitmq_service.bind.address == "127.0.0.1"
    fail_msg: >-
      RabbitMQ service {{ cloudfall_rabbitmq_service.id }} needs a Debian 13
      node that it declares, and a loopback-only bind address

# A node with clientAccess takes clients where the inventory says: its IPv4,
# the TLS port, and its certificate's paths
- name: Require the node's rendered client access
  ansible.builtin.assert:
    that:
      - >-
        not cloudfall_rabbitmq_client_tls | bool
        or (
          cloudfall_rabbitmq_tls.address is defined
          and cloudfall_rabbitmq_tls.port == 5671
        )
    fail_msg: >-
      RabbitMQ service {{ cloudfall_rabbitmq_service.id }} declares
      clientAccess, but the inventory carries no client access for
      {{ cloudfall_server_id }}; render the inventory with this Cloudfall
      release. Nothing changed

# A node of three meets the others where the inventory says: its address,
# every node's name and address, and its certificate's paths
- name: Require the node's rendered cluster
  ansible.builtin.assert:
    that:
      - cloudfall_rabbitmq_service.rabbitmq.nodes | length in [1, 3]
      - >-
        not cloudfall_rabbitmq_clustered | bool
        or (
          cloudfall_rabbitmq_node.address is defined
          and cloudfall_rabbitmq_node.nodes | map(attribute='server') | list
          == cloudfall_rabbitmq_service.rabbitmq.nodes
        )
    fail_msg: >-
      {{ cloudfall_server_id }} is a node of RabbitMQ service
      {{ cloudfall_rabbitmq_service.id }} of
      {{ cloudfall_rabbitmq_service.rabbitmq.nodes | length }} nodes, but the
      inventory carries no cluster for it, or another node list; render the
      inventory with this Cloudfall release. Nothing changed

# services.yml refuses it before any service role too; checked again here,
# the role is safe to include on its own
- name: Refuse a memory watermark above six tenths of the server's memory
  ansible.builtin.assert:
    that:
      - >-
        (cloudfall_rabbitmq_service.rabbitmq.memoryHighWatermarkMb | int) * 10
        <= (ansible_facts['memtotal_mb'] | int) * 6
    fail_msg: >-
      memoryHighWatermarkMb
      {{ cloudfall_rabbitmq_service.rabbitmq.memoryHighWatermarkMb }} of
      service {{ cloudfall_rabbitmq_service.id }} is above six tenths of the
      {{ ansible_facts['memtotal_mb'] }} MB of {{ cloudfall_server_id }}:
      lower memoryHighWatermarkMb, or move the node to a server with more
      memory

- name: Refuse a series Cloudfall does not install
  ansible.builtin.assert:
    that:
      - cloudfall_rabbitmq_series in cloudfall_rabbitmq_erlang_minimum
    fail_msg: >-
      RabbitMQ {{ cloudfall_rabbitmq_service.rabbitmq.version }} of service
      {{ cloudfall_rabbitmq_service.id }} is of no series this role installs
      ({{ cloudfall_rabbitmq_erlang_minimum | list | join(', ') }})

# RabbitMQ can't rename a node that holds a quorum queue, so a node whose
# hostname is not the declared one is never started (S-023)
- name: Refuse a host whose hostname is not the declared one
  ansible.builtin.assert:
    that:
      - ansible_facts['hostname'] == cloudfall_hostname.split('.')[0]
    fail_msg: >-
      {{ cloudfall_server_id }} reports the hostname
      {{ ansible_facts['hostname'] }}, not
      {{ cloudfall_hostname.split('.')[0] }}: its node would not be
      {{ cloudfall_rabbitmq_node_name }}. Set the hostname, or the Server's
      hostname, and converge again

# The values stay on the controller; only their paths are checked
- name: Require the staged Erlang cookie and every owner's password
  ansible.builtin.assert:
    that:
      - cloudfall_rabbitmq_files.cookie is defined
      - >-
        cloudfall_rabbitmq_service.rabbitmq.vhosts | map(attribute='owner')
        | difference((cloudfall_rabbitmq_files.owners | default({})) | list)
        | length == 0
    fail_msg: >-
      RabbitMQ service {{ cloudfall_rabbitmq_service.id }} has no staged
      Erlang cookie or owner password; converge it through cloudfall
      (converge_services or operator approve), which stages them
    quiet: true

- name: Read the installed RabbitMQ server package
  ansible.builtin.command:
    argv:
      - dpkg-query
      - --showformat
      - "${db:Status-Status}|${Version}"
      - --show
      - rabbitmq-server
  register: cloudfall_rabbitmq_installed
  failed_when: cloudfall_rabbitmq_installed.rc not in [0, 1]
  changed_when: false
  check_mode: false

# A change of version is a rolling change of its own (#509); RabbitMQ never
# goes back to an older one
- name: Refuse a version other than the installed one
  ansible.builtin.assert:
    that:
      - >-
        cloudfall_rabbitmq_installed_version in
        ['', cloudfall_rabbitmq_package_version]
    fail_msg: >-
      {{ cloudfall_server_id }} runs RabbitMQ {{ cloudfall_rabbitmq_installed_version }},
      and service {{ cloudfall_rabbitmq_service.id }} declares
      {{ cloudfall_rabbitmq_service.rabbitmq.version }}; this release does not
      change the version of a node. Nothing changed
  vars:
    cloudfall_rabbitmq_installed_version: >-
      {{
        cloudfall_rabbitmq_installed.stdout.split('|')[1]
        if cloudfall_rabbitmq_installed.rc == 0
        and cloudfall_rabbitmq_installed.stdout.startswith('installed|')
        else ''
      }}

# The timers run on the service's home only
- name: Validate the declared backup and restore-drill calendar expressions
  ansible.builtin.command:
    argv:
      - /usr/bin/systemd-analyze
      - calendar
      - "{{ item }}"
  loop: >-
    {{
      [cloudfall_rabbitmq_service.backup.onCalendar]
      + ([cloudfall_rabbitmq_service.backup.restoreCheckOnCalendar]
         if cloudfall_rabbitmq_service.backup.restoreCheckOnCalendar is defined
         else [])
    }}
  changed_when: false
  check_mode: false
  when: cloudfall_rabbitmq_home | bool

# Before any task that could change or restart the node (S-023-11)
- name: Refuse a converge while the cluster has no majority
  ansible.builtin.import_tasks: majority.yml
  when:
    - cloudfall_rabbitmq_clustered | bool
    - cloudfall_rabbitmq_installed.rc == 0
    - cloudfall_rabbitmq_installed.stdout.startswith('installed|')

- name: Install the RabbitMQ repository and the Erlang of the Debian release
  ansible.builtin.import_tasks: package.yml

- name: Prepare the data volume
  ansible.builtin.import_tasks: storage.yml

- name: Install the Erlang cookie the node and its tools share
  ansible.builtin.copy:
    src: "{{ cloudfall_rabbitmq_files.cookie }}"
    dest: "{{ cloudfall_rabbitmq_cookie_path }}"
    owner: rabbitmq
    group: rabbitmq
    mode: "0400"
  no_log: true
  notify: Restart RabbitMQ

- name: Create the configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: rabbitmq
    mode: "0755"
  loop:
    - "{{ cloudfall_rabbitmq_config_directory }}"
    - "{{ cloudfall_rabbitmq_config_directory }}/conf.d"

# One certificate from the project CA serves the nodes of three between them
# and the clients of clientAccess
- name: Prepare the node certificate for TLS
  ansible.builtin.import_tasks: tls.yml
  when: cloudfall_rabbitmq_needs_certificate | bool

- name: Prepare the node to meet the others over TLS
  ansible.builtin.import_tasks: cluster.yml
  when: cloudfall_rabbitmq_clustered | bool

- name: Install the managed settings
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ cloudfall_rabbitmq_config_directory }}/conf.d/{{ item }}"
    owner: root
    group: rabbitmq
    mode: "0644"
  loop: "{{ cloudfall_rabbitmq_managed_files }}"
  notify: Restart RabbitMQ

# The Prometheus plugin and no other: no management interface, no HTTP API
- name: Install the managed plugin list
  ansible.builtin.template:
    src: enabled_plugins.j2
    dest: "{{ cloudfall_rabbitmq_config_directory }}/enabled_plugins"
    owner: rabbitmq
    group: rabbitmq
    mode: "0644"
  notify: Restart RabbitMQ

# epmd, which the node starts, listens where ERL_EPMD_ADDRESS says: loopback,
# and on a node of three its IPv4 too, where the node and the tools also
# speak TLS between nodes
- name: Keep the node's name and epmd on loopback
  ansible.builtin.blockinfile:
    path: "{{ cloudfall_rabbitmq_config_directory }}/rabbitmq-env.conf"
    create: true
    owner: root
    group: rabbitmq
    mode: "0644"
    marker: "# {mark} CLOUDFALL MANAGED"
    block: "{{ cloudfall_rabbitmq_env_lines | join('\n') }}"
  notify: Restart RabbitMQ

- name: Install the pinned RabbitMQ server
  ansible.builtin.apt:
    name: rabbitmq-server={{ cloudfall_rabbitmq_package_version }}
    state: present
    # Nothing starts during the install: the handler starts it once, with
    # the managed settings and the cookie in place
    policy_rc_d: 101
  notify: Restart RabbitMQ

- name: Hold the RabbitMQ server package
  ansible.builtin.dpkg_selections:
    name: rabbitmq-server
    selection: hold

- name: Start the node with its settings
  ansible.builtin.meta: flush_handlers

- name: Enable and start the RabbitMQ server
  ansible.builtin.systemd_service:
    name: rabbitmq-server.service
    enabled: true
    state: started

- name: Wait until the node runs
  ansible.builtin.command:
    argv:
      - "{{ cloudfall_rabbitmq_diagnostics }}"
      - --quiet
      - check_running
  register: cloudfall_rabbitmq_running
  changed_when: false
  retries: 24
  delay: 5
  until: cloudfall_rabbitmq_running.rc == 0
  when: not ansible_check_mode

# A new node finds the running home in its node list and joins it on its
# first start; the home runs first, and the nodes join one at a time
# (services.yml is serial). A node that started a cluster of its own never
# lists the home as running, and stops the converge here.
- name: Wait until the node runs in the home's cluster
  ansible.builtin.command:
    argv:
      - "{{ cloudfall_rabbitmq_diagnostics }}"
      - --quiet
      - --formatter
      - json
      - cluster_status
  register: cloudfall_rabbitmq_joined
  changed_when: false
  retries: "{{ cloudfall_rabbitmq_join_retries }}"
  delay: 5
  until: >-
    cloudfall_rabbitmq_joined.rc == 0
    and cloudfall_rabbitmq_node_name
      in (cloudfall_rabbitmq_joined.stdout | cloudfall_rabbitmq_membership).running
    and cloudfall_rabbitmq_home_node
      in (cloudfall_rabbitmq_joined.stdout | cloudfall_rabbitmq_membership).running
  when:
    - cloudfall_rabbitmq_clustered | bool
    - not ansible_check_mode

# Once every declared node is a member: on the last node to join, and on
# every node of a later converge. It only reads.
- name: Wait until the service is healthy
  cloudfall_rabbitmq_health:
    ctl: "{{ cloudfall_rabbitmq_ctl }}"
    diagnostics: "{{ cloudfall_rabbitmq_diagnostics }}"
    nodes: "{{ cloudfall_rabbitmq_node_names }}"
    timeout: "{{ cloudfall_rabbitmq_healthy_timeout | int }}"
    interval: "{{ cloudfall_rabbitmq_healthy_interval | int }}"
  when:
    - cloudfall_rabbitmq_clustered | bool
    - not ansible_check_mode
    - >-
      cloudfall_rabbitmq_node_names
      | difference((cloudfall_rabbitmq_joined.stdout
                    | cloudfall_rabbitmq_membership).members)
      | length == 0

- name: Read the listening sockets
  ansible.builtin.command:
    argv:
      - ss
      - -Htlnp
  register: cloudfall_rabbitmq_sockets
  changed_when: false
  when: not ansible_check_mode

# Nothing of RabbitMQ or epmd listens outside loopback (S-023-3), but node
# discovery and the inter-node port of a node of three, and the TLS client
# listener of a node with clientAccess (S-023-19), on its own IPv4
- name: Refuse a listener of RabbitMQ or epmd outside loopback
  ansible.builtin.assert:
    that:
      - cloudfall_rabbitmq_public | length == 0
    fail_msg: >-
      {{ cloudfall_server_id }} has RabbitMQ or epmd listening outside
      loopback: {{ cloudfall_rabbitmq_public | join(', ') }}
  vars:
    cloudfall_rabbitmq_public: >-
      {{
        cloudfall_rabbitmq_sockets.stdout
        | cloudfall_rabbitmq_public_listeners(cloudfall_rabbitmq_allowed_listeners)
      }}
  when: not ansible_check_mode

- name: Converge the virtual hosts and their owners on the service's home
  ansible.builtin.import_tasks: accounts.yml
  when:
    - cloudfall_rabbitmq_home | bool
    - not ansible_check_mode

- name: Install the definitions export and the restore drill on the service's home
  ansible.builtin.import_tasks: backup.yml
  when: cloudfall_rabbitmq_home | bool
