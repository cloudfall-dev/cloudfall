---
cloudfall_rabbitmq_service: {}
# Controller paths of the service's staged Erlang cookie ('cookie') and of
# each owner's password ('owners'); services.yml passes the service's entry
# of cloudfall_services_rabbitmq_files, never a value (S-023, D-9).
cloudfall_rabbitmq_files: {}
# What the services converge decided for this server's data volume (S-014).
cloudfall_rabbitmq_volume_actions: >-
  {{ (cloudfall_volume_actions | default({})).get(cloudfall_server_id, [])
     | selectattr('name', 'equalto', 'rabbitmq') | list }}
cloudfall_rabbitmq_series: >-
  {{ cloudfall_rabbitmq_service.rabbitmq.version.split('.')[:2] | join('.') }}
# rabbitmq-server has no epoch: 4.4.1-1
cloudfall_rabbitmq_package_version: "{{ cloudfall_rabbitmq_service.rabbitmq.version }}-1"
# The series Cloudfall installs and the oldest Erlang each runs on, the same
# table as cloudfall.rabbitmq.SUPPORTED_SERIES (a test compares them).
cloudfall_rabbitmq_erlang_minimum:
  "4.3": "27.0"
  "4.4": "27.0"
# Team RabbitMQ's repository for the Debian release; Erlang comes from Debian.
cloudfall_rabbitmq_repository_key_url: >-
  https://keys.openpgp.org/vks/v1/by-fingerprint/0A9AF2115F4687BD29803A206B73A36E6026DFCA
# Armored: APT reads a .asc keyring as it is.
cloudfall_rabbitmq_repository_key_path: /etc/apt/keyrings/rabbitmq-team.asc
cloudfall_rabbitmq_repository_urls:
  - https://deb1.rabbitmq.com/rabbitmq-server/debian/{{ ansible_facts['distribution_release'] }}
  - https://deb2.rabbitmq.com/rabbitmq-server/debian/{{ ansible_facts['distribution_release'] }}
# The Erlang packages RabbitMQ's Debian guide installs, from the Debian release.
cloudfall_rabbitmq_erlang_packages:
  - erlang-base
  - erlang-asn1
  - erlang-crypto
  - erlang-eldap
  - erlang-ftp
  - erlang-inets
  - erlang-mnesia
  - erlang-os-mon
  - erlang-parsetools
  - erlang-public-key
  - erlang-runtime-tools
  - erlang-snmp
  - erlang-ssl
  - erlang-syntax-tools
  - erlang-tftp
  - erlang-tools
  - erlang-xmerl
cloudfall_rabbitmq_data_path: /var/lib/rabbitmq
cloudfall_rabbitmq_cookie_path: /var/lib/rabbitmq/.erlang.cookie
cloudfall_rabbitmq_config_directory: /etc/rabbitmq
# The managed settings, each in a file of its own that sorts after the
# operator's (S-023, What each server needs); audit compares only these.
cloudfall_rabbitmq_managed_files:
  - 90-cloudfall-listeners.conf
  - 91-cloudfall-limits.conf
  - 92-cloudfall-cluster.conf
  - 93-cloudfall-metrics.conf
# Below it a node stops taking messages while there is room to drain.
cloudfall_rabbitmq_disk_free_limit: 2GB
# A node is rabbit@ and its short hostname, which RabbitMQ takes by default.
cloudfall_rabbitmq_node_name: rabbit@{{ cloudfall_hostname.split('.')[0] }}
cloudfall_rabbitmq_node_names: >-
  {{
    cloudfall_rabbitmq_service.rabbitmq.nodes
    | map('extract', hostvars, 'cloudfall_hostname')
    | map('regex_replace', '^([^.]+).*$', 'rabbit@\1')
    | list
  }}
cloudfall_rabbitmq_distribution_port: 25672
cloudfall_rabbitmq_metrics_port: 15692
# The quorum queue size continuous membership reconciliation grows toward.
cloudfall_rabbitmq_target_group_size: 3
# Tags Cloudfall puts on every virtual host it creates; the owner's name
# follows the prefix, so audit and a later converge know what is Cloudfall's
# with no state outside the cluster.
cloudfall_rabbitmq_managed_tag: cloudfall-managed
cloudfall_rabbitmq_owner_tag_prefix: "cloudfall-owner:"
# The host directory the definitions file that sets the owners' hashes is
# staged in, 0700 root; the file is removed after the run.
cloudfall_rabbitmq_state_directory: /var/lib/cloudfall/rabbitmq
cloudfall_rabbitmq_ctl: /usr/sbin/rabbitmqctl
cloudfall_rabbitmq_diagnostics: /usr/sbin/rabbitmq-diagnostics
cloudfall_rabbitmq_upgrade: /usr/sbin/rabbitmq-upgrade
# The version of the package this node has installed, X.Y.Z-1, or '' for none.
cloudfall_rabbitmq_installed_version: >-
  {{
    cloudfall_rabbitmq_installed.stdout.split('|')[1]
    if cloudfall_rabbitmq_installed.rc == 0
    and cloudfall_rabbitmq_installed.stdout.startswith('installed|')
    else ''
  }}
# The version each running member of a cluster reports, by node name, as the
# majority check read it; a node of one, or one that does not run, has none.
cloudfall_rabbitmq_running_versions: >-
  {{
    cloudfall_rabbitmq_membership_read.stdout | cloudfall_rabbitmq_node_versions
    if cloudfall_rabbitmq_membership_read is defined
    and cloudfall_rabbitmq_membership_read.rc | default(1) == 0
    else {}
  }}
# A change of version is rolling (S-023, Supported versions): on the
# service's home, which services.yml runs first, every other node in declared
# order changes, and the home last. It is due when the home's package or a
# running member's version is not the declared one.
cloudfall_rabbitmq_version_change: >-
  {{
    cloudfall_rabbitmq_home | bool
    and (
      cloudfall_rabbitmq_installed_version
        not in ['', cloudfall_rabbitmq_package_version]
      or cloudfall_rabbitmq_running_versions.values() | list | unique
        | difference([cloudfall_rabbitmq_service.rabbitmq.version]) | length > 0
    )
  }}
cloudfall_rabbitmq_version_order: >-
  {{
    cloudfall_rabbitmq_service.rabbitmq.nodes
    | reject('equalto', cloudfall_rabbitmq_service.server) | list
    + [cloudfall_rabbitmq_service.server]
  }}
# The members a version change found, which it waits for and checks: a node
# declared and not yet joined joins with the declared version on its own
# turn. A node of one, or one whose cluster has no other member yet, is alone.
cloudfall_rabbitmq_version_members: >-
  {{
    cloudfall_rabbitmq_membership.members
    if cloudfall_rabbitmq_membership is defined
    and cloudfall_rabbitmq_membership.members | length > 0
    else [cloudfall_rabbitmq_node_name]
  }}
# Before a node of a cluster stops, every quorum queue must keep its majority
# without it; the wait gives up after this and the converge stops.
cloudfall_rabbitmq_quorum_timeout: 3600
# Whether this server is the service's home, where the virtual hosts and
# users converge once for the whole cluster (S-023).
cloudfall_rabbitmq_home: >-
  {{ cloudfall_rabbitmq_service.server == cloudfall_server_id }}
cloudfall_rabbitmq_definitions_path: >-
  {{ cloudfall_rabbitmq_state_directory }}/{{ cloudfall_rabbitmq_service.id }}-owners.json
# clientAccess (S-023): the node also takes clients over TLS alone on its
# IPv4, with its certificate from the project CA. The inventory renders, by
# service id, that address and port and the certificate's paths
# (cloudfall_rabbitmq_client_access); a service without it has none.
cloudfall_rabbitmq_client_tls: >-
  {{ cloudfall_rabbitmq_service.rabbitmq.clientAccess is defined }}
cloudfall_rabbitmq_tls: >-
  {{ (cloudfall_rabbitmq_client_access | default({}))
     .get(cloudfall_rabbitmq_service.id, {}) }}
# A cluster of three (S-023): the nodes meet on their IPv4 over TLS, verified
# against the project CA both ways. The inventory renders, by service id, this
# node's address, every node's name, hostname and address, and the paths of
# its certificate (cloudfall_rabbitmq_cluster); one node has none.
cloudfall_rabbitmq_clustered: >-
  {{ cloudfall_rabbitmq_service.rabbitmq.nodes | length > 1 }}
cloudfall_rabbitmq_node: >-
  {{ (cloudfall_rabbitmq_cluster | default({}))
     .get(cloudfall_rabbitmq_service.id, {}) }}
# The node the others join first: the service's home, which runs first
cloudfall_rabbitmq_home_node: >-
  rabbit@{{ hostvars[cloudfall_rabbitmq_service.server].cloudfall_hostname.split('.')[0] }}
# The node's one certificate from the project CA, which serves the nodes of
# three between them and the clients of clientAccess alike: its paths, as the
# rendered cluster or client access names them (the same files).
cloudfall_rabbitmq_needs_certificate: >-
  {{ cloudfall_rabbitmq_clustered | bool or cloudfall_rabbitmq_client_tls | bool }}
cloudfall_rabbitmq_certificate: >-
  {{
    cloudfall_rabbitmq_node if cloudfall_rabbitmq_clustered | bool
    else cloudfall_rabbitmq_tls
  }}
# What the services converge signed and staged for this node: its
# certificate and the CA, only when they are missing or due.
cloudfall_rabbitmq_delivered_files: >-
  {{ (cloudfall_services_rabbitmq_delivered_files | default({}))
     .get(cloudfall_server_id, []) }}
# The Erlang terms of the inter-node TLS, which the node and the
# command-line tools both read.
cloudfall_rabbitmq_tls_options_path: /etc/rabbitmq/cloudfall/inter_node_tls.config
cloudfall_rabbitmq_epmd_port: 4369
# A node and the tools give up joining after these; a later converge resumes.
cloudfall_rabbitmq_join_retries: 60
# Healthy: every declared node a running member, no alarm, no partition, every
# quorum queue with a leader and a member online on every node; waited for
# up to one hour, then the converge stops with what is missing (S-023).
cloudfall_rabbitmq_healthy_timeout: 3600
cloudfall_rabbitmq_healthy_interval: 10
# Where the role reports a converge it refused while the cluster has no
# majority, a controller directory the services converge reads ('' reports
# nothing): the refusal turns into PRECONDITION.
cloudfall_rabbitmq_report_directory: ""
cloudfall_rabbitmq_no_majority_code: service_rabbitmq_no_majority
cloudfall_rabbitmq_no_majority_message: >-
  RabbitMQ service {{ cloudfall_rabbitmq_service.id }} has no majority: of its
  members {{ cloudfall_rabbitmq_membership.members | join(', ') }} only
  {{ cloudfall_rabbitmq_membership.running | join(', ') or 'none' }} run, so it
  takes no publish to a quorum queue and no change of a definition. Nothing on
  {{ cloudfall_server_id }} changed and no node was restarted; start the
  stopped nodes, which rejoin with no converge, then converge again
# Every node's hostname and short name resolve to its IPv4, on every node and
# before the host's own lines, so the nodes and the tools reach each other
# there: the node's name is rabbit@ and its short hostname.
cloudfall_rabbitmq_hosts_block: >-
  {{ cloudfall_rabbitmq_node.nodes | default([]) | cloudfall_rabbitmq_hosts_lines }}
# The Erlang arguments that make the node, and the tools, speak TLS between
# nodes with the options file; the ssl application's directory is read on
# the host, from the Erlang of the Debian release.
cloudfall_rabbitmq_tls_erl_args: >-
  -pa {{ cloudfall_rabbitmq_erl_ssl.stdout | default('') | trim }}
  -proto_dist inet_tls -ssl_dist_optfile {{ cloudfall_rabbitmq_tls_options_path }}
# rabbitmq-env.conf's managed lines: the node's name, where epmd listens and,
# on a node of three, the inter-node TLS of the node and of the tools.
cloudfall_rabbitmq_env_lines: >-
  {{
    ['NODENAME=' ~ cloudfall_rabbitmq_node_name,
     'ERL_EPMD_ADDRESS=127.0.0.1' ~ (
       ',' ~ cloudfall_rabbitmq_node.address
       if cloudfall_rabbitmq_clustered | bool else '')]
    + (['SERVER_ADDITIONAL_ERL_ARGS="' ~ cloudfall_rabbitmq_tls_erl_args ~ '"',
        'CTL_ERL_ARGS="' ~ cloudfall_rabbitmq_tls_erl_args ~ '"']
       if cloudfall_rabbitmq_clustered | bool else [])
  }}
# The listeners a node opens outside loopback by design, all on its own
# IPv4: node discovery and the inter-node port on a node of three, and the
# TLS client listener with clientAccess.
cloudfall_rabbitmq_allowed_listeners: >-
  {{
    ([cloudfall_rabbitmq_node.address ~ ':' ~ cloudfall_rabbitmq_epmd_port,
      cloudfall_rabbitmq_node.address ~ ':' ~ cloudfall_rabbitmq_distribution_port]
     if cloudfall_rabbitmq_clustered | bool else [])
    + ([cloudfall_rabbitmq_tls.address ~ ':' ~ cloudfall_rabbitmq_tls.port]
       if cloudfall_rabbitmq_client_tls | bool else [])
  }}
# The account the package runs the node as, and the scratch node of the drill.
cloudfall_rabbitmq_user: rabbitmq
# Every service's backup directory sits in this root (#342).
cloudfall_rabbitmq_backup_root: /var/backups/cloudfall
# The real scripts of the package, not the /usr/sbin wrappers, which run the
# node's own environment: the drill's scratch node needs one of its own.
cloudfall_rabbitmq_bin_directory: /usr/lib/rabbitmq/bin
# The restore drill's scratch node (S-023, Backups and the restore drill): a
# node name, cookie, data directory, configuration and loopback ports of its
# own, epmd included, and no node list, so it never joins the cluster. Its
# directory, beside the node's own data directory where the rabbitmq user
# can reach it, is removed after every drill; one a stopped drill left is
# removed by the next.
cloudfall_rabbitmq_scratch_directory: /var/lib/rabbitmq/cloudfall-restore-check
cloudfall_rabbitmq_scratch_node_name: cloudfall_restore_check@localhost
cloudfall_rabbitmq_scratch_ports:
  amqp: 45672
  distribution: 45673
  epmd: 45674
# The scratch node's memory watermark; the drill refuses to start it on a
# server with less free memory than that.
cloudfall_rabbitmq_scratch_watermark_mb: 256
cloudfall_rabbitmq_meminfo_path: /proc/meminfo
