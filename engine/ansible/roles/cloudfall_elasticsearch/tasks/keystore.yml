---
# The S3 client keys of snapshotRepository in this node's keystore (S-012,
# Snapshots and the restore drill): every node of the cluster holds them,
# since every node writes its own shards to the repository. The keys cross
# only the command's stdin, never a command line or the log; beside the
# keystore the role keeps a SHA-256 of them, so a second converge that finds
# the same keys changes nothing. A dry run leaves the keystore alone: before
# the package is installed there is no keystore tool to ask.
- name: Converge the S3 keys of the node's keystore
  when: not ansible_check_mode
  block:
    - name: Read the settings the node's keystore holds
      ansible.builtin.command:
        argv:
          - "{{ cloudfall_elasticsearch_keystore_tool }}"
          - list
      environment:
        ES_PATH_CONF: "{{ cloudfall_elasticsearch_configuration_directory }}"
      register: cloudfall_elasticsearch_keystore_settings
      changed_when: false

    - name: Read the digest of the S3 keys the keystore was given
      ansible.builtin.stat:
        path: "{{ cloudfall_elasticsearch_s3_marker }}"
        checksum_algorithm: sha256
      register: cloudfall_elasticsearch_s3_marker_file

    - name: Put each S3 key in the node's keystore
      ansible.builtin.command:
        argv:
          - "{{ cloudfall_elasticsearch_keystore_tool }}"
          - add
          - --stdin
          - --force
          - "{{ item.setting }}"
        stdin: "{{ lookup('ansible.builtin.file', item.source) }}"
      environment:
        ES_PATH_CONF: "{{ cloudfall_elasticsearch_configuration_directory }}"
      loop:
        - setting: s3.client.default.access_key
          source: "{{ cloudfall_elasticsearch_account_files.s3AccessKey }}"
        - setting: s3.client.default.secret_key
          source: "{{ cloudfall_elasticsearch_account_files.s3SecretKey }}"
      loop_control:
        label: "{{ item.setting }}"
      register: cloudfall_elasticsearch_keystore_added
      changed_when: true
      no_log: true
      when: >-
        not cloudfall_elasticsearch_s3_marker_file.stat.exists
        or cloudfall_elasticsearch_s3_marker_file.stat.checksum
        != (cloudfall_elasticsearch_s3_marker_content | hash('sha256'))
        or 's3.client.default.access_key'
        not in cloudfall_elasticsearch_keystore_settings.stdout_lines
        or 's3.client.default.secret_key'
        not in cloudfall_elasticsearch_keystore_settings.stdout_lines

    # The tool runs as root and rewrites the file: the node reads it as the
    # package left it.
    - name: Keep the keystore readable by the node
      ansible.builtin.file:
        path: "{{ cloudfall_elasticsearch_configuration_directory }}/elasticsearch.keystore"
        owner: root
        group: elasticsearch
        mode: "0660"

    - name: Create the Elasticsearch role state directory for the digest
      ansible.builtin.file:
        path: "{{ cloudfall_elasticsearch_state_directory }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Record the digest of the S3 keys the keystore holds
      ansible.builtin.copy:
        dest: "{{ cloudfall_elasticsearch_s3_marker }}"
        content: "{{ cloudfall_elasticsearch_s3_marker_content }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    # A running node reads new secure settings only on a reload; the
    # converge asks for it once the node serves its cluster.
    - name: Remember that the node's keystore changed
      ansible.builtin.set_fact:
        cloudfall_elasticsearch_keystore_changed: >-
          {{ cloudfall_elasticsearch_keystore_added is changed }}
