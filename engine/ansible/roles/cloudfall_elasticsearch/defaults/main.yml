---
cloudfall_elasticsearch_service: {}
# Controller paths of the files cloudfall stages for the service's accounts
# (cloudfallPassword, cloudfallHash, elasticHash); never the values.
cloudfall_elasticsearch_account_files: {}
cloudfall_elasticsearch_repository_key_url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
cloudfall_elasticsearch_repository_key_path: /etc/apt/keyrings/elasticsearch.asc
cloudfall_elasticsearch_repository_url: https://artifacts.elastic.co/packages
cloudfall_elasticsearch_configuration_directory: /etc/elasticsearch
cloudfall_elasticsearch_data_path: /var/lib/elasticsearch
cloudfall_elasticsearch_log_path: /var/log/elasticsearch
# The S-011 secret requirement's path (requirements.ELASTICSEARCH_PASSWORD_PATH).
cloudfall_elasticsearch_password_path: /etc/elasticsearch/cloudfall-password
cloudfall_elasticsearch_state_directory: /var/lib/cloudfall/elasticsearch
# The node's one certificate from the project CA, its key and that CA: the
# paths of its S-011 elasticsearch-transport requirement
# (elasticsearch_cluster.TRANSPORT_CERTIFICATE_PATH, _KEY_PATH, _CA_PATH).
# The transport of a cluster and, with remoteAccess, HTTP use them.
cloudfall_elasticsearch_certificate_path: /etc/elasticsearch/certs/transport.crt
cloudfall_elasticsearch_key_path: /etc/elasticsearch/certs/transport.key
cloudfall_elasticsearch_ca_path: /etc/elasticsearch/certs/ca.crt
# Where the role reaches the node's API: plain HTTP on loopback, or, with
# remoteAccess, HTTPS on the listen address the certificate names, verified
# against the project CA (plain HTTP is refused there).
cloudfall_elasticsearch_api_url: >-
  {%- set remote = cloudfall_elasticsearch_service.elasticsearch.remoteAccess
                   | default(none) -%}
  {%- if remote is none -%}
  http://{{ cloudfall_elasticsearch_service.bind.address }}:{{
    cloudfall_elasticsearch_service.bind.port }}
  {%- else -%}
  https://{{ ('[' ~ remote.listenAddress ~ ']') if ':' in remote.listenAddress
             else remote.listenAddress }}:{{
    cloudfall_elasticsearch_service.bind.port }}
  {%- endif -%}
cloudfall_elasticsearch_api_ca: >-
  {{
    cloudfall_elasticsearch_ca_path
    if cloudfall_elasticsearch_service.elasticsearch.remoteAccess is defined
    else ''
  }}
# Written once the node served its cluster: from then on the configuration
# never carries cluster.initial_master_nodes again.
cloudfall_elasticsearch_formed_marker: >-
  {{ cloudfall_elasticsearch_state_directory }}/{{
    cloudfall_elasticsearch_service.id
  }}.cluster-formed
# Snapshots and the restore drill (S-012): the repository the converge
# registers, and how often and how long the scripts wait for Elasticsearch.
cloudfall_elasticsearch_snapshot_repository: cloudfall
cloudfall_elasticsearch_snapshot_poll_seconds: 5
cloudfall_elasticsearch_snapshot_wait_seconds: 21600
# The timers: the snapshot always, the restore drill when it has a calendar.
cloudfall_elasticsearch_snapshot_jobs: >-
  {{
    [{'action': 'backup',
      'calendar': cloudfall_elasticsearch_service.backup.onCalendar}]
    + (
      [{'action': 'restore-check',
        'calendar': cloudfall_elasticsearch_service.backup.restoreCheckOnCalendar}]
      if cloudfall_elasticsearch_service.backup.restoreCheckOnCalendar is defined
      else []
    )
  }}
