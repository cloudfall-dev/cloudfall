---
# The controller already refused anything unsafe (S-014): a missing volume
# group or physical volume, too little free space, a volume of another type,
# on other disks or with another filesystem, and a mount path that holds files
# or is mounted from another device. These tasks only run what it decided.
- name: Create each missing volume on its declared physical volumes
  ansible.builtin.command:
    argv: >-
      {{ ['lvcreate', '--yes', '--name', item.logicalVolume,
          '--size', item.sizeBytes ~ 'b']
         + (['--type', 'raid1', '--mirrors', '1']
            if item.type == 'raid1' else [])
         + [item.volumeGroup] + item.physicalVolumes }}
  loop: "{{ cloudfall_volumes_actions | selectattr('action', 'equalto', 'create') | list }}"
  loop_control:
    label: "{{ item.volumeGroup }}/{{ item.logicalVolume }}"
  changed_when: true

- name: Make an ext4 filesystem on each volume created in this run
  ansible.builtin.command:
    argv:
      - mkfs.ext4
      - -F
      - -m
      - "0"
      - -L
      - "{{ item.label }}"
      - "/dev/{{ item.volumeGroup }}/{{ item.logicalVolume }}"
  loop: "{{ cloudfall_volumes_actions | selectattr('action', 'equalto', 'create') | list }}"
  loop_control:
    label: "{{ item.volumeGroup }}/{{ item.logicalVolume }}"
  changed_when: true

- name: Grow each small volume and its filesystem, on the same physical volumes
  ansible.builtin.command:
    argv: >-
      {{ ['lvextend', '--resizefs', '--size', item.sizeBytes ~ 'b',
          item.volumeGroup ~ '/' ~ item.logicalVolume] + item.physicalVolumes }}
  loop: "{{ cloudfall_volumes_actions | selectattr('action', 'equalto', 'grow') | list }}"
  loop_control:
    label: "{{ item.volumeGroup }}/{{ item.logicalVolume }}"
  changed_when: true

- name: Read each volume's filesystem UUID
  ansible.builtin.command:
    argv:
      - blkid
      - -s
      - UUID
      - -o
      - value
      - "/dev/{{ item.volumeGroup }}/{{ item.logicalVolume }}"
  loop: "{{ cloudfall_volumes_actions }}"
  loop_control:
    label: "{{ item.volumeGroup }}/{{ item.logicalVolume }}"
  register: cloudfall_volumes_uuids
  changed_when: false

- name: Create each mount path
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "0755"
  loop: "{{ cloudfall_volumes_actions }}"
  loop_control:
    label: "{{ item.path }}"

- name: Mount each volume by UUID at boot, without blocking it
  ansible.builtin.lineinfile:
    path: "{{ cloudfall_volumes_fstab }}"
    regexp: '^\S+\s+{{ item.item.path | regex_escape }}\s'
    line: >-
      UUID={{ item.stdout | trim }} {{ item.item.path }} ext4
      defaults,nofail,x-systemd.device-timeout=10s 0 2
  loop: "{{ cloudfall_volumes_uuids.results }}"
  loop_control:
    label: "{{ item.item.path }}"

- name: Check which volumes are mounted
  ansible.builtin.command:
    argv:
      - findmnt
      - --noheadings
      - --mountpoint
      - "{{ item.path }}"
  loop: "{{ cloudfall_volumes_actions }}"
  loop_control:
    label: "{{ item.path }}"
  register: cloudfall_volumes_mounted
  changed_when: false
  failed_when: cloudfall_volumes_mounted.rc not in [0, 1]

- name: Mount each volume that is not mounted yet
  ansible.builtin.command:
    argv:
      - mount
      - "{{ item.item.path }}"
  loop: "{{ cloudfall_volumes_mounted.results | selectattr('rc', 'equalto', 1) | list }}"
  loop_control:
    label: "{{ item.item.path }}"
  changed_when: true

- name: Create a drop-in directory for each unit that needs a volume
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item.1 }}.d"
    state: directory
    mode: "0755"
  loop: "{{ cloudfall_volumes_actions | subelements('units') }}"
  loop_control:
    label: "{{ item.1 }}"

- name: Start each unit only once its volume is mounted
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.1 }}.d/cloudfall-volume-{{ item.0.name }}.conf"
    content: |
      [Unit]
      RequiresMountsFor={{ item.0.path }}
    mode: "0644"
  loop: "{{ cloudfall_volumes_actions | subelements('units') }}"
  loop_control:
    label: "{{ item.1 }}"
  register: cloudfall_volumes_dropins

- name: Reload systemd after a drop-in changed  # noqa: no-handler
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: cloudfall_volumes_dropins is changed
