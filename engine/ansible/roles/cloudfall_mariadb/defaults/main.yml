---
# Controller paths of each owner's staged hash file, by owner; services.yml
# passes the service's entry of cloudfall_services_mariadb_files (S-019, D-9).
cloudfall_mariadb_hash_files: {}
# What the services converge decided for this server's data volume (S-014).
cloudfall_mariadb_volume_actions: >-
  {{ (cloudfall_volume_actions | default({})).get(cloudfall_server_id, [])
     | selectattr('name', 'equalto', 'mariadb') | list }}
cloudfall_mariadb_series: >-
  {{ cloudfall_mariadb_service.mariadb.version.split('.')[:2] | join('.') }}
# The upstream X.Y.Z of the installed mariadb-server, or '' when none is:
# MariaDB's 1:11.8.9+maria~deb13 and Debian's 1:11.8.3-0+deb13u1 alike.
cloudfall_mariadb_installed_version: >-
  {{
    (cloudfall_mariadb_installed.stdout.split('|')[1].split(':') | last
     | regex_search('^[0-9]+[.][0-9]+[.][0-9]+') | default('', true))
    if cloudfall_mariadb_installed.rc == 0
    and cloudfall_mariadb_installed.stdout.startswith('installed|')
    else ''
  }}
# The exact package of MariaDB's archive: 1:<version>+maria~deb<major>.
cloudfall_mariadb_package_version: >-
  1:{{ cloudfall_mariadb_service.mariadb.version }}+maria~deb{{
    ansible_facts['distribution_major_version'] }}
cloudfall_mariadb_data_path: /var/lib/mysql
cloudfall_mariadb_settings_path: /etc/mysql/mariadb.conf.d/90-cloudfall.cnf
cloudfall_mariadb_client: /usr/bin/mariadb
cloudfall_mariadb_admin: /usr/bin/mariadb-admin
# The host directory an owner's statement, holding its hash, is staged in,
# 0700 root, the file removed after the run.
cloudfall_mariadb_state_directory: /var/lib/cloudfall/mariadb
cloudfall_mariadb_repository_key_url: https://mariadb.org/mariadb_release_signing_key.pgp
cloudfall_mariadb_repository_key_path: /etc/apt/keyrings/mariadb-keyring.pgp
# MariaDB's archive keeps every release; the series repository keeps only the
# newest patches, so a pinned version comes from here.
cloudfall_mariadb_repository_url: https://archive.mariadb.org
# The series MariaDB publishes packages for, by Debian major release (S-019,
# Supported versions): only series newer than the one Debian ships.
cloudfall_mariadb_debian_series:
  "12":
    - "10.11"
    - "11.4"
    - "11.8"
    - "12.3"
  "13":
    - "11.8"
    - "12.3"
# The marker role every user Cloudfall creates or adopts holds (S-019).
cloudfall_mariadb_managed_role: cloudfall-managed
# Accounts the package, MariaDB or Cloudfall itself holds; never declared,
# locked or listed as unmanaged.
cloudfall_mariadb_system_users:
  - root
  - mysql
  - mariadb.sys
  - cloudfall_repl
  - alloy
# The declared users: every database's owner, an application's Linux user or
# an owner with a password, each once.
cloudfall_mariadb_declared_users: >-
  {{
    cloudfall_mariadb_service.mariadb.databases
    | map(attribute='owner') | unique | list
  }}
cloudfall_mariadb_application_users: >-
  {{
    cloudfall_mariadb_service.mariadb.databases
    | rejectattr('passwordRef', 'defined')
    | map(attribute='owner') | unique | list
  }}
cloudfall_mariadb_owners: >-
  {{
    cloudfall_mariadb_service.mariadb.databases
    | selectattr('passwordRef', 'defined')
    | unique(attribute='owner') | list
  }}
# What accounts.yml reads before it changes anything, one column each.
cloudfall_mariadb_state_queries:
  users: SELECT User FROM mysql.global_priv WHERE Host = 'localhost'
  socket_users: >-
    SELECT User FROM mysql.global_priv WHERE Host = 'localhost'
    AND JSON_VALUE(Priv, '$.plugin') = 'unix_socket'
    AND JSON_EXTRACT(Priv, '$.auth_or') IS NULL
  locked_users: >-
    SELECT User FROM mysql.global_priv WHERE Host = 'localhost'
    AND JSON_VALUE(Priv, '$.account_locked') = 'true'
  managed_users: >-
    SELECT User FROM mysql.roles_mapping WHERE Host = 'localhost'
    AND Role = '{{ cloudfall_mariadb_managed_role }}' AND Admin_option = 'N'
  roles: >-
    SELECT User FROM mysql.global_priv WHERE Host = ''
    AND User = '{{ cloudfall_mariadb_managed_role }}'
  ed25519: >-
    SELECT PLUGIN_NAME FROM information_schema.PLUGINS
    WHERE PLUGIN_NAME = 'ed25519' AND PLUGIN_STATUS = 'ACTIVE'
  databases: SELECT SCHEMA_NAME FROM information_schema.SCHEMATA
  grants: SELECT CONCAT(User, '|', Db) FROM mysql.db WHERE Host = 'localhost'
