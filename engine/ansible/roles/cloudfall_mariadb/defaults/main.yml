---
# Controller paths of each owner's staged hash file, by owner; services.yml
# passes the service's entry of cloudfall_services_mariadb_files (S-019, D-9).
cloudfall_mariadb_hash_files: {}
# What the services converge decided for this server's data volume (S-014).
cloudfall_mariadb_volume_actions: >-
  {{ (cloudfall_volume_actions | default({})).get(cloudfall_server_id, [])
     | selectattr('name', 'equalto', 'mariadb') | list }}
cloudfall_mariadb_series: >-
  {{ cloudfall_mariadb_service.mariadb.version.split('.')[:2] | join('.') }}
# The upstream X.Y.Z of the installed mariadb-server, or '' when none is:
# MariaDB's 1:11.8.9+maria~deb13 and Debian's 1:11.8.3-0+deb13u1 alike.
cloudfall_mariadb_installed_version: >-
  {{
    (cloudfall_mariadb_installed.stdout.split('|')[1].split(':') | last
     | regex_search('^[0-9]+[.][0-9]+[.][0-9]+') | default('', true))
    if cloudfall_mariadb_installed.rc == 0
    and cloudfall_mariadb_installed.stdout.startswith('installed|')
    else ''
  }}
# The exact package of MariaDB's archive: 1:<version>+maria~deb<major>.
cloudfall_mariadb_package_version: >-
  1:{{ cloudfall_mariadb_service.mariadb.version }}+maria~deb{{
    ansible_facts['distribution_major_version'] }}
cloudfall_mariadb_data_path: /var/lib/mysql
cloudfall_mariadb_settings_path: /etc/mysql/mariadb.conf.d/90-cloudfall.cnf
cloudfall_mariadb_client: /usr/bin/mariadb
cloudfall_mariadb_admin: /usr/bin/mariadb-admin
# The host directory an owner's statement, holding its hash, is staged in,
# 0700 root, the file removed after the run.
cloudfall_mariadb_state_directory: /var/lib/cloudfall/mariadb
# The backup root every service's backup directory shares, root-owned 0755.
cloudfall_mariadb_backup_root: /var/backups/cloudfall
cloudfall_mariadb_repository_key_url: https://mariadb.org/mariadb_release_signing_key.pgp
cloudfall_mariadb_repository_key_path: /etc/apt/keyrings/mariadb-keyring.pgp
# MariaDB's archive keeps every release; the series repository keeps only the
# newest patches, so a pinned version comes from here.
cloudfall_mariadb_repository_url: https://archive.mariadb.org
# The series MariaDB publishes packages for, by Debian major release (S-019,
# Supported versions): only series newer than the one Debian ships.
cloudfall_mariadb_debian_series:
  "12":
    - "10.11"
    - "11.4"
    - "11.8"
    - "12.3"
  "13":
    - "11.8"
    - "12.3"
# The marker role every user Cloudfall creates or adopts holds (S-019).
cloudfall_mariadb_managed_role: cloudfall-managed
# Accounts the package, MariaDB or Cloudfall itself holds; never declared,
# locked or listed as unmanaged.
cloudfall_mariadb_system_users:
  - root
  - mysql
  - mariadb.sys
  - cloudfall_repl
  - alloy
# The declared users: every database's owner, an application's Linux user or
# an owner with a password, each once.
cloudfall_mariadb_declared_users: >-
  {{
    cloudfall_mariadb_service.mariadb.databases
    | map(attribute='owner') | unique | list
  }}
cloudfall_mariadb_application_users: >-
  {{
    cloudfall_mariadb_service.mariadb.databases
    | rejectattr('passwordRef', 'defined')
    | map(attribute='owner') | unique | list
  }}
cloudfall_mariadb_owners: >-
  {{
    cloudfall_mariadb_service.mariadb.databases
    | selectattr('passwordRef', 'defined')
    | unique(attribute='owner') | list
  }}
# remoteAccess (S-019, Access): the server certificate from the project CA,
# its key, made on this host, and the CA, at the paths of the server's S-011
# certificate requirement mariadb, which replication uses too.
cloudfall_mariadb_certificate_path: /etc/mysql/cloudfall/server.crt
cloudfall_mariadb_key_path: /etc/mysql/cloudfall/server.key
cloudfall_mariadb_ca_path: /etc/mysql/cloudfall/ca.crt
# What the services converge signed and staged for this server: the
# certificate and the CA, only when they are missing or due.
cloudfall_mariadb_delivered_files: >-
  {{ (cloudfall_services_mariadb_delivered_files | default({}))
     .get(cloudfall_server_id, []) }}
# The account host of each allowed source: 10.0.0.0/255.255.255.0, or one
# address as itself; '' for an IPv6 network, which MariaDB cannot match.
cloudfall_mariadb_remote_hosts: >-
  {{
    cloudfall_mariadb_service.mariadb.remoteAccess.allowedSources
    | map('cloudfall_mariadb_host') | list
    if cloudfall_mariadb_service.mariadb.remoteAccess is defined
    else []
  }}
# Each owner's account from each allowed source, as user@host.
cloudfall_mariadb_remote_accounts: >-
  {{
    cloudfall_mariadb_owners | map(attribute='owner')
    | product(cloudfall_mariadb_remote_hosts) | map('join', '@') | list
  }}
# Whether an account of mysql.global_priv is locked, the one condition every
# read of locked accounts uses: the flag reads 'true' on the older series
# and 1 on 11.8 (#452).
cloudfall_mariadb_account_locked: >-
  JSON_VALUE(Priv, '$.account_locked') IN ('true', '1')
# What remote_accounts.yml reads: the accounts at a host other than
# localhost, as user@host, and their grants as user@host|database.
cloudfall_mariadb_remote_state_queries:
  users: >-
    SELECT CONCAT(User, '@', Host) FROM mysql.global_priv
    WHERE Host NOT IN ('localhost', '')
  locked_users: >-
    SELECT CONCAT(User, '@', Host) FROM mysql.global_priv
    WHERE Host NOT IN ('localhost', '')
    AND {{ cloudfall_mariadb_account_locked }}
  managed_users: >-
    SELECT CONCAT(User, '@', Host) FROM mysql.roles_mapping
    WHERE Host NOT IN ('localhost', '')
    AND Role = '{{ cloudfall_mariadb_managed_role }}' AND Admin_option = 'N'
  grants: >-
    SELECT CONCAT(User, '@', Host, '|', Db) FROM mysql.db
    WHERE Host NOT IN ('localhost', '')
# Replication (S-019, Replication). What the services converge staged for
# this service: on a primary 'hash', the controller path of the
# mysql_native_password hash of its cloudfall_repl password; on a replica
# 'password', the controller path of its primary's cloudfall_repl password,
# copied 0600 for the run only (D-9 for the primary's side); on a replica of
# an outside source 'sourceUser', 'sourcePassword' and, with
# caCertificateFile, 'sourceCa'.
cloudfall_mariadb_replication_files: {}
# Where the role reports each replication outcome, a controller directory
# the services converge reads ('' reports nothing): a refusal turns into
# PRECONDITION, a promotion names the last GTID it applied.
cloudfall_mariadb_report_directory: ""
cloudfall_mariadb_replication_user: cloudfall_repl
cloudfall_mariadb_dump_client: /usr/bin/mariadb-dump
# standalone, primary or replica, as declared
cloudfall_mariadb_declared_role: >-
  {{
    cloudfall_mariadb_service.mariadb.replication.role
    if cloudfall_mariadb_service.mariadb.replication is defined
    else 'standalone'
  }}
# The pair as the inventory renders it for this service: 'primary' (a
# replica's: service, server, serverId, host, port), 'replicas' (a
# primary's: service, server, serverId, hosts) and 'peers' (every MariaDB
# service with replication of the environment but this one: service,
# server, serverId, role, hosts, the addresses a link to it may name, its
# port and, for a replica, primary).
cloudfall_mariadb_links: >-
  {{ (cloudfall_mariadb_replication | default({})).get(cloudfall_mariadb_service.id, {}) }}
# A replica's source Cloudfall does not manage, as the inventory renders it
# (host, port, and tls: whether caCertificateFile is declared); {} for any
# other service (S-019).
cloudfall_mariadb_source: "{{ cloudfall_mariadb_links.source | default({}) }}"
# Where a replica keeps its source's CA, which its link verifies against.
cloudfall_mariadb_source_ca_path: /etc/mysql/cloudfall/source-ca.crt
# What the preflight reads on that source, and nothing else: the release,
# the binary log, server_id, and the rights of the account.
cloudfall_mariadb_source_queries:
  server: >-
    SELECT VERSION(), @@global.log_bin, @@global.binlog_format,
    @@global.server_id
  grants: SHOW GRANTS
# Why the preflight stops, once source_check.yml found a problem.
cloudfall_mariadb_source_message: >-
  replica {{ cloudfall_mariadb_service.id }} can not follow its source
  {{ cloudfall_mariadb_source.host }}:{{ cloudfall_mariadb_source.port }}:
  {{ cloudfall_mariadb_source_problems | join('; ') }}. Nothing was installed
  on {{ cloudfall_server_id }} and nothing on the source changed
# The account hosts of cloudfall_repl on a primary: each replica's IPv4.
cloudfall_mariadb_replica_hosts: >-
  {{
    (cloudfall_mariadb_links.replicas | default([]))
    | map(attribute='hosts') | flatten | unique | list
  }}
# What cloudfall_repl may do: follow the binary log and read every database,
# because it also seeds a replica (a consistent dump records its position).
cloudfall_mariadb_replication_privileges:
  - REPLICATION SLAVE
  - BINLOG MONITOR
  - SELECT
  - SHOW VIEW
  - TRIGGER
  - EVENT
  - RELOAD
cloudfall_mariadb_system_databases:
  - information_schema
  - mysql
  - performance_schema
  - sys
# How long a replica may take to reach its source's position: after a seed,
# and before a promotion from a read-only source.
cloudfall_mariadb_catch_up_seconds: 600
cloudfall_mariadb_promotion_wait_seconds: 60
# How long the replica's server tries the port of a source that is no
# declared service; a probe that times out leaves the source unknown, and
# the promotion refuses.
cloudfall_mariadb_source_probe_seconds: 10
# The probe that tries it, run on the replica's server with its Python (the
# one Ansible itself needs there), not on the controller (#455).
cloudfall_mariadb_source_probe_script: "{{ role_path }}/files/mariadb_source_probe.py"
cloudfall_mariadb_source_probe_python: /usr/bin/python3
# How often, 30 times, the role looks whether a new link's threads run.
cloudfall_mariadb_link_poll_seconds: 2
# A directory in the data directory that is no database, such as a data
# volume's lost+found, shows as #mysql50#<name> until the managed settings
# ignore it (#449): never a database of the server. '#' is no LIKE wildcard.
cloudfall_mariadb_no_database_pattern: "#mysql50#%"
# One line, '|' between fields: read_only, server_id, the binary log's
# position and state, the applied position, the current position, and how
# many databases are not MariaDB's own; the cloudfall_mariadb_replication_state
# filter reads it. read_only by the form the server gives: 1 on the older
# series, ON on 11.8 (#450); the filter reads both. Not '+ 0': no server has
# shown what 11.8 reads it as in arithmetic, and a name read as a number is 0.
cloudfall_mariadb_replication_state_query: >-
  SELECT CONCAT_WS('|', @@global.read_only, @@global.server_id,
  @@global.gtid_binlog_pos, @@global.gtid_binlog_state,
  @@global.gtid_slave_pos, @@global.gtid_current_pos,
  (SELECT COUNT(*) FROM information_schema.SCHEMATA
  WHERE SCHEMA_NAME NOT IN ('{{ cloudfall_mariadb_system_databases | join("', '") }}')
  AND SCHEMA_NAME NOT LIKE '{{ cloudfall_mariadb_no_database_pattern }}'))
# The databases of a server that are not MariaDB's own, and how many tables
# each holds, as database|count.
cloudfall_mariadb_databases_query: >-
  SELECT SCHEMA_NAME FROM information_schema.SCHEMATA
  WHERE SCHEMA_NAME NOT IN ('{{ cloudfall_mariadb_system_databases | join("', '") }}')
  AND SCHEMA_NAME NOT LIKE '{{ cloudfall_mariadb_no_database_pattern }}'
  ORDER BY SCHEMA_NAME
cloudfall_mariadb_table_counts_query: >-
  SELECT CONCAT(s.SCHEMA_NAME, '|', COUNT(t.TABLE_NAME))
  FROM information_schema.SCHEMATA s LEFT JOIN information_schema.TABLES t
  ON t.TABLE_SCHEMA = s.SCHEMA_NAME
  WHERE s.SCHEMA_NAME NOT IN ('{{ cloudfall_mariadb_system_databases | join("', '") }}')
  AND s.SCHEMA_NAME NOT LIKE '{{ cloudfall_mariadb_no_database_pattern }}'
  GROUP BY s.SCHEMA_NAME ORDER BY s.SCHEMA_NAME
# A replica is read-only for every user but root; so is a server whose
# promotion waits for its source to turn read-only.
cloudfall_mariadb_read_only: >-
  {{
    cloudfall_mariadb_declared_role == 'replica'
    or (cloudfall_mariadb_plan | default({})).get('action') == 'wait-promotion'
  }}
# The replication plans that change nothing yet and finish in a later
# converge; each names why, and the answer says so (#451).
cloudfall_mariadb_waits:
  - demote
  - wait-promotion
  - wait-primary
# Whether this server takes writes, so converges its databases and users.
cloudfall_mariadb_writer: >-
  {{
    (cloudfall_mariadb_plan | default({'action': cloudfall_mariadb_declared_role})).action
    in ['standalone', 'primary', 'promote']
  }}
# What accounts.yml reads before it changes anything, one column each.
cloudfall_mariadb_state_queries:
  users: SELECT User FROM mysql.global_priv WHERE Host = 'localhost'
  socket_users: >-
    SELECT User FROM mysql.global_priv WHERE Host = 'localhost'
    AND JSON_VALUE(Priv, '$.plugin') = 'unix_socket'
    AND JSON_EXTRACT(Priv, '$.auth_or') IS NULL
  locked_users: >-
    SELECT User FROM mysql.global_priv WHERE Host = 'localhost'
    AND {{ cloudfall_mariadb_account_locked }}
  managed_users: >-
    SELECT User FROM mysql.roles_mapping WHERE Host = 'localhost'
    AND Role = '{{ cloudfall_mariadb_managed_role }}' AND Admin_option = 'N'
  roles: >-
    SELECT User FROM mysql.global_priv WHERE Host = ''
    AND User = '{{ cloudfall_mariadb_managed_role }}'
  ed25519: >-
    SELECT PLUGIN_NAME FROM information_schema.PLUGINS
    WHERE PLUGIN_NAME = 'ed25519' AND PLUGIN_STATUS = 'ACTIVE'
  databases: SELECT SCHEMA_NAME FROM information_schema.SCHEMATA
  grants: SELECT CONCAT(User, '|', Db) FROM mysql.db WHERE Host = 'localhost'
# The account the collector scrapes the server as, with metrics declared:
# Alloy's Linux user through the socket, as on PostgreSQL (mariadb.METRICS_USER).
cloudfall_mariadb_metrics_user: alloy
# What it may do: read status, including InnoDB's, and replication state.
cloudfall_mariadb_metrics_privileges:
  - PROCESS
  - SLAVE MONITOR
# What metrics.yml reads before it changes anything, one column each.
cloudfall_mariadb_metrics_state_queries:
  users: "{{ cloudfall_mariadb_state_queries.users }}"
  socket_users: "{{ cloudfall_mariadb_state_queries.socket_users }}"
  privileges: >-
    SELECT PRIVILEGE_TYPE FROM information_schema.USER_PRIVILEGES
    WHERE GRANTEE = '''{{ cloudfall_mariadb_metrics_user }}''@''localhost'''
