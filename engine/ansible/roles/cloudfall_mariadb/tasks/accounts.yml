---
# The declared databases and their users (S-019, Access). Cloudfall works as
# root through the unix socket. A user it creates or adopts holds the marker
# role, which carries no privilege; a marked user no longer declared is
# locked, never dropped, and its database stays with its rows. Users and
# databases without the marker are left alone. Every statement runs only when
# what it changes differs, so a second converge changes nothing.
- name: Read the server's databases and localhost users
  ansible.builtin.command:
    argv:
      - "{{ cloudfall_mariadb_client }}"
      - --batch
      - --raw
      - --skip-column-names
      - --execute
      - "{{ item.value }}"
  loop: "{{ cloudfall_mariadb_state_queries | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: cloudfall_mariadb_state_read
  changed_when: false

- name: Keep what the server holds
  ansible.builtin.set_fact:
    cloudfall_mariadb_state: >-
      {{
        dict(
          cloudfall_mariadb_state_read.results | map(attribute='item.key')
          | zip(cloudfall_mariadb_state_read.results
                | map(attribute='stdout_lines'))
        )
      }}

- name: Create the marker role of the users Cloudfall manages
  ansible.builtin.command:
    argv:
      - "{{ cloudfall_mariadb_client }}"
      - --batch
      - --execute
      - CREATE ROLE '{{ cloudfall_mariadb_managed_role }}'
  changed_when: true
  when: cloudfall_mariadb_state.roles | length == 0

- name: Load the ed25519 authentication plugin
  ansible.builtin.command:
    argv:
      - "{{ cloudfall_mariadb_client }}"
      - --batch
      - --execute
      - INSTALL SONAME 'auth_ed25519'
  changed_when: true
  when:
    - >-
      cloudfall_mariadb_service.mariadb.databases
      | selectattr('authentication', 'defined')
      | selectattr('authentication', 'equalto', 'ed25519')
      | list | length > 0
    - cloudfall_mariadb_state.ed25519 | length == 0

- name: Create missing databases
  ansible.builtin.command:
    argv:
      - "{{ cloudfall_mariadb_client }}"
      - --batch
      - --execute
      - CREATE DATABASE `{{ item.name }}` CHARACTER SET utf8mb4
  loop: "{{ cloudfall_mariadb_service.mariadb.databases }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: true
  when: item.name not in cloudfall_mariadb_state.databases

# The application's Linux user connects through the socket with no password;
# over TCP the plugin refuses it, so nobody connects as it there.
- name: Create the socket user of each application
  ansible.builtin.command:
    argv:
      - "{{ cloudfall_mariadb_client }}"
      - --batch
      - --execute
      - >-
        CREATE USER '{{ item }}'@'localhost' IDENTIFIED VIA unix_socket
  loop: "{{ cloudfall_mariadb_application_users }}"
  changed_when: true
  when: item not in cloudfall_mariadb_state.users

- name: Authenticate an adopted application user by the socket only
  ansible.builtin.command:
    argv:
      - "{{ cloudfall_mariadb_client }}"
      - --batch
      - --execute
      - >-
        ALTER USER '{{ item }}'@'localhost' IDENTIFIED VIA unix_socket
  loop: "{{ cloudfall_mariadb_application_users }}"
  changed_when: true
  when:
    - item in cloudfall_mariadb_state.users
    - item not in cloudfall_mariadb_state.socket_users

- name: Set each owner's password from its staged hash
  ansible.builtin.include_tasks: owner_password.yml
  loop: "{{ cloudfall_mariadb_owners }}"
  loop_control:
    loop_var: cloudfall_mariadb_owner
    label: "{{ cloudfall_mariadb_owner.owner }}"

- name: Mark each declared user as Cloudfall's
  ansible.builtin.command:
    argv:
      - "{{ cloudfall_mariadb_client }}"
      - --batch
      - --execute
      - >-
        GRANT '{{ cloudfall_mariadb_managed_role }}' TO '{{ item }}'@'localhost'
  loop: "{{ cloudfall_mariadb_declared_users }}"
  changed_when: true
  when: item not in cloudfall_mariadb_state.managed_users

# An underscore is a wildcard in a grant's database name: it is escaped, so
# the grant names that database alone, as mysql.db then holds it.
- name: Give each user every privilege on its own database
  ansible.builtin.command:
    argv:
      - "{{ cloudfall_mariadb_client }}"
      - --batch
      - --execute
      - >-
        GRANT ALL PRIVILEGES ON `{{ item.name | replace('_', '\_') }}`.*
        TO '{{ item.owner }}'@'localhost'
  loop: "{{ cloudfall_mariadb_service.mariadb.databases }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: true
  when: >-
    item.owner ~ '|' ~ (item.name | replace('_', '\_'))
    not in cloudfall_mariadb_state.grants

- name: Unlock a declared user that was locked
  ansible.builtin.command:
    argv:
      - "{{ cloudfall_mariadb_client }}"
      - --batch
      - --execute
      - ALTER USER '{{ item }}'@'localhost' ACCOUNT UNLOCK
  loop: "{{ cloudfall_mariadb_declared_users }}"
  changed_when: true
  when: item in cloudfall_mariadb_state.locked_users

# Dropping data is never a side effect of a converge (S-019-7).
- name: Lock each user Cloudfall made that is no longer declared
  ansible.builtin.command:
    argv:
      - "{{ cloudfall_mariadb_client }}"
      - --batch
      - --execute
      - ALTER USER '{{ item }}'@'localhost' ACCOUNT LOCK
  loop: >-
    {{
      cloudfall_mariadb_state.managed_users
      | reject('in', cloudfall_mariadb_declared_users)
      | reject('in', cloudfall_mariadb_system_users)
      | reject('in', cloudfall_mariadb_state.locked_users)
      | list
    }}
  changed_when: true
