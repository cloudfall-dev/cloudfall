---
# Decide what replication does on this server, from what it and its peer
# hold now, before the settings change anything (S-019, Replication). It
# only reads: this server as root through the socket, and the other server
# of the pair the same way, on that server (delegated), so no password is
# needed to read either. The plan is one of:
#
# - standalone, primary: nothing replicates into this server
# - follow: a replica already linked to its declared primary
# - seed: an empty replica that never replicated; it is loaded from one
#   consistent dump of its primary
# - attach: a replica that holds data whose GTIDs its primary saw all of;
#   it follows from its own position, with no new copy
# - demote: a former primary declared the replica of a server that still
#   follows it (by its server_id, or by its host and port while that link
#   has not connected): it turns read-only now and attaches once that one is
#   promoted (#451)
# - wait-primary: a seed or an attach whose primary holds no replication
#   account for it yet and has not converged in this run: it turns
#   read-only and attaches in the next converge, once the primary's has
#   created the account (#451)
# - promote: a replica declared primary or standalone whose declared source
#   can't be reached, or is read-only and applied, or whose undeclared
#   source refuses a connection from this server (#455)
# - wait-promotion: the same, while its source is writable but is declared
#   this one's replica in the same change: nothing changes until it turns
#   read-only
#
# Anything else is refused here, with nothing changed: a promotion over a
# running, writable source (PRECONDITION naming both positions, S-019-14) or
# over a source that is no declared service and still answers, or that
# Cloudfall can't tell is stopped (#440, #446), a server that holds data and
# can't attach (S-019-13), and a former primary whose GTIDs its new primary
# never saw (S-019-16). A server is never seeded over data and never emptied.
- name: Read this server's replication position and databases
  ansible.builtin.command:
    argv:
      - "{{ cloudfall_mariadb_client }}"
      - --batch
      - --raw
      - --skip-column-names
      - --execute
      - "{{ cloudfall_mariadb_replication_state_query }}"
  register: cloudfall_mariadb_local_read
  changed_when: false
  check_mode: false

- name: Read this server's link to a primary
  ansible.builtin.command:
    argv:
      - "{{ cloudfall_mariadb_client }}"
      - --vertical
      - --execute
      - SHOW SLAVE STATUS
  register: cloudfall_mariadb_link_read
  changed_when: false
  check_mode: false

- name: Keep this server's replication state
  ansible.builtin.set_fact:
    cloudfall_mariadb_local: >-
      {{ cloudfall_mariadb_local_read.stdout | cloudfall_mariadb_replication_state }}
    cloudfall_mariadb_link: >-
      {{ cloudfall_mariadb_link_read.stdout | cloudfall_mariadb_vertical }}

# The server it follows now, found by the source's server_id among the
# declared services, or, when that server_id is none of theirs (0 while the
# link has not connected), by the host and port it names (#440, #446);
# otherwise, for a replica, the primary it declares.
- name: Name the other server of the pair
  ansible.builtin.set_fact:
    cloudfall_mariadb_peer: >-
      {{
        (cloudfall_mariadb_link
         | cloudfall_mariadb_link_peer(cloudfall_mariadb_links.peers | default([])))
        if cloudfall_mariadb_link
        else (cloudfall_mariadb_links.primary | default({}))
      }}

# A server declared primary or standalone that follows no declared service
# and whose link is not running: Cloudfall can't read that source, so it
# promotes only when a connection to its port is refused (#440). The
# connection is tried from this server, which the source admitted while it
# replicated from it, not from the controller, which a firewall that
# REJECTs everyone but the replica would refuse too (#455). The script names
# what it read: a timeout, no route or a name it can't resolve is unknown,
# not stopped, and refuses (#446); wait_for reports all of them as one
# timeout. The plan reads the link's last IO error first: one only a
# running source sends refuses whatever the probe read.
- name: Try the port of a source that is no declared service, from this server
  ansible.builtin.script:
    cmd: >-
      {{ cloudfall_mariadb_source_probe_script | quote }}
      {{ cloudfall_mariadb_link.Master_Host | quote }}
      {{ cloudfall_mariadb_link.Master_Port | int }}
      {{ cloudfall_mariadb_source_probe_seconds | int }}
    executable: "{{ cloudfall_mariadb_source_probe_python }}"
  register: cloudfall_mariadb_source_probe_read
  changed_when: false
  check_mode: false
  when:
    - cloudfall_mariadb_link | length > 0
    - cloudfall_mariadb_declared_role != 'replica'
    - cloudfall_mariadb_peer | length == 0
    - cloudfall_mariadb_link.Slave_IO_Running | default('No') != 'Yes'

# Empty when there was nothing to probe.
- name: Keep what the probe of the source's port read
  ansible.builtin.set_fact:
    cloudfall_mariadb_source_probe: >-
      {{
        cloudfall_mariadb_source_probe_read.stdout | trim
        if cloudfall_mariadb_source_probe_read is not skipped
        else ''
      }}

- name: Read the other server's replication position and databases
  ansible.builtin.command:
    argv:
      - >-
        {{ hostvars[cloudfall_mariadb_peer.server].cloudfall_mariadb_client
           | default(cloudfall_mariadb_client) }}
      - --batch
      - --raw
      - --skip-column-names
      - --execute
      - "{{ cloudfall_mariadb_replication_state_query }}"
  # Evaluated before the condition: a server with no peer names itself.
  delegate_to: "{{ cloudfall_mariadb_peer.server | default(inventory_hostname) }}"
  register: cloudfall_mariadb_peer_read
  # A server that is down, or whose MariaDB is stopped, can't be reached.
  failed_when: false
  ignore_unreachable: true
  changed_when: false
  check_mode: false
  when: cloudfall_mariadb_peer | length > 0

- name: Read the other server's link to a primary
  ansible.builtin.command:
    argv:
      - >-
        {{ hostvars[cloudfall_mariadb_peer.server].cloudfall_mariadb_client
           | default(cloudfall_mariadb_client) }}
      - --vertical
      - --execute
      - SHOW SLAVE STATUS
  # Evaluated before the condition: a server with no peer names itself.
  delegate_to: "{{ cloudfall_mariadb_peer.server | default(inventory_hostname) }}"
  register: cloudfall_mariadb_peer_link_read
  failed_when: false
  ignore_unreachable: true
  changed_when: false
  check_mode: false
  when: cloudfall_mariadb_peer | length > 0

# A replica of a source Cloudfall does not manage that has no link yet reads
# that source's position and databases with its login, as the module reads
# it: SELECT alone (S-019).
- name: Read the outside source's replication position and databases
  cloudfall_mariadb_source:
    host: "{{ cloudfall_mariadb_source.host }}"
    port: "{{ cloudfall_mariadb_source.port | int }}"
    user: "{{ lookup('ansible.builtin.file', cloudfall_mariadb_replication_files.sourceUser) }}"
    password: "{{ lookup('ansible.builtin.file', cloudfall_mariadb_replication_files.sourcePassword) }}"
    ca: >-
      {{
        lookup('ansible.builtin.file', cloudfall_mariadb_replication_files.sourceCa)
        if cloudfall_mariadb_source.tls else ''
      }}
    queries:
      state: "{{ cloudfall_mariadb_replication_state_query }}"
  register: cloudfall_mariadb_source_state_read
  # One that can't be read is not reached: the plan refuses to seed or attach.
  failed_when: false
  check_mode: false
  no_log: true
  when:
    - cloudfall_mariadb_source | length > 0
    - cloudfall_mariadb_link | length == 0

- name: Keep the other server's replication state
  ansible.builtin.set_fact:
    cloudfall_mariadb_peer_reached: >-
      {{ cloudfall_mariadb_peer_reachable or cloudfall_mariadb_source_reachable }}
    cloudfall_mariadb_peer_state: >-
      {{
        cloudfall_mariadb_peer_read.stdout | cloudfall_mariadb_replication_state
        if cloudfall_mariadb_peer_reachable | bool
        else cloudfall_mariadb_source_state_read.rows.state[0][0]
             | cloudfall_mariadb_replication_state
        if cloudfall_mariadb_source_reachable | bool
        else {}
      }}
    cloudfall_mariadb_peer_link: >-
      {{
        cloudfall_mariadb_peer_link_read.stdout | cloudfall_mariadb_vertical
        if cloudfall_mariadb_peer_reachable | bool
        and cloudfall_mariadb_peer_link_read.rc | default(1) == 0
        else {}
      }}
  vars:
    cloudfall_mariadb_peer_reachable: >-
      {{
        cloudfall_mariadb_peer | length > 0
        and cloudfall_mariadb_peer_read is not skipped
        and not (cloudfall_mariadb_peer_read.unreachable | default(false))
        and cloudfall_mariadb_peer_read.rc | default(1) == 0
      }}
    cloudfall_mariadb_source_reachable: >-
      {{
        cloudfall_mariadb_source_state_read is not skipped
        and cloudfall_mariadb_source_state_read.rows is defined
      }}

# The declared service the primary of a replica follows, by the server_id
# its link reports or, while that link has not connected (0, as after a
# restart), by the host and port it names, among the services the primary's
# own pair names: this one, when the primary still follows it (#451).
- name: Name the server a replica's primary still follows
  ansible.builtin.set_fact:
    cloudfall_mariadb_peer_source: >-
      {{
        cloudfall_mariadb_peer_link
        | cloudfall_mariadb_link_peer(
            ((hostvars[cloudfall_mariadb_peer.server].cloudfall_mariadb_replication
              | default({})).get(cloudfall_mariadb_peer.service, {})).peers
            | default([]))
        if cloudfall_mariadb_declared_role == 'replica'
        and cloudfall_mariadb_peer_link | length > 0
        else {}
      }}

# A promotion drops what the replica has not applied: from a read-only
# source it first lets the replica reach the source's position. A wait,
# no change.
- name: Let this replica apply its read-only source's position
  ansible.builtin.command:
    argv:
      - "{{ cloudfall_mariadb_client }}"
      - --batch
      - --raw
      - --skip-column-names
      - --execute
      - >-
        SELECT CONCAT_WS('|', MASTER_GTID_WAIT('{{
        cloudfall_mariadb_peer_state.binlogPos }}', {{
        cloudfall_mariadb_promotion_wait_seconds }}), @@global.gtid_slave_pos)
  register: cloudfall_mariadb_promotion_wait
  changed_when: false
  check_mode: false
  when:
    - cloudfall_mariadb_link | length > 0
    - cloudfall_mariadb_declared_role != 'replica'
    - cloudfall_mariadb_peer_reached
    - cloudfall_mariadb_peer_state.readOnly == '1'

- name: Keep the position this replica applied
  ansible.builtin.set_fact:
    cloudfall_mariadb_local: >-
      {{
        cloudfall_mariadb_local
        | combine({'slavePos': cloudfall_mariadb_promotion_wait.stdout.split('|', 1)[1]
                   | default('')})
      }}
  when: cloudfall_mariadb_promotion_wait is not skipped

- name: Decide what replication does on this server
  ansible.builtin.set_fact:
    cloudfall_mariadb_plan: >-
      {{
        cloudfall_mariadb_local | cloudfall_mariadb_replication_plan(
          service=cloudfall_mariadb_service.id,
          declared=cloudfall_mariadb_declared_role,
          link=cloudfall_mariadb_link,
          links=cloudfall_mariadb_links,
          peer=cloudfall_mariadb_peer,
          other=cloudfall_mariadb_peer_state,
          other_link=cloudfall_mariadb_peer_link,
          other_source=cloudfall_mariadb_peer_source,
          source_probe=cloudfall_mariadb_source_probe)
      }}

# A replica's login is refused while its primary holds no account for it
# (MariaDB's error 1130); a primary creates its replicas' accounts in its
# own converge. Read on the primary, as root through its socket.
- name: Read the replication account's hosts on this replica's primary
  ansible.builtin.command:
    argv:
      - >-
        {{ hostvars[cloudfall_mariadb_links.primary.server].cloudfall_mariadb_client
           | default(cloudfall_mariadb_client) }}
      - --batch
      - --raw
      - --skip-column-names
      - --execute
      - >-
        SELECT Host FROM mysql.global_priv
        WHERE User = '{{ cloudfall_mariadb_replication_user }}'
  # Evaluated before the condition: a server that is no replica names itself.
  delegate_to: >-
    {{ (cloudfall_mariadb_links.primary | default({})).server | default(inventory_hostname) }}
  register: cloudfall_mariadb_primary_accounts
  changed_when: false
  check_mode: false
  when:
    - cloudfall_mariadb_declared_role == 'replica'
    - cloudfall_mariadb_plan.action in ['seed', 'attach']

# The primary's server runs later in this run: it waits for that converge
# rather than be refused its login. Once the primary has converged, when it
# is not in this run (a --limit leaves it out, so no converge in the run
# creates the account), or when its declaration does not admit this
# replica, the link is tried as before and a refusal stops the converge
# (#451).
- name: Wait for a primary that creates this replica's account later in the run
  ansible.builtin.set_fact:
    cloudfall_mariadb_plan: >-
      {{
        cloudfall_mariadb_plan | cloudfall_mariadb_account_wait(
          service=cloudfall_mariadb_service.id,
          primary=cloudfall_mariadb_links.primary,
          account_hosts=cloudfall_mariadb_primary_accounts.stdout_lines,
          admitted=(
            ((hostvars[cloudfall_mariadb_links.primary.server].cloudfall_mariadb_replication
              | default({})).get(cloudfall_mariadb_links.primary.service, {})).replicas
            | default([])
            | selectattr('service', 'equalto', cloudfall_mariadb_service.id)
            | map(attribute='hosts') | flatten | list),
          converged=(
            cloudfall_mariadb_links.primary.server not in ansible_play_hosts_all
            or hostvars[cloudfall_mariadb_links.primary.server].cloudfall_mariadb_plan
               is defined))
      }}
  when: cloudfall_mariadb_primary_accounts is not skipped

- name: Report a replication refusal to the services converge
  ansible.builtin.copy:
    content: >-
      {{ {'service': cloudfall_mariadb_service.id,
          'server': cloudfall_server_id,
          'outcome': 'refused'} | combine(cloudfall_mariadb_plan) | to_json }}
    dest: >-
      {{ cloudfall_mariadb_report_directory }}/{{ cloudfall_mariadb_service.id }}.json
    mode: "0600"
  delegate_to: localhost
  become: false
  when:
    - cloudfall_mariadb_plan.action == 'refuse'
    - cloudfall_mariadb_report_directory | length > 0

- name: Refuse a replication change that would lose or overwrite data
  ansible.builtin.fail:
    msg: "PRECONDITION {{ cloudfall_mariadb_plan.code }}: {{ cloudfall_mariadb_plan.message }}"
  when: cloudfall_mariadb_plan.action == 'refuse'
