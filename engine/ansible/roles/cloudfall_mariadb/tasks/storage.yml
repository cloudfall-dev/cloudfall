---
# S-019's volume requirement: the data directory lives on the mirrored
# mariadb volume, mounted before the package makes its first database there.
# The services converge decided its action before any host changed (S-014);
# a run that brings no decision (cloudfall-engine playbook run) needs the
# volume already mounted.
- name: Create, grow and mount the data volume
  ansible.builtin.include_role:
    name: cloudfall_volumes
  vars:
    cloudfall_volumes_actions: "{{ cloudfall_mariadb_volume_actions }}"
  when: cloudfall_mariadb_volume_actions | length > 0

- name: Read what is mounted at the data directory
  ansible.builtin.command:
    argv:
      - findmnt
      - --noheadings
      - --output
      - SOURCE
      - --mountpoint
      - "{{ cloudfall_mariadb_data_path }}"
  register: cloudfall_mariadb_data_mount
  # rc 1: nothing is mounted there
  failed_when: cloudfall_mariadb_data_mount.rc not in [0, 1]
  changed_when: false
  check_mode: false

# A dry run creates no volume, so only a real run can tell.
- name: Refuse a data directory that is not its volume
  ansible.builtin.assert:
    that:
      - cloudfall_mariadb_data_mount.rc == 0
    fail_msg: >-
      {{ cloudfall_mariadb_data_path }} on {{ cloudfall_server_id }} is not a
      mounted volume; converge the service through cloudfall
      (converge_services or operator approve), which creates the mariadb
      volume in its baseline's storage pool
  when: not ansible_check_mode

# The package's own postinst creates them too; made first, the volume's root
# is the server's before the package writes its first database on it.
- name: Create the mysql group
  ansible.builtin.group:
    name: mysql
    system: true

- name: Create the mysql user
  ansible.builtin.user:
    name: mysql
    group: mysql
    system: true
    home: /nonexistent
    create_home: false
    shell: /bin/false

- name: Give the data directory to the server
  ansible.builtin.file:
    path: "{{ cloudfall_mariadb_data_path }}"
    state: directory
    owner: mysql
    group: mysql
    mode: "0755"
