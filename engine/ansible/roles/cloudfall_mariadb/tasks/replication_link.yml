---
# Link a replica to its primary, by GTID, over TLS verified against the
# project CA (S-019, Replication), or to a source Cloudfall does not manage,
# with the login its credentialsRef names, over TLS verified against its
# caCertificateFile when declared. An empty replica is seeded first from one
# consistent dump of every database of the primary, taken at a recorded GTID
# position; one that holds data attaches from its own position, with no new
# copy. A source's users are not in its seed. The password is staged in a
# 0600 file for the run only, read by the client and the server themselves,
# and removed on every path; the session that hands it to the server writes
# no statement log. It is in no command line, task argument or Ansible
# output.
- name: Link this replica to its primary
  vars:
    cloudfall_mariadb_primary: >-
      {{ cloudfall_mariadb_links.primary | default(cloudfall_mariadb_source) }}
    cloudfall_mariadb_external: "{{ cloudfall_mariadb_source | length > 0 }}"
    cloudfall_mariadb_upstream_name: >-
      {{
        ('source ' ~ cloudfall_mariadb_source.host ~ ':' ~ cloudfall_mariadb_source.port)
        if cloudfall_mariadb_external
        else cloudfall_mariadb_primary.service
      }}
    cloudfall_mariadb_link_tls: >-
      {{ not cloudfall_mariadb_external or cloudfall_mariadb_source.tls }}
    cloudfall_mariadb_link_ca: >-
      {{
        cloudfall_mariadb_source_ca_path if cloudfall_mariadb_external
        else cloudfall_mariadb_ca_path
      }}
    cloudfall_mariadb_link_password_file: >-
      {{
        cloudfall_mariadb_replication_files.sourcePassword
        if cloudfall_mariadb_external
        else cloudfall_mariadb_replication_files.password
      }}
    cloudfall_mariadb_link_files:
      client: >-
        {{ cloudfall_mariadb_state_directory }}/{{ cloudfall_mariadb_service.id }}-replication.cnf
      statement: >-
        {{ cloudfall_mariadb_state_directory }}/{{ cloudfall_mariadb_service.id }}-link.sql
      seed: >-
        {{ cloudfall_mariadb_state_directory }}/{{ cloudfall_mariadb_service.id }}-seed.sql
  block:
    - name: Require the staged replication password
      ansible.builtin.assert:
        that:
          - >-
            cloudfall_mariadb_replication_files.password is defined
            or cloudfall_mariadb_external
          - >-
            cloudfall_mariadb_replication_files.sourcePassword is defined
            or not cloudfall_mariadb_external
        fail_msg: >-
          Replica {{ cloudfall_mariadb_service.id }} has no staged replication
          password; run services.yml through cloudfall (converge_services,
          operator approve, or cloudfall-engine playbook run services.yml),
          which reads its primary's generated password, or its source's
          credentialsRef, from --secrets-dir

    - name: Keep the user the link logs in as
      ansible.builtin.set_fact:
        cloudfall_mariadb_link_user: >-
          {{
            lookup('ansible.builtin.file', cloudfall_mariadb_replication_files.sourceUser)
            if cloudfall_mariadb_external
            else cloudfall_mariadb_replication_user
          }}

    - name: Create the MariaDB role state directory
      ansible.builtin.file:
        path: "{{ cloudfall_mariadb_state_directory }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    # The source's CA, which the link verifies the source's certificate
    # against at each reconnect, so it stays.
    - name: Install the CA of the source Cloudfall does not manage
      ansible.builtin.copy:
        src: "{{ cloudfall_mariadb_replication_files.sourceCa }}"
        dest: "{{ cloudfall_mariadb_source_ca_path }}"
        owner: root
        group: root
        mode: "0644"
      when: cloudfall_mariadb_external and cloudfall_mariadb_source.tls

    - name: Stage the client login to the primary, which holds the password
      ansible.builtin.copy:
        content: |
          [client]
          user = {{ cloudfall_mariadb_link_user }}
          password = {{ lookup('ansible.builtin.file', cloudfall_mariadb_link_password_file) }}
          host = {{ cloudfall_mariadb_primary.host }}
          port = {{ cloudfall_mariadb_primary.port }}
          {% if cloudfall_mariadb_link_tls %}
          ssl-ca = {{ cloudfall_mariadb_link_ca }}
          ssl-verify-server-cert
          {% else %}
          skip-ssl
          {% endif %}
        dest: "{{ cloudfall_mariadb_link_files.client }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Stage the link statement, which holds the password
      ansible.builtin.copy:
        content: |
          SET SESSION sql_log_off = 1;
          SET SESSION sql_log_bin = 0;
          CHANGE MASTER TO
            MASTER_HOST = '{{ cloudfall_mariadb_primary.host }}',
            MASTER_PORT = {{ cloudfall_mariadb_primary.port }},
            MASTER_USER = '{{ cloudfall_mariadb_link_user }}',
            MASTER_PASSWORD = '{{ lookup('ansible.builtin.file', cloudfall_mariadb_link_password_file) }}',
          {% if cloudfall_mariadb_link_tls %}
            MASTER_SSL = 1,
            MASTER_SSL_CA = '{{ cloudfall_mariadb_link_ca }}',
            MASTER_SSL_VERIFY_SERVER_CERT = 1,
          {% else %}
            MASTER_SSL = 0,
          {% endif %}
            MASTER_USE_GTID = slave_pos;
        dest: "{{ cloudfall_mariadb_link_files.statement }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Seed this empty replica from its primary
      when: cloudfall_mariadb_plan.action == 'seed'
      block:
        - name: Read the primary's databases
          ansible.builtin.command:
            argv:
              - >-
                {{ hostvars[cloudfall_mariadb_primary.server].cloudfall_mariadb_client
                   | default(cloudfall_mariadb_client) }}
              - --batch
              - --raw
              - --skip-column-names
              - --execute
              - "{{ cloudfall_mariadb_databases_query }}"
          # Evaluated before the condition: a source has no server.
          delegate_to: "{{ cloudfall_mariadb_primary.server | default(inventory_hostname) }}"
          register: cloudfall_mariadb_primary_databases
          changed_when: false
          when: not cloudfall_mariadb_external

        - name: Read the outside source's databases
          cloudfall_mariadb_source:
            host: "{{ cloudfall_mariadb_primary.host }}"
            port: "{{ cloudfall_mariadb_primary.port | int }}"
            user: "{{ cloudfall_mariadb_link_user }}"
            password: "{{ lookup('ansible.builtin.file', cloudfall_mariadb_link_password_file) }}"
            ca: >-
              {{
                lookup('ansible.builtin.file', cloudfall_mariadb_replication_files.sourceCa)
                if cloudfall_mariadb_link_tls else ''
              }}
            queries:
              databases: "{{ cloudfall_mariadb_databases_query }}"
          register: cloudfall_mariadb_source_databases
          no_log: true
          when: cloudfall_mariadb_external

        # One consistent snapshot at a recorded GTID position. A primary of
        # the project is read as cloudfall_repl over TLS and its users come
        # with it, created only where missing; a source's users never do,
        # since this replica's accounts are Cloudfall's. The file's first
        # statement keeps the load out of this server's binary log, so the
        # seed is no GTID of its own.
        - name: Dump the primary's databases at a recorded position
          ansible.builtin.shell:
            cmd: >-
              set -o pipefail;
              umask 077;
              { printf 'SET SESSION sql_log_bin = 0;\n';
              {{ cloudfall_mariadb_dump_client | quote }}
              --defaults-extra-file={{ cloudfall_mariadb_link_files.client | quote }}
              --single-transaction --gtid --master-data=2
              --routines --triggers --events
              {% if not cloudfall_mariadb_external %}
              --system=users
              {% endif %}
              --insert-ignore
              {% if cloudfall_mariadb_seed_databases %}
              --databases {{ cloudfall_mariadb_seed_databases | map('quote') | join(' ') }}
              {% endif %}
              ; } > {{ cloudfall_mariadb_link_files.seed | quote }}
            executable: /bin/bash
          vars:
            cloudfall_mariadb_seed_databases: >-
              {{
                cloudfall_mariadb_source_databases.rows.databases | map('first') | list
                if cloudfall_mariadb_external
                else cloudfall_mariadb_primary_databases.stdout_lines
              }}
          changed_when: true

        - name: Read the GTID position the dump was taken at
          ansible.builtin.command:
            argv:
              - grep
              - --max-count=1
              - --only-matching
              - --extended-regexp
              - "gtid_slave_pos='[0-9,-]*'"
              - "{{ cloudfall_mariadb_link_files.seed }}"
          register: cloudfall_mariadb_seed_position
          changed_when: false

        - name: Load the dump into this replica
          ansible.builtin.command:
            argv:
              - "{{ cloudfall_mariadb_client }}"
              - --batch
              - --execute
              - source {{ cloudfall_mariadb_link_files.seed }}
          changed_when: true

        # The replica's binary log starts at the seed's position, so once
        # promoted it can serve a server that is there.
        - name: Start this replica's history at the seed's position
          ansible.builtin.command:
            argv:
              - "{{ cloudfall_mariadb_client }}"
              - --batch
              - --execute
              - >-
                RESET MASTER; SET GLOBAL gtid_binlog_state = '{{ cloudfall_mariadb_seeded_at }}';
                SET GLOBAL gtid_slave_pos = '{{ cloudfall_mariadb_seeded_at }}'
          vars:
            cloudfall_mariadb_seeded_at: >-
              {{ cloudfall_mariadb_seed_position.stdout.split("'")[1] }}
          changed_when: true

    # A former primary follows from where its own history ends.
    - name: Start this replica's link from its own position
      ansible.builtin.command:
        argv:
          - "{{ cloudfall_mariadb_client }}"
          - --batch
          - --execute
          - SET GLOBAL gtid_slave_pos = '{{ cloudfall_mariadb_local.currentPos }}'
      changed_when: true
      when: cloudfall_mariadb_plan.action == 'attach'

    - name: Stop a link that is not running before it is set again
      ansible.builtin.command:
        argv:
          - "{{ cloudfall_mariadb_client }}"
          - --batch
          - --execute
          - STOP SLAVE
      changed_when: true
      when: cloudfall_mariadb_plan.action == 'follow'

    - name: Point the link at the primary
      ansible.builtin.command:
        argv:
          - "{{ cloudfall_mariadb_client }}"
          - --batch
          - --execute
          - source {{ cloudfall_mariadb_link_files.statement }}
      changed_when: true
      no_log: true

    - name: Start the link
      ansible.builtin.command:
        argv:
          - "{{ cloudfall_mariadb_client }}"
          - --batch
          - --execute
          - START SLAVE
      changed_when: true

    - name: Wait until both replication threads run
      ansible.builtin.command:
        argv:
          - "{{ cloudfall_mariadb_client }}"
          - --vertical
          - --execute
          - SHOW SLAVE STATUS
      register: cloudfall_mariadb_link_started
      changed_when: false
      retries: 30
      delay: "{{ cloudfall_mariadb_link_poll_seconds }}"
      until: >-
        (cloudfall_mariadb_link_started.stdout | cloudfall_mariadb_vertical).get('Slave_IO_Running') == 'Yes'
        and (cloudfall_mariadb_link_started.stdout | cloudfall_mariadb_vertical).get('Slave_SQL_Running') == 'Yes'
        or (cloudfall_mariadb_link_started.stdout | cloudfall_mariadb_vertical).get('Last_IO_Errno', '0') != '0'
        or (cloudfall_mariadb_link_started.stdout | cloudfall_mariadb_vertical).get('Last_SQL_Errno', '0') != '0'

    - name: Keep the link's state
      ansible.builtin.set_fact:
        cloudfall_mariadb_started: >-
          {{ cloudfall_mariadb_link_started.stdout | cloudfall_mariadb_vertical }}

    - name: Require both replication threads running
      ansible.builtin.assert:
        that:
          - cloudfall_mariadb_started.Slave_IO_Running | default('') == 'Yes'
          - cloudfall_mariadb_started.Slave_SQL_Running | default('') == 'Yes'
          - cloudfall_mariadb_started.Using_Gtid | default('') == 'Slave_Pos'
        fail_msg: the link did not start

    - name: Wait until the replica reached the primary's position
      when: cloudfall_mariadb_plan.action == 'seed'
      block:
        - name: Read the primary's position now the load has ended
          ansible.builtin.command:
            argv:
              - >-
                {{ hostvars[cloudfall_mariadb_primary.server].cloudfall_mariadb_client
                   | default(cloudfall_mariadb_client) }}
              - --batch
              - --raw
              - --skip-column-names
              - --execute
              - SELECT @@global.gtid_binlog_pos
          # Evaluated before the condition: a source has no server.
          delegate_to: "{{ cloudfall_mariadb_primary.server | default(inventory_hostname) }}"
          register: cloudfall_mariadb_primary_position
          changed_when: false
          when: not cloudfall_mariadb_external

        - name: Read the outside source's position now the load has ended
          cloudfall_mariadb_source:
            host: "{{ cloudfall_mariadb_primary.host }}"
            port: "{{ cloudfall_mariadb_primary.port | int }}"
            user: "{{ cloudfall_mariadb_link_user }}"
            password: "{{ lookup('ansible.builtin.file', cloudfall_mariadb_link_password_file) }}"
            ca: >-
              {{
                lookup('ansible.builtin.file', cloudfall_mariadb_replication_files.sourceCa)
                if cloudfall_mariadb_link_tls else ''
              }}
            queries:
              position: SELECT @@global.gtid_binlog_pos
          register: cloudfall_mariadb_source_position
          no_log: true
          when: cloudfall_mariadb_external

        - name: Wait for the replica to apply it
          ansible.builtin.command:
            argv:
              - "{{ cloudfall_mariadb_client }}"
              - --batch
              - --raw
              - --skip-column-names
              - --execute
              - >-
                SELECT MASTER_GTID_WAIT('{{ cloudfall_mariadb_upstream_position }}',
                {{ cloudfall_mariadb_catch_up_seconds }})
          vars:
            cloudfall_mariadb_upstream_position: >-
              {{
                cloudfall_mariadb_source_position.rows.position[0][0]
                if cloudfall_mariadb_external
                else cloudfall_mariadb_primary_position.stdout | trim
              }}
          register: cloudfall_mariadb_caught_up
          changed_when: false
          failed_when: cloudfall_mariadb_caught_up.stdout | trim != '0'

        - name: Count the tables of every database on both servers
          ansible.builtin.command:
            argv:
              - >-
                {{ hostvars[item].cloudfall_mariadb_client
                   | default(cloudfall_mariadb_client) }}
              - --batch
              - --raw
              - --skip-column-names
              - --execute
              - "{{ cloudfall_mariadb_table_counts_query }}"
          delegate_to: "{{ item }}"
          loop: >-
            {{
              ([] if cloudfall_mariadb_external else [cloudfall_mariadb_primary.server])
              + [inventory_hostname]
            }}
          register: cloudfall_mariadb_table_counts
          changed_when: false

        - name: Count the tables of every database on the outside source
          cloudfall_mariadb_source:
            host: "{{ cloudfall_mariadb_primary.host }}"
            port: "{{ cloudfall_mariadb_primary.port | int }}"
            user: "{{ cloudfall_mariadb_link_user }}"
            password: "{{ lookup('ansible.builtin.file', cloudfall_mariadb_link_password_file) }}"
            ca: >-
              {{
                lookup('ansible.builtin.file', cloudfall_mariadb_replication_files.sourceCa)
                if cloudfall_mariadb_link_tls else ''
              }}
            queries:
              tables: "{{ cloudfall_mariadb_table_counts_query }}"
          register: cloudfall_mariadb_source_tables
          no_log: true
          when: cloudfall_mariadb_external

        - name: Keep the tables of both servers
          ansible.builtin.set_fact:
            cloudfall_mariadb_upstream_tables: >-
              {{
                cloudfall_mariadb_source_tables.rows.tables | map('first') | list
                if cloudfall_mariadb_external
                else cloudfall_mariadb_table_counts.results[0].stdout_lines
              }}
            cloudfall_mariadb_replica_tables: >-
              {{ cloudfall_mariadb_table_counts.results[-1].stdout_lines }}

        - name: Refuse a seed whose tables differ from the primary's
          ansible.builtin.assert:
            that:
              - cloudfall_mariadb_upstream_tables == cloudfall_mariadb_replica_tables
            fail_msg: >-
              Replica {{ cloudfall_mariadb_service.id }} was seeded from
              {{ cloudfall_mariadb_upstream_name }}, but their tables differ:
              the primary holds {{ cloudfall_mariadb_upstream_tables }},
              the replica {{ cloudfall_mariadb_replica_tables }}
              (database|tables). Nothing was dropped

    - name: Keep the link's outcome
      ansible.builtin.set_fact:
        cloudfall_mariadb_outcome: >-
          {{
            {'reason': 'seeded at GTID '
                       ~ cloudfall_mariadb_seed_position.stdout.split("'")[1]}
            if cloudfall_mariadb_plan.action == 'seed'
            else {}
          }}

  rescue:
    # A link that does not run is not left half set: the replica keeps its
    # data and its position, and nothing is dropped.
    - name: Forget a link that did not start
      ansible.builtin.command:
        argv:
          - "{{ cloudfall_mariadb_client }}"
          - --batch
          - --execute
          - STOP SLAVE; RESET SLAVE ALL
      changed_when: true
      when: cloudfall_mariadb_plan.action != 'follow'

    - name: Stop on a link that did not start
      ansible.builtin.fail:
        msg: >-
          Replica {{ cloudfall_mariadb_service.id }} could not follow
          {{ cloudfall_mariadb_upstream_name }} at
          {{ cloudfall_mariadb_primary.host }}:{{ cloudfall_mariadb_primary.port }}:
          {{ cloudfall_mariadb_failure }}. Its databases were kept; nothing was
          dropped
      vars:
        cloudfall_mariadb_failure: >-
          {{
            (cloudfall_mariadb_started | default({})).get('Last_IO_Error')
            or (cloudfall_mariadb_started | default({})).get('Last_SQL_Error')
            or ansible_failed_result.msg | default('the link did not start')
          }}

  always:
    - name: Remove the staged login, link statement and dump
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ cloudfall_mariadb_link_files.client }}"
        - "{{ cloudfall_mariadb_link_files.statement }}"
        - "{{ cloudfall_mariadb_link_files.seed }}"
      no_log: true
