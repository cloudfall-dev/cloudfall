---
# Sets one owner's password when its stored hash is not the declared one, so
# a rotation is a commit in the secrets repository and a services converge,
# and a converge with the same password changes nothing (D-25's intent). The
# controller computed the hash of the owner's authentication plugin and keeps
# it in a 0600 file of its own; neither mysql_native_password nor ed25519 has
# a salt, so it is compared with the stored hash as it is. Only a hash that
# differs reaches the host (D-9): in a statement staged in a 0600 file,
# removed after the run, which the client reads itself. The password is in no
# host file, statement, command line, task argument or Ansible output; the
# hash is in no output.
#
# The account is the owner's at localhost, or, with remoteAccess, at the host
# of one allowed source (cloudfall_mariadb_owner_host), which requires TLS:
# that one is current only with REQUIRE SSL as well (ssl_type 1, ANY).
- name: Set the password of owner {{ cloudfall_mariadb_owner.owner }}
  vars:
    cloudfall_mariadb_account_host: "{{ cloudfall_mariadb_owner_host | default('localhost') }}"
    cloudfall_mariadb_remote: "{{ cloudfall_mariadb_account_host != 'localhost' }}"
    cloudfall_mariadb_plugin: >-
      {{ cloudfall_mariadb_owner.authentication | default('mysql_native_password') }}
    cloudfall_mariadb_hash: >-
      {{
        lookup('ansible.builtin.file',
               cloudfall_mariadb_hash_files[cloudfall_mariadb_owner.owner])
      }}
    cloudfall_mariadb_statement_path: >-
      {{ cloudfall_mariadb_state_directory }}/{{
        cloudfall_mariadb_service.id }}-owner.sql
    # True when the user exists with this plugin and hash alone
    cloudfall_mariadb_password_current: >-
      {{
        cloudfall_mariadb_stored_password.stdout
        == cloudfall_mariadb_plugin ~ '|' ~ cloudfall_mariadb_hash ~ '|single'
        ~ ('|1' if cloudfall_mariadb_remote else '')
      }}
  block:
    - name: Read the owner's stored plugin and hash
      ansible.builtin.command:
        argv:
          - "{{ cloudfall_mariadb_client }}"
          - --batch
          - --raw
          - --skip-column-names
          - --execute
          - >-
            SELECT CONCAT_WS('|',
            IFNULL(JSON_VALUE(Priv, '$.plugin'), ''),
            IFNULL(JSON_VALUE(Priv, '$.authentication_string'), ''),
            IF(JSON_EXTRACT(Priv, '$.auth_or') IS NULL, 'single', 'or'){{
              ", IFNULL(JSON_VALUE(Priv, '$.ssl_type'), '0')"
              if cloudfall_mariadb_remote else '' }})
            FROM mysql.global_priv
            WHERE Host = '{{ cloudfall_mariadb_account_host }}'
            AND User = '{{ cloudfall_mariadb_owner.owner }}'
      register: cloudfall_mariadb_stored_password
      changed_when: false
      no_log: true

    # A hash of another shape would not be a quoted literal; the message
    # never quotes it.
    - name: Refuse a staged hash of an unexpected shape
      ansible.builtin.assert:
        that:
          - >-
            cloudfall_mariadb_hash is match(
              '^[*][0-9A-F]{40}$'
              if cloudfall_mariadb_plugin == 'mysql_native_password'
              else '^[A-Za-z0-9+/]{43}$')
        fail_msg: >-
          The staged hash of owner {{ cloudfall_mariadb_owner.owner }} of
          service {{ cloudfall_mariadb_service.id }} is not a
          {{ cloudfall_mariadb_plugin }} hash
        quiet: true

    - name: Create the MariaDB role state directory
      ansible.builtin.file:
        path: "{{ cloudfall_mariadb_state_directory }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      when: not cloudfall_mariadb_password_current

    - name: Stage the owner's statement, which holds its hash
      ansible.builtin.copy:
        content: |
          CREATE USER IF NOT EXISTS {{ cloudfall_mariadb_account }} {{ cloudfall_mariadb_identified }};
          ALTER USER {{ cloudfall_mariadb_account }} {{ cloudfall_mariadb_identified }};
        dest: "{{ cloudfall_mariadb_statement_path }}"
        owner: root
        group: root
        mode: "0600"
      vars:
        cloudfall_mariadb_account: >-
          '{{ cloudfall_mariadb_owner.owner }}'@'{{ cloudfall_mariadb_account_host }}'
        cloudfall_mariadb_identified: >-
          IDENTIFIED VIA {{ cloudfall_mariadb_plugin }}
          USING '{{ cloudfall_mariadb_hash }}'{{
            ' REQUIRE SSL' if cloudfall_mariadb_remote else '' }}
      when: not cloudfall_mariadb_password_current
      no_log: true

    - name: Store the owner's hash
      ansible.builtin.command:
        argv:
          - "{{ cloudfall_mariadb_client }}"
          - --batch
          - --execute
          - source {{ cloudfall_mariadb_statement_path }}
      when: not cloudfall_mariadb_password_current
      changed_when: true
      no_log: true
  always:
    - name: Remove the owner's staged statement
      ansible.builtin.file:
        path: "{{ cloudfall_mariadb_statement_path }}"
        state: absent
      no_log: true
