---
# Sets one owner role's password on every converge, so a rotation is a commit
# in the secrets repository and a services converge. The value reaches the
# host in a 0600 file removed after the run; psql reads the file itself, so
# the value is in no command line, no task argument, and no Ansible output.
- name: Set the password of owner role {{ cloudfall_postgresql_owner }}
  block:
    - name: Stage the owner role password on the host
      ansible.builtin.copy:
        src: "{{ cloudfall_postgresql_password_files[cloudfall_postgresql_owner] }}"
        dest: "{{ cloudfall_postgresql_password_path }}"
        owner: postgres
        group: postgres
        mode: "0600"
      no_log: true

    - name: Store the owner role password as SCRAM-SHA-256
      ansible.builtin.command:
        argv:
          - /usr/bin/psql
          - --port
          - "{{ cloudfall_postgresql_service.bind.port }}"
          - --no-psqlrc
          - --quiet
          - --set
          - ON_ERROR_STOP=1
        stdin: |
          SET password_encryption = 'scram-sha-256';
          \set cloudfall_password `cat {{ cloudfall_postgresql_password_path | quote }}`
          ALTER ROLE "{{ cloudfall_postgresql_owner }}" WITH LOGIN PASSWORD :'cloudfall_password';
      become: true
      become_user: postgres
      changed_when: true
      no_log: true
  always:
    - name: Remove the staged owner role password
      ansible.builtin.file:
        path: "{{ cloudfall_postgresql_password_path }}"
        state: absent
      no_log: true
