---
# Sets one owner role's password when it is not the one the role has, so a
# rotation is a commit in the secrets repository and a services converge, and
# a converge with the same password changes nothing (D-25). The controller
# keeps the password in a 0600 file of its own; the play reads the role's
# stored verifier, and the cloudfall_scram_verifier filter computes on the
# controller the password's SCRAM-SHA-256 verifier with the stored salt and
# iteration count, or a fresh salt when the role has no SCRAM verifier. Only
# a verifier that differs reaches the host (D-9): in a 0600 file removed
# after the run, which psql reads itself, and PostgreSQL stores as it is. The
# plaintext is in no host file, no statement the server logs or shows in
# pg_stat_activity, no command line, no task argument, and no Ansible output;
# neither verifier is in any output.
- name: Set the password of owner role {{ cloudfall_postgresql_owner }}
  vars:
    cloudfall_postgresql_password_source: >-
      {{ cloudfall_postgresql_password_files[cloudfall_postgresql_owner] }}
    # True when the role can log in and its stored verifier is the
    # password's, computed with that verifier's salt and iterations
    cloudfall_postgresql_password_current: >-
      {{
        cloudfall_postgresql_stored_password.stdout
        == 't|' ~ (
          cloudfall_postgresql_password_source
          | cloudfall_scram_verifier(cloudfall_postgresql_stored_password.stdout)
        )
      }}
  block:
    - name: Read the owner role's login and stored password verifier
      ansible.builtin.command:
        argv:
          - /usr/bin/psql
          - --port
          - "{{ cloudfall_postgresql_service.bind.port }}"
          - --no-psqlrc
          - --quiet
          - --tuples-only
          - --no-align
          - --set
          - ON_ERROR_STOP=1
          - --set
          - cloudfall_owner={{ cloudfall_postgresql_owner }}
        stdin: |
          SELECT rolcanlogin, coalesce(rolpassword, '') FROM pg_authid WHERE rolname = :'cloudfall_owner';
      become: true
      become_user: postgres
      register: cloudfall_postgresql_stored_password
      changed_when: false
      no_log: true

    # The message says what is wrong, never the stored value
    - name: Refuse a stored password that can't be compared
      ansible.builtin.assert:
        that:
          - cloudfall_postgresql_stored_password_problem == ''
        fail_msg: >-
          Owner role {{ cloudfall_postgresql_owner }} of service
          {{ cloudfall_postgresql_service.id }}:
          {{ cloudfall_postgresql_stored_password_problem }}
        quiet: true
      vars:
        cloudfall_postgresql_stored_password_problem: >-
          {{
            cloudfall_postgresql_stored_password.stdout
            | cloudfall_pg_stored_password_problem
          }}

    - name: Stage the owner role password verifier on the host
      ansible.builtin.copy:
        content: >-
          {{
            cloudfall_postgresql_password_source
            | cloudfall_scram_verifier(cloudfall_postgresql_stored_password.stdout)
          }}
        dest: "{{ cloudfall_postgresql_password_path }}"
        owner: postgres
        group: postgres
        mode: "0600"
      when: not cloudfall_postgresql_password_current
      no_log: true

    - name: Store the owner role password as SCRAM-SHA-256
      ansible.builtin.command:
        argv:
          - /usr/bin/psql
          - --port
          - "{{ cloudfall_postgresql_service.bind.port }}"
          - --no-psqlrc
          - --quiet
          - --set
          - ON_ERROR_STOP=1
        stdin: |
          SET password_encryption = 'scram-sha-256';
          \set cloudfall_password `cat {{ cloudfall_postgresql_password_path | quote }}`
          ALTER ROLE "{{ cloudfall_postgresql_owner }}" WITH LOGIN PASSWORD :'cloudfall_password';
      become: true
      become_user: postgres
      when: not cloudfall_postgresql_password_current
      changed_when: true
      no_log: true
  always:
    - name: Remove the staged owner role password verifier
      ansible.builtin.file:
        path: "{{ cloudfall_postgresql_password_path }}"
        state: absent
      no_log: true
