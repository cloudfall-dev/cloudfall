---
- name: Validate PostgreSQL service target and declaration
  ansible.builtin.assert:
    that:
      - ansible_facts["distribution"] == "Debian"
      - ansible_facts["service_mgr"] == "systemd"
      - cloudfall_postgresql_service.serviceKind == "postgresql"
      - cloudfall_postgresql_service.server == cloudfall_server_id
      - cloudfall_postgresql_service.bind.address == "127.0.0.1"
      - cloudfall_postgresql_service.postgresql.databases | length > 0
    fail_msg: >-
      PostgreSQL deployment requires its declared Debian server and a
      loopback-only bind address

- name: Refuse remote access that is not narrowed to declared sources
  ansible.builtin.assert:
    that:
      - cloudfall_postgresql_remote_access.listenAddress | length > 0
      - >-
        cloudfall_postgresql_remote_access.listenAddress
        not in ['*', '0.0.0.0', '::', 'localhost']
      - "',' not in cloudfall_postgresql_remote_access.listenAddress"
      - "\"'\" not in cloudfall_postgresql_remote_access.listenAddress"
      - cloudfall_postgresql_remote_access.allowedSources | length > 0
      - >-
        cloudfall_postgresql_remote_access.allowedSources
        | select('in', ['0.0.0.0/0', '::/0'])
        | list
        | length == 0
      - >-
        cloudfall_postgresql_service.postgresql.databases
        | selectattr('passwordRef', 'defined')
        | list
        | length > 0
      # pg_hba.conf reads these bare words as keywords, not names: a database
      # named all would open every database, an owner named all every role.
      - >-
        cloudfall_postgresql_service.postgresql.databases
        | selectattr('passwordRef', 'defined')
        | map(attribute='name')
        | select('in', cloudfall_postgresql_hba_keywords)
        | list
        | length == 0
      - >-
        cloudfall_postgresql_service.postgresql.databases
        | selectattr('passwordRef', 'defined')
        | map(attribute='owner')
        | select('in', cloudfall_postgresql_hba_keywords)
        | list
        | length == 0
    fail_msg: >-
      remoteAccess of service {{ cloudfall_postgresql_service.id }} needs one
      listen address that is not a wildcard, at least one source that is not
      0.0.0.0/0 or ::/0, and a database with an owner, and no owned database
      or owner named {{ cloudfall_postgresql_hba_keywords | join(', ') }}
  vars:
    cloudfall_postgresql_remote_access: >-
      {{ cloudfall_postgresql_service.postgresql.remoteAccess }}
    cloudfall_postgresql_hba_keywords:
      - all
      - sameuser
      - samerole
      - samegroup
      - replication
  when: cloudfall_postgresql_service.postgresql.remoteAccess is defined

- name: Require a staged password for every owner role
  ansible.builtin.assert:
    that:
      - >-
        cloudfall_postgresql_service.postgresql.databases
        | selectattr('passwordRef', 'defined')
        | map(attribute='owner')
        | reject('in', cloudfall_postgresql_password_files)
        | list
        | length == 0
    fail_msg: >-
      An owner role of service {{ cloudfall_postgresql_service.id }} has no
      staged password; run services.yml through cloudfall (converge_services,
      cloudfall migrate, operator approve, or cloudfall-engine playbook run
      services.yml), which reads each passwordRef from --secrets-dir

- name: Validate the declared backup calendar expression
  ansible.builtin.command:
    argv:
      - /usr/bin/systemd-analyze
      - calendar
      - "{{ cloudfall_postgresql_service.backup.onCalendar }}"
  changed_when: false

- name: Install PostgreSQL repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - gnupg
      - python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install PostgreSQL repository signing key
  ansible.builtin.get_url:
    url: "{{ cloudfall_postgresql_repository_key_url }}"
    dest: "{{ cloudfall_postgresql_repository_key_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Configure the PGDG package repository
  ansible.builtin.deb822_repository:
    name: postgresql
    types:
      - deb
    uris:
      - "{{ cloudfall_postgresql_repository_url }}"
    suites:
      - "{{ ansible_facts['distribution_release'] }}-pgdg"
    components:
      - main
    signed_by: "{{ cloudfall_postgresql_repository_key_path }}"
    state: present

- name: Install the pinned PostgreSQL server
  ansible.builtin.apt:
    name: >-
      {{
        'postgresql-' ~ cloudfall_postgresql_service.postgresql.majorVersion
        ~ '=' ~ cloudfall_postgresql_service.postgresql.packageVersion
        if 'packageVersion' in cloudfall_postgresql_service.postgresql
        else 'postgresql-'
        ~ cloudfall_postgresql_service.postgresql.majorVersion
      }}
    state: present
    update_cache: true
    cache_valid_time: 3600
    policy_rc_d: 101

- name: Install the snakeoil certificate pair for remote access
  ansible.builtin.apt:
    name: ssl-cert
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: cloudfall_postgresql_service.postgresql.remoteAccess is defined

- name: Let PostgreSQL read the snakeoil key
  ansible.builtin.user:
    name: postgres
    groups:
      - ssl-cert
    append: true
  # The server reads its key at start, so a new group needs a restart.
  notify: Restart PostgreSQL
  when: cloudfall_postgresql_service.postgresql.remoteAccess is defined

# listen_addresses and ssl only change at server start: a changed file
# restarts the cluster through the handler, flushed before readiness.
- name: Install the managed cluster configuration
  ansible.builtin.template:
    src: cloudfall.conf.j2
    dest: >-
      /etc/postgresql/{{
        cloudfall_postgresql_service.postgresql.majorVersion
      }}/main/conf.d/cloudfall.conf
    owner: root
    group: postgres
    mode: "0640"
  notify: Restart PostgreSQL

- name: Enable and start the PostgreSQL cluster
  ansible.builtin.systemd_service:
    name: >-
      postgresql@{{
        cloudfall_postgresql_service.postgresql.majorVersion
      }}-main.service
    enabled: true
    state: started
    daemon_reload: true

- name: Apply the validated cluster configuration
  ansible.builtin.meta: flush_handlers

- name: Wait for PostgreSQL readiness
  ansible.builtin.command:
    argv:
      - /usr/bin/pg_isready
      - --quiet
      - --host
      - "{{ cloudfall_postgresql_service.bind.address }}"
      - --port
      - "{{ cloudfall_postgresql_service.bind.port }}"
  register: cloudfall_postgresql_readiness
  changed_when: false
  retries: 12
  delay: 5
  until: cloudfall_postgresql_readiness.rc == 0
  when: not ansible_check_mode

# The block is written with remoteAccess and removed without it, so an
# earlier opening never lingers; lines outside the markers stay untouched.
# A reload that failed leaves a marker file, so the next run reloads even
# though the file on disk no longer changes.
- name: Converge the remote access block of pg_hba.conf
  vars:
    cloudfall_postgresql_hba_path: >-
      /etc/postgresql/{{
        cloudfall_postgresql_service.postgresql.majorVersion
      }}/main/pg_hba.conf
    cloudfall_postgresql_hba_reload_marker: >-
      {{ cloudfall_postgresql_state_directory }}/{{
        cloudfall_postgresql_service.id
      }}.pg_hba-reload-pending
  block:
    - name: Read whether an earlier pg_hba.conf reload is pending
      ansible.builtin.stat:
        path: "{{ cloudfall_postgresql_hba_reload_marker }}"
      register: cloudfall_postgresql_hba_pending

    - name: Write or remove the Cloudfall block in pg_hba.conf
      ansible.builtin.blockinfile:
        path: "{{ cloudfall_postgresql_hba_path }}"
        marker: "{{ cloudfall_postgresql_hba_marker }}"
        block: >-
          {{
            lookup('ansible.builtin.template', 'pg_hba-remote-access.j2')
            if cloudfall_postgresql_service.postgresql.remoteAccess is defined
            else ''
          }}
        state: >-
          {{
            'present'
            if cloudfall_postgresql_service.postgresql.remoteAccess is defined
            else 'absent'
          }}
      register: cloudfall_postgresql_hba

    # pg_hba_file_rules parses the file on disk; reload only a file it reads.
    - name: Refuse a pg_hba.conf PostgreSQL cannot read
      ansible.builtin.command:
        argv:
          - /usr/bin/psql
          - --port
          - "{{ cloudfall_postgresql_service.bind.port }}"
          - --tuples-only
          - --no-align
          - --command
          - >-
            SELECT line_number || ': ' || error
            FROM pg_hba_file_rules WHERE error IS NOT NULL
      become: true
      become_user: postgres
      register: cloudfall_postgresql_hba_errors
      changed_when: false
      failed_when: >-
        cloudfall_postgresql_hba_errors.rc != 0
        or cloudfall_postgresql_hba_errors.stdout_lines | length > 0
      when:
        - not ansible_check_mode
        - >-
          cloudfall_postgresql_hba is changed
          or cloudfall_postgresql_hba_pending.stat.exists

    - name: Reload PostgreSQL to apply pg_hba.conf
      ansible.builtin.command:
        argv:
          - /usr/bin/psql
          - --port
          - "{{ cloudfall_postgresql_service.bind.port }}"
          - --tuples-only
          - --no-align
          - --command
          - SELECT pg_reload_conf()
      become: true
      become_user: postgres
      register: cloudfall_postgresql_hba_reload
      changed_when: true
      failed_when: >-
        cloudfall_postgresql_hba_reload.rc != 0
        or cloudfall_postgresql_hba_reload.stdout | trim != 't'
      when:
        - not ansible_check_mode
        - >-
          cloudfall_postgresql_hba is changed
          or cloudfall_postgresql_hba_pending.stat.exists

    - name: Clear the pending pg_hba.conf reload once it applied
      ansible.builtin.file:
        path: "{{ cloudfall_postgresql_hba_reload_marker }}"
        state: absent
      when:
        - not ansible_check_mode
        - cloudfall_postgresql_hba_pending.stat.exists
  rescue:
    # PostgreSQL may still serve the lines of the last reload: record that a
    # reload is owed before the file changes again.
    - name: Create the PostgreSQL role state directory
      ansible.builtin.file:
        path: "{{ cloudfall_postgresql_state_directory }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Record that pg_hba.conf still needs a reload
      ansible.builtin.copy:
        dest: "{{ cloudfall_postgresql_hba_reload_marker }}"
        content: |
          {{ cloudfall_postgresql_service.id }}: pg_hba.conf reload pending
        owner: root
        group: root
        mode: "0600"

    - name: Close remote access when pg_hba.conf could not be applied
      ansible.builtin.blockinfile:
        path: "{{ cloudfall_postgresql_hba_path }}"
        marker: "{{ cloudfall_postgresql_hba_marker }}"
        state: absent

    - name: Stop on a pg_hba.conf that was not applied
      ansible.builtin.fail:
        msg: >-
          pg_hba.conf of service {{ cloudfall_postgresql_service.id }} was not
          reloaded and its Cloudfall block was removed; the next converge
          reloads it:
          {{
            cloudfall_postgresql_hba_errors.stdout_lines | default([])
            | join('; ')
          }}

- name: Read existing PostgreSQL roles
  ansible.builtin.command:
    argv:
      - /usr/bin/psql
      - --port
      - "{{ cloudfall_postgresql_service.bind.port }}"
      - --tuples-only
      - --no-align
      - --command
      - SELECT rolname FROM pg_roles
  become: true
  become_user: postgres
  register: cloudfall_postgresql_existing_roles
  changed_when: false
  when: not ansible_check_mode

- name: Create missing database owner login roles
  ansible.builtin.command:
    argv:
      - /usr/bin/psql
      - --port
      - "{{ cloudfall_postgresql_service.bind.port }}"
      - --command
      - CREATE ROLE "{{ item }}" LOGIN
  become: true
  become_user: postgres
  loop: >-
    {{
      cloudfall_postgresql_service.postgresql.databases
      | map(attribute='owner')
      | unique
      | list
    }}
  when:
    - not ansible_check_mode
    - item not in cloudfall_postgresql_existing_roles.stdout_lines
  changed_when: true

- name: Set each owner role password from its staged file
  ansible.builtin.include_tasks: owner_password.yml
  loop: >-
    {{
      cloudfall_postgresql_service.postgresql.databases
      | selectattr('passwordRef', 'defined')
      | map(attribute='owner')
      | unique
      | list
    }}
  loop_control:
    loop_var: cloudfall_postgresql_owner
  when: not ansible_check_mode

- name: Create the metrics monitoring role
  ansible.builtin.command:
    argv:
      - /usr/bin/psql
      - --port
      - "{{ cloudfall_postgresql_service.bind.port }}"
      - --command
      - CREATE ROLE "{{ cloudfall_postgresql_metrics_role }}" LOGIN
  become: true
  become_user: postgres
  when:
    - not ansible_check_mode
    - "'metrics' in cloudfall_postgresql_service"
    - >-
      cloudfall_postgresql_metrics_role
      not in cloudfall_postgresql_existing_roles.stdout_lines
  changed_when: true

- name: Grant pg_monitor to the metrics monitoring role
  ansible.builtin.command:
    argv:
      - /usr/bin/psql
      - --port
      - "{{ cloudfall_postgresql_service.bind.port }}"
      - --command
      - GRANT pg_monitor TO "{{ cloudfall_postgresql_metrics_role }}"
  become: true
  become_user: postgres
  when:
    - not ansible_check_mode
    - "'metrics' in cloudfall_postgresql_service"
  changed_when: false

- name: Read existing PostgreSQL databases
  ansible.builtin.command:
    argv:
      - /usr/bin/psql
      - --port
      - "{{ cloudfall_postgresql_service.bind.port }}"
      - --tuples-only
      - --no-align
      - --command
      - SELECT datname FROM pg_database
  become: true
  become_user: postgres
  register: cloudfall_postgresql_existing_databases
  changed_when: false
  when: not ansible_check_mode

- name: Create missing application databases
  ansible.builtin.command:
    argv:
      - /usr/bin/psql
      - --port
      - "{{ cloudfall_postgresql_service.bind.port }}"
      - --command
      - CREATE DATABASE "{{ item.name }}" OWNER "{{ item.owner }}"
  become: true
  become_user: postgres
  loop: "{{ cloudfall_postgresql_service.postgresql.databases }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - not ansible_check_mode
    - item.name not in cloudfall_postgresql_existing_databases.stdout_lines
  changed_when: true

- name: Read the owners of existing PostgreSQL databases
  ansible.builtin.command:
    argv:
      - /usr/bin/psql
      - --port
      - "{{ cloudfall_postgresql_service.bind.port }}"
      - --tuples-only
      - --no-align
      - --command
      - SELECT datname || '=' || pg_get_userbyid(datdba) FROM pg_database
  become: true
  become_user: postgres
  register: cloudfall_postgresql_database_owners
  changed_when: false
  when:
    - not ansible_check_mode
    - >-
      cloudfall_postgresql_service.postgresql.databases
      | selectattr('passwordRef', 'defined') | list | length > 0

- name: Give each owned database to its declared owner role
  ansible.builtin.command:
    argv:
      - /usr/bin/psql
      - --port
      - "{{ cloudfall_postgresql_service.bind.port }}"
      - --command
      - ALTER DATABASE "{{ item.name }}" OWNER TO "{{ item.owner }}"
  become: true
  become_user: postgres
  loop: >-
    {{
      cloudfall_postgresql_service.postgresql.databases
      | selectattr('passwordRef', 'defined')
      | list
    }}
  loop_control:
    label: "{{ item.name }}"
  when:
    - not ansible_check_mode
    - >-
      item.name ~ '=' ~ item.owner
      not in cloudfall_postgresql_database_owners.stdout_lines
  changed_when: true

- name: Create the backup directory
  ansible.builtin.file:
    path: "{{ cloudfall_postgresql_service.backup.directory }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: Install the backup script
  ansible.builtin.template:
    src: backup.sh.j2
    dest: /usr/local/sbin/cloudfall-postgresql-backup
    owner: root
    group: root
    mode: "0755"

- name: Install the restore-check script
  ansible.builtin.template:
    src: restore-check.sh.j2
    dest: /usr/local/sbin/cloudfall-postgresql-restore-check
    owner: root
    group: root
    mode: "0755"

- name: Install the backup service unit
  ansible.builtin.template:
    src: backup.service.j2
    dest: /etc/systemd/system/cloudfall-postgresql-backup.service
    owner: root
    group: root
    mode: "0644"

- name: Install the backup timer unit
  ansible.builtin.template:
    src: backup.timer.j2
    dest: /etc/systemd/system/cloudfall-postgresql-backup.timer
    owner: root
    group: root
    mode: "0644"

- name: Enable the backup timer
  ansible.builtin.systemd_service:
    name: cloudfall-postgresql-backup.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Install the restore-drill service unit
  ansible.builtin.template:
    src: restore-check.service.j2
    dest: /etc/systemd/system/cloudfall-postgresql-restore-check.service
    owner: root
    group: root
    mode: "0644"
  when: cloudfall_postgresql_service.backup.restoreCheckOnCalendar is defined

- name: Install the restore-drill timer unit
  ansible.builtin.template:
    src: restore-check.timer.j2
    dest: /etc/systemd/system/cloudfall-postgresql-restore-check.timer
    owner: root
    group: root
    mode: "0644"
  when: cloudfall_postgresql_service.backup.restoreCheckOnCalendar is defined

- name: Enable the restore-drill timer
  ansible.builtin.systemd_service:
    name: cloudfall-postgresql-restore-check.timer
    enabled: true
    state: started
    daemon_reload: true
  when: cloudfall_postgresql_service.backup.restoreCheckOnCalendar is defined
