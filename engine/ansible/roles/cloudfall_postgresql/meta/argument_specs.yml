---
argument_specs:
  main:
    short_description: Converge one declared PostgreSQL service
    options:
      cloudfall_postgresql_service:
        type: dict
        required: true
        options:
          id:
            type: str
            required: true
          serviceKind:
            type: str
            choices:
              - postgresql
            required: true
          environment:
            type: str
            required: true
          server:
            type: str
            required: true
          bind:
            type: dict
            required: true
            options:
              address:
                type: str
                choices:
                  - 127.0.0.1
                required: true
              port:
                type: int
                required: true
          postgresql:
            type: dict
            required: true
            options:
              majorVersion:
                type: str
                required: true
              packageVersion:
                type: str
              databases:
                type: list
                elements: dict
                required: true
                options:
                  name:
                    type: str
                    required: true
                  application:
                    type: str
                  owner:
                    type: str
                    required: true
                  passwordRef:
                    type: dict
                    options:
                      environment:
                        type: str
                        required: true
                      path:
                        type: str
                        required: true
                      key:
                        type: str
                        required: true
              remoteAccess:
                type: dict
                options:
                  listenAddress:
                    type: str
                    required: true
                  allowedSources:
                    type: list
                    elements: str
                    required: true
          backup:
            type: dict
            required: true
            options:
              directory:
                type: path
                required: true
              onCalendar:
                type: str
                required: true
              restoreCheckOnCalendar:
                type: str
              retentionDays:
                type: int
                required: true
          metrics:
            type: dict
            options:
              enabled:
                type: bool
                required: true
      cloudfall_postgresql_password_files:
        type: dict
        default: {}
        description: >-
          Controller path of each owner role's staged password file, by
          role; the values never enter a variable
      cloudfall_postgresql_password_path:
        type: path
        default: /var/lib/postgresql/.cloudfall-owner-password
        description: Host path an owner role's password is staged at, 0600
      cloudfall_postgresql_ssl_cert_file:
        type: path
        default: /etc/ssl/certs/ssl-cert-snakeoil.pem
        description: Server certificate of remoteAccess, the ssl-cert snakeoil
      cloudfall_postgresql_ssl_key_file:
        type: path
        default: /etc/ssl/private/ssl-cert-snakeoil.key
        description: Server key of remoteAccess, the ssl-cert snakeoil
      cloudfall_postgresql_hba_marker:
        type: str
        default: "# {mark} CLOUDFALL MANAGED REMOTE ACCESS"
        description: Markers of the remoteAccess block in pg_hba.conf
      cloudfall_postgresql_state_directory:
        type: path
        default: /var/lib/cloudfall/postgresql
        description: >-
          Host directory of the role's state, such as a service's pending
          pg_hba.conf reload, one file per service id
      cloudfall_postgresql_metrics_role:
        type: str
        default: alloy
      cloudfall_postgresql_repository_key_url:
        type: str
        default: https://www.postgresql.org/media/keys/ACCC4CF8.asc
      cloudfall_postgresql_repository_key_path:
        type: path
        default: /etc/apt/keyrings/postgresql.asc
      cloudfall_postgresql_repository_url:
        type: str
        default: https://apt.postgresql.org/pub/repos/apt
