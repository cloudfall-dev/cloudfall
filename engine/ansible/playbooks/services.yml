---
- name: Deploy declared Cloudfall infrastructure services
  hosts: cloudfall_servers
  become: true
  # Facts are gathered by rollout-start.yml, after its reach check.
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  pre_tasks:
    - name: Stop at a server whose earlier servers did not finish
      ansible.builtin.import_tasks: tasks/rollout-start.yml

    # The Elasticsearch role refuses such a heap as its first task too; this
    # check runs before any service role, so the server is left unchanged
    # (S-012-4). Facts are gathered by rollout-start.yml above.
    - name: Refuse an Elasticsearch heap above half of the server's memory
      ansible.builtin.assert:
        that:
          - >-
            (cloudfall_service_item.elasticsearch.heapMb | int) * 2
            <= (ansible_facts['memtotal_mb'] | int)
        fail_msg: >-
          heapMb {{ cloudfall_service_item.elasticsearch.heapMb }} of
          service {{ cloudfall_service_item.id }} is above half of the
          {{ ansible_facts['memtotal_mb'] }} MB of {{ cloudfall_server_id }}:
          lower heapMb, or move the service to a server with more memory
      loop: >-
        {{
          cloudfall_services | default([])
          | selectattr('serviceKind', 'equalto', 'elasticsearch')
          | selectattr('elasticsearch.nodes', 'contains', cloudfall_server_id)
          | list
        }}
      loop_control:
        loop_var: cloudfall_service_item
        label: "{{ cloudfall_service_item.id }}"

    # The MariaDB role refuses such a buffer pool as well; checked here, before
    # any service role, the server is left unchanged (S-019-4).
    - name: Refuse a MariaDB buffer pool above three quarters of the server's memory
      ansible.builtin.assert:
        that:
          - >-
            (cloudfall_service_item.mariadb.innodbBufferPoolMb | int) * 4
            <= (ansible_facts['memtotal_mb'] | int) * 3
        fail_msg: >-
          innodbBufferPoolMb {{ cloudfall_service_item.mariadb.innodbBufferPoolMb }}
          of service {{ cloudfall_service_item.id }} is above three quarters of
          the {{ ansible_facts['memtotal_mb'] }} MB of {{ cloudfall_server_id }}:
          lower innodbBufferPoolMb, or move the service to a server with more
          memory
      loop: >-
        {{
          cloudfall_services | default([])
          | selectattr('serviceKind', 'equalto', 'mariadb')
          | selectattr('server', 'equalto', cloudfall_server_id)
          | list
        }}
      loop_control:
        loop_var: cloudfall_service_item
        label: "{{ cloudfall_service_item.id }}"

    # The RabbitMQ role refuses such a watermark as well; checked here, before
    # any service role, the server is left unchanged (S-023-4).
    - name: Refuse a RabbitMQ memory watermark above six tenths of the server's memory
      ansible.builtin.assert:
        that:
          - >-
            (cloudfall_service_item.rabbitmq.memoryHighWatermarkMb | int) * 10
            <= (ansible_facts['memtotal_mb'] | int) * 6
        fail_msg: >-
          memoryHighWatermarkMb
          {{ cloudfall_service_item.rabbitmq.memoryHighWatermarkMb }} of
          service {{ cloudfall_service_item.id }} is above six tenths of the
          {{ ansible_facts['memtotal_mb'] }} MB of {{ cloudfall_server_id }}:
          lower memoryHighWatermarkMb, or move the node to a server with more
          memory
      loop: >-
        {{
          cloudfall_services | default([])
          | selectattr('serviceKind', 'equalto', 'rabbitmq')
          | selectattr('rabbitmq.nodes', 'contains', cloudfall_server_id)
          | list
        }}
      loop_control:
        loop_var: cloudfall_service_item
        label: "{{ cloudfall_service_item.id }}"

    # The Kibana role refuses such a heap as well; checked here, before any
    # service role, the server is left unchanged (S-024-4). Kibana runs on a
    # node of its cluster, whose service is on this server too.
    - name: Refuse a Kibana heap that with the node's is above three quarters of the server's memory
      ansible.builtin.assert:
        that:
          - >-
            (
              (cloudfall_service_item.kibana.heapMb | int)
              + (cloudfall_kibana_node_heap | int)
            ) * 4
            <= (ansible_facts['memtotal_mb'] | int) * 3
        fail_msg: >-
          heapMb {{ cloudfall_service_item.kibana.heapMb }} of Kibana service
          {{ cloudfall_service_item.id }} and heapMb
          {{ cloudfall_kibana_node_heap }} of Elasticsearch service
          {{ cloudfall_service_item.kibana.elasticsearch }} are above three
          quarters of the {{ ansible_facts['memtotal_mb'] }} MB of
          {{ cloudfall_server_id }}: lower a heapMb, or move the services to a
          server with more memory
      vars:
        cloudfall_kibana_node_heap: >-
          {{
            cloudfall_services | default([])
            | selectattr('serviceKind', 'equalto', 'elasticsearch')
            | selectattr('id', 'equalto', cloudfall_service_item.kibana.elasticsearch)
            | map(attribute='elasticsearch.heapMb')
            | first | default(0)
          }}
      loop: >-
        {{
          cloudfall_services | default([])
          | selectattr('serviceKind', 'equalto', 'kibana')
          | selectattr('server', 'equalto', cloudfall_server_id)
          | list
        }}
      loop_control:
        loop_var: cloudfall_service_item
        label: "{{ cloudfall_service_item.id }}"

    # Every declared kind has a role below, or in the Kibana play after it; a
    # service of a kind with none would converge as a silent no-op and
    # report success for a service it never touched.
    - name: Refuse a service of a kind this playbook does not converge
      ansible.builtin.assert:
        that:
          - >-
            cloudfall_services | default([]) | map(attribute='serviceKind')
            | difference(['postgresql', 'redis', 'mariadb', 'elasticsearch', 'rabbitmq', 'kibana'])
            | length == 0
        fail_msg: >-
          {{ cloudfall_server_id }} declares a service of a kind services.yml
          has no role for:
          {{
            cloudfall_services | default([]) | map(attribute='serviceKind')
            | difference(['postgresql', 'redis', 'mariadb', 'elasticsearch', 'rabbitmq', 'kibana'])
            | join(', ')
          }}
  tasks:
    # The declared firewall carries the services' port rules (S-011): a
    # replication, remoteAccess or transport port opened to its sources only.
    # Enforced here, before the services, so a role change needs no baseline
    # converge to admit a new replica (#453); the ruleset is the one the
    # baseline applies, and a host without a firewall is left alone.
    - name: Enforce the declared firewall with the services' rules
      ansible.builtin.include_role:
        name: cloudfall_firewall
      vars:
        cloudfall_firewall_ruleset: "{{ cloudfall_firewall }}"
      when: cloudfall_firewall is defined

    - name: Deploy declared PostgreSQL services
      ansible.builtin.include_role:
        name: cloudfall_postgresql
      vars:
        cloudfall_postgresql_service: "{{ cloudfall_service_item }}"
        # Controller paths of the staged owner passwords cloudfall passes
        # as cloudfall_services_password_files; never the values.
        cloudfall_postgresql_password_files: >-
          {{
            (cloudfall_services_password_files | default({}))
            [cloudfall_service_item.id] | default({})
          }}
      loop: >-
        {{
          cloudfall_services | default([])
          | selectattr('serviceKind', 'equalto', 'postgresql')
          | list
        }}
      loop_control:
        loop_var: cloudfall_service_item
        label: "{{ cloudfall_service_item.id }}"

    - name: Deploy declared Redis services
      ansible.builtin.include_role:
        name: cloudfall_redis
      vars:
        cloudfall_redis_service: "{{ cloudfall_service_item }}"
      loop: >-
        {{
          cloudfall_services | default([])
          | selectattr('serviceKind', 'equalto', 'redis')
          | list
        }}
      loop_control:
        loop_var: cloudfall_service_item
        label: "{{ cloudfall_service_item.id }}"

    - name: Deploy declared MariaDB services
      ansible.builtin.include_role:
        name: cloudfall_mariadb
      vars:
        cloudfall_mariadb_service: "{{ cloudfall_service_item }}"
        # Controller paths of the owners' staged hashes cloudfall passes as
        # cloudfall_services_mariadb_files; never a password.
        cloudfall_mariadb_hash_files: >-
          {{
            (cloudfall_services_mariadb_files | default({}))
            [cloudfall_service_item.id] | default({})
          }}
        # The controller paths of the replication account's hash, on a
        # primary, or of its password, on a replica (S-019, Replication).
        cloudfall_mariadb_replication_files: >-
          {{
            (cloudfall_services_mariadb_replication_files | default({}))
            [cloudfall_service_item.id] | default({})
          }}
        # Where each replication outcome is reported, for the converge's
        # answer: a refusal is PRECONDITION, a promotion names its last GTID.
        cloudfall_mariadb_report_directory: >-
          {{ cloudfall_services_mariadb_report_directory | default('') }}
      loop: >-
        {{
          cloudfall_services | default([])
          | selectattr('serviceKind', 'equalto', 'mariadb')
          | list
        }}
      loop_control:
        loop_var: cloudfall_service_item
        label: "{{ cloudfall_service_item.id }}"

    - name: Deploy declared Elasticsearch services
      ansible.builtin.include_role:
        name: cloudfall_elasticsearch
      vars:
        cloudfall_elasticsearch_service: "{{ cloudfall_service_item }}"
        # Controller paths of the staged cloudfall password and the account
        # hashes cloudfall passes as cloudfall_services_elasticsearch_files.
        cloudfall_elasticsearch_account_files: >-
          {{
            (cloudfall_services_elasticsearch_files | default({}))
            [cloudfall_service_item.id] | default({})
          }}
        # The access of each user the cluster's Kibana names (S-024). The
        # Kibana service lands on its own server only, which need not be the
        # home that converges the users, so every server's services are read.
        cloudfall_elasticsearch_kibana_access: >-
          {{
            groups['cloudfall_servers'] | default([])
            | map('extract', hostvars)
            | map(attribute='cloudfall_services', default=[])
            | flatten(levels=1)
            | selectattr('serviceKind', 'equalto', 'kibana')
            | selectattr('kibana.elasticsearch', 'equalto', cloudfall_service_item.id)
            | map(attribute='kibana.users')
            | flatten(levels=1)
            | items2dict(key_name='name', value_name='access')
          }}
        # The ids of the Kibana services that read the cluster (S-024-10):
        # each snapshot must then hold the feature state kibana, Kibana's
        # saved objects. Read from every server's services, as above.
        cloudfall_elasticsearch_kibana_services: >-
          {{
            groups['cloudfall_servers'] | default([])
            | map('extract', hostvars)
            | map(attribute='cloudfall_services', default=[])
            | flatten(levels=1)
            | selectattr('serviceKind', 'equalto', 'kibana')
            | selectattr('kibana.elasticsearch', 'equalto', cloudfall_service_item.id)
            | map(attribute='id')
            | unique | list
          }}
      loop: >-
        {{
          cloudfall_services | default([])
          | selectattr('serviceKind', 'equalto', 'elasticsearch')
          | list
        }}
      loop_control:
        loop_var: cloudfall_service_item
        label: "{{ cloudfall_service_item.id }}"

    - name: Deploy declared RabbitMQ services
      ansible.builtin.include_role:
        name: cloudfall_rabbitmq
      vars:
        cloudfall_rabbitmq_service: "{{ cloudfall_service_item }}"
        # Controller paths of the staged Erlang cookie and owner passwords
        # cloudfall passes as cloudfall_services_rabbitmq_files; never the
        # values (S-023, D-9).
        cloudfall_rabbitmq_files: >-
          {{
            (cloudfall_services_rabbitmq_files | default({}))
            [cloudfall_service_item.id] | default({})
          }}
        # Where a converge refused while the cluster has no majority is
        # reported, the directory the MariaDB role reports to: the services
        # converge answers it with PRECONDITION (S-023).
        cloudfall_rabbitmq_report_directory: >-
          {{ cloudfall_services_mariadb_report_directory | default('') }}
      loop: >-
        {{
          cloudfall_services | default([])
          | selectattr('serviceKind', 'equalto', 'rabbitmq')
          | list
        }}
      loop_control:
        loop_var: cloudfall_service_item
        label: "{{ cloudfall_service_item.id }}"

    # #329: an exporter follows its node in the same run (remoteAccess turns
    # an Elasticsearch scrape from plain HTTP to HTTPS and back), on a
    # collector where logging deploy already set Alloy up; any other host is
    # left alone
    - name: Follow the converged services with the logging collector
      ansible.builtin.include_role:
        name: cloudfall_logging_collector
        tasks_from: exporters
      vars:
        cloudfall_logging_collector_stack: "{{ cloudfall_logging_collector }}"
      when: cloudfall_logging_collector is defined
  post_tasks:
    # The Kibana play below checks the nodes of a cluster through this mark.
    - name: Record that the server finished its services
      ansible.builtin.set_fact:
        cloudfall_services_finished: true

# Kibana follows every node of its cluster (S-024): Elastic supports no Kibana
# newer than a node, so it runs in a play of its own, once each node of the
# cluster that this run converges finished the play above. A node the run
# could not reach is unfinished, and stops Kibana before its server changes.
- name: Deploy declared Kibana services after every node of their cluster
  hosts: cloudfall_servers
  become: true
  # Facts were gathered for each server by the play above.
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  tasks:
    - name: Converge the Kibana services of the server
      when: cloudfall_kibana_here | length > 0
      vars:
        cloudfall_kibana_here: >-
          {{
            cloudfall_services | default([])
            | selectattr('serviceKind', 'equalto', 'kibana')
            | selectattr('server', 'equalto', cloudfall_server_id)
            | list
          }}
      block:
        - name: Stop before Kibana while a node of its cluster did not finish
          ansible.builtin.assert:
            that:
              - cloudfall_kibana_unfinished | length == 0
            fail_msg: >-
              Stopped before Kibana on {{ cloudfall_server_id }}: the run did
              not finish the services of
              {{ cloudfall_kibana_unfinished | join(', ') }}, a node of its
              cluster (unreachable or failed); fix that server and run the
              command again
          vars:
            cloudfall_kibana_unfinished: >-
              {{
                cloudfall_services | default([])
                | selectattr('serviceKind', 'equalto', 'elasticsearch')
                | selectattr('id', 'in',
                             cloudfall_kibana_here
                             | map(attribute='kibana.elasticsearch') | list)
                | map(attribute='elasticsearch.nodes') | flatten | unique
                | select('in', ansible_play_hosts_all)
                | map('extract', hostvars)
                | rejectattr('cloudfall_services_finished', 'defined')
                | map(attribute='inventory_hostname')
                | list
              }}

        - name: Deploy declared Kibana services
          ansible.builtin.include_role:
            name: cloudfall_kibana
          vars:
            cloudfall_kibana_service: "{{ cloudfall_service_item }}"
            cloudfall_kibana_elasticsearch_service: >-
              {{
                cloudfall_services | default([])
                | selectattr('serviceKind', 'equalto', 'elasticsearch')
                | selectattr('id', 'equalto',
                             cloudfall_service_item.kibana.elasticsearch)
                | first | default({})
              }}
            # The Domain that publishes Kibana (S-024-8): its proxy server is
            # this server, so it is among the server's own Domains.
            cloudfall_kibana_domain: >-
              {{
                cloudfall_domains | default([])
                | selectattr('id', 'equalto',
                             cloudfall_service_item.kibana.domain | default(''))
                | first | default({})
              }}
            # Controller paths of the staged encryption keys cloudfall passes
            # as cloudfall_services_kibana_files; never the values (S-024-5).
            cloudfall_kibana_files: >-
              {{
                (cloudfall_services_kibana_files | default({}))
                [cloudfall_service_item.id] | default({})
              }}
            # The cloudfall password of the cluster, which the role reads
            # Kibana's status and the node's tokens with.
            cloudfall_kibana_elasticsearch_files: >-
              {{
                (cloudfall_services_elasticsearch_files | default({}))
                [cloudfall_service_item.kibana.elasticsearch] | default({})
              }}
          loop: "{{ cloudfall_kibana_here }}"
          loop_control:
            loop_var: cloudfall_service_item
            label: "{{ cloudfall_service_item.id }}"
