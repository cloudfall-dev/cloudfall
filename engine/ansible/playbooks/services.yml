---
- name: Deploy declared Cloudfall infrastructure services
  hosts: cloudfall_servers
  become: true
  # Facts are gathered by rollout-start.yml, after its reach check.
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  pre_tasks:
    - name: Stop at a server whose earlier servers did not finish
      ansible.builtin.import_tasks: tasks/rollout-start.yml

    # The Elasticsearch role refuses such a heap as its first task too; this
    # check runs before any service role, so the server is left unchanged
    # (S-012-4). Facts are gathered by rollout-start.yml above.
    - name: Refuse an Elasticsearch heap above half of the server's memory
      ansible.builtin.assert:
        that:
          - >-
            (cloudfall_service_item.elasticsearch.heapMb | int) * 2
            <= (ansible_facts['memtotal_mb'] | int)
        fail_msg: >-
          heapMb {{ cloudfall_service_item.elasticsearch.heapMb }} of
          service {{ cloudfall_service_item.id }} is above half of the
          {{ ansible_facts['memtotal_mb'] }} MB of {{ cloudfall_server_id }}:
          lower heapMb, or move the service to a server with more memory
      loop: >-
        {{
          cloudfall_services | default([])
          | selectattr('serviceKind', 'equalto', 'elasticsearch')
          | selectattr('elasticsearch.nodes', 'contains', cloudfall_server_id)
          | list
        }}
      loop_control:
        loop_var: cloudfall_service_item
        label: "{{ cloudfall_service_item.id }}"
  tasks:
    - name: Deploy declared PostgreSQL services
      ansible.builtin.include_role:
        name: cloudfall_postgresql
      vars:
        cloudfall_postgresql_service: "{{ cloudfall_service_item }}"
        # Controller paths of the staged owner passwords cloudfall passes
        # as cloudfall_services_password_files; never the values.
        cloudfall_postgresql_password_files: >-
          {{
            (cloudfall_services_password_files | default({}))
            [cloudfall_service_item.id] | default({})
          }}
      loop: >-
        {{
          cloudfall_services | default([])
          | selectattr('serviceKind', 'equalto', 'postgresql')
          | list
        }}
      loop_control:
        loop_var: cloudfall_service_item
        label: "{{ cloudfall_service_item.id }}"

    - name: Deploy declared Redis services
      ansible.builtin.include_role:
        name: cloudfall_redis
      vars:
        cloudfall_redis_service: "{{ cloudfall_service_item }}"
      loop: >-
        {{
          cloudfall_services | default([])
          | selectattr('serviceKind', 'equalto', 'redis')
          | list
        }}
      loop_control:
        loop_var: cloudfall_service_item
        label: "{{ cloudfall_service_item.id }}"

    - name: Deploy declared Elasticsearch services
      ansible.builtin.include_role:
        name: cloudfall_elasticsearch
      vars:
        cloudfall_elasticsearch_service: "{{ cloudfall_service_item }}"
        # Controller paths of the staged cloudfall password and the account
        # hashes cloudfall passes as cloudfall_services_elasticsearch_files.
        cloudfall_elasticsearch_account_files: >-
          {{
            (cloudfall_services_elasticsearch_files | default({}))
            [cloudfall_service_item.id] | default({})
          }}
      loop: >-
        {{
          cloudfall_services | default([])
          | selectattr('serviceKind', 'equalto', 'elasticsearch')
          | list
        }}
      loop_control:
        loop_var: cloudfall_service_item
        label: "{{ cloudfall_service_item.id }}"

    # #329: an exporter follows its node in the same run (remoteAccess turns
    # an Elasticsearch scrape from plain HTTP to HTTPS and back), on a
    # collector where logging deploy already set Alloy up; any other host is
    # left alone
    - name: Follow the converged services with the logging collector
      ansible.builtin.include_role:
        name: cloudfall_logging_collector
        tasks_from: exporters
      vars:
        cloudfall_logging_collector_stack: "{{ cloudfall_logging_collector }}"
      when: cloudfall_logging_collector is defined
