---
# Only the component's own group (component_<id>) is contacted, so a server
# the component is not on cannot fail its restart.
- name: Check the restart selection
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  tasks:
    - name: Require an explicit component selection
      ansible.builtin.assert:
        that:
          - cloudfall_deploy_component_id is defined
        fail_msg: >-
          Restart requires the cloudfall_deploy_component_id extra variable

    - name: Require the component's group in the inventory
      ansible.builtin.assert:
        that:
          - groups[cloudfall_deploy_component_group] | default([]) | length > 0
        fail_msg: >-
          The inventory has no servers in group
          {{ cloudfall_deploy_component_group }}; declare
          deployment.servers for component {{ cloudfall_deploy_component_id }}
          and render the inventory again
      vars:
        cloudfall_deploy_component_group: >-
          component_{{ cloudfall_deploy_component_id | replace('-', '_') }}

- name: Restart one Cloudfall component behind its health check
  # The intersection keeps cloudfall_servers' inventory order. Without the
  # component id (a syntax check) the pattern names no group; a run never gets
  # here without it, since the first play refuses that.
  hosts: >-
    cloudfall_servers:&component_{{
    cloudfall_deploy_component_id | default('') | replace('-', '_') }}
  become: true
  # Facts are gathered after the reach check, so a server is not contacted
  # once an earlier one was missed.
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  pre_tasks:
    # any_errors_fatal does not count an unreachable server as failed, so
    # serial: 1 would go on to the next one. Each server checks that every
    # server before it finished.
    - name: Stop the rollout at a server of the component it did not finish
      ansible.builtin.assert:
        that:
          - cloudfall_unfinished_servers | length == 0
        fail_msg: >-
          Stopped before {{ inventory_hostname }}: the run did not finish on
          {{ cloudfall_unfinished_servers | join(', ') }} (unreachable or
          failed); fix that server and run the command again
        quiet: true
      vars:
        cloudfall_unfinished_servers: >-
          {{
            ansible_play_hosts_all[:ansible_play_hosts_all.index(inventory_hostname)]
            | map('extract', hostvars)
            | rejectattr('cloudfall_rollout_finished', 'defined')
            | map(attribute='inventory_hostname')
            | list
          }}

    - name: Gather facts of the server
      ansible.builtin.gather_facts:
  post_tasks:
    - name: Record that the server finished
      ansible.builtin.set_fact:
        cloudfall_rollout_finished: true
  tasks:
    - name: Restart the selected component on its declared servers
      ansible.builtin.include_role:
        name: cloudfall_deploy
        tasks_from: restart
      vars:
        cloudfall_deploy_component: "{{ cloudfall_component_item }}"
      loop: >-
        {{
          cloudfall_components | default([])
          | selectattr('id', 'equalto', cloudfall_deploy_component_id)
          | list
        }}
      loop_control:
        loop_var: cloudfall_component_item
        label: "{{ cloudfall_component_item.id }}"
