---
# Only the component's own group (component_<id>) is contacted, so a server
# the component is not on cannot fail its restart.
- name: Check the restart selection
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  tasks:
    - name: Require an explicit component selection
      ansible.builtin.assert:
        that:
          - cloudfall_deploy_component_id is defined
        fail_msg: >-
          Restart requires the cloudfall_deploy_component_id extra variable

    - name: Require the component's group in the inventory
      ansible.builtin.assert:
        that:
          - groups[cloudfall_deploy_component_group] | default([]) | length > 0
        fail_msg: >-
          The inventory has no servers in group
          {{ cloudfall_deploy_component_group }}; declare
          deployment.servers for component {{ cloudfall_deploy_component_id }}
          and render the inventory again
      vars:
        cloudfall_deploy_component_group: >-
          component_{{ cloudfall_deploy_component_id | replace('-', '_') }}

- name: Restart one Cloudfall component behind its health check
  # The intersection keeps cloudfall_servers' inventory order.
  hosts: >-
    cloudfall_servers:&component_{{
    cloudfall_deploy_component_id | replace('-', '_') }}
  become: true
  gather_facts: true
  any_errors_fatal: true
  serial: 1
  tasks:
    - name: Restart the selected component on its declared servers
      ansible.builtin.include_role:
        name: cloudfall_deploy
        tasks_from: restart
      vars:
        cloudfall_deploy_component: "{{ cloudfall_component_item }}"
      loop: >-
        {{
          cloudfall_components | default([])
          | selectattr('id', 'equalto', cloudfall_deploy_component_id)
          | list
        }}
      loop_control:
        loop_var: cloudfall_component_item
        label: "{{ cloudfall_component_item.id }}"
