---
# A component that declares a release command runs it once, on its release
# server (the first entry of deployment.servers). That server deploys first,
# in its own play, so the command has run before any server's current release
# moves, and a failed command stops the playbook before the other plays start.
# Only the component's own group (component_<id>) is contacted, in inventory
# order, so a server the component is not on cannot fail its deploy.
- name: Select the release server of the deployed component
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  tasks:
    - name: Require an explicit component and release selection
      ansible.builtin.assert:
        that:
          - cloudfall_deploy_component_id is defined
          - cloudfall_deploy_release is defined
          - cloudfall_deploy_artifact_archive is defined
          - cloudfall_deploy_artifact_sha256 is defined
        fail_msg: >-
          Deployment requires cloudfall_deploy_component_id,
          cloudfall_deploy_release, cloudfall_deploy_artifact_archive, and
          cloudfall_deploy_artifact_sha256 extra variables

    - name: Require the component's group in the inventory
      ansible.builtin.assert:
        that:
          - groups[cloudfall_deploy_component_group] | default([]) | length > 0
        fail_msg: >-
          The inventory has no servers in group
          {{ cloudfall_deploy_component_group }}; declare
          deployment.servers for component {{ cloudfall_deploy_component_id }}
          and render the inventory again
      vars:
        cloudfall_deploy_component_group: >-
          component_{{ cloudfall_deploy_component_id | replace('-', '_') }}

    - name: Deploy the release server first
      ansible.builtin.add_host:
        name: "{{ cloudfall_release_server_item }}"
        groups: cloudfall_release_servers
      loop: >-
        {{
          groups['cloudfall_servers'] | default([])
          | map('extract', hostvars, 'cloudfall_components')
          | flatten
          | selectattr('id', 'equalto', cloudfall_deploy_component_id)
          | selectattr('release', 'defined')
          | map(attribute='release')
          | map(attribute='server')
          | unique
          | list
        }}
      loop_control:
        loop_var: cloudfall_release_server_item

- name: Deploy one Cloudfall component release on its release server
  hosts: cloudfall_release_servers
  become: true
  # Facts are gathered by rollout-start.yml, after its reach check.
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  pre_tasks:
    - name: Stop at a server whose earlier servers did not finish
      ansible.builtin.import_tasks: tasks/rollout-start.yml
  post_tasks:
    # The next play checks the release server through this mark.
    - name: Record that the server finished
      ansible.builtin.set_fact:
        cloudfall_rollout_finished: true
  tasks:
    # A dry run (--check) changes nothing, so it takes no lock.
    - name: Hold the component's lock on the server for the deploy
      block:
        - name: Take the component's lock
          ansible.builtin.import_tasks: tasks/component-lock-take.yml
          vars:
            cloudfall_component_lock_action: deploy
          when: not ansible_check_mode

        - name: Deploy the selected component and run its release command
          ansible.builtin.include_role:
            name: cloudfall_deploy
          vars:
            cloudfall_deploy_component: "{{ cloudfall_component_item }}"
          loop: >-
            {{
              cloudfall_components | default([])
              | selectattr('id', 'equalto', cloudfall_deploy_component_id)
              | list
            }}
          loop_control:
            loop_var: cloudfall_component_item
            label: "{{ cloudfall_component_item.id }}"
      always:
        - name: Release the component's lock
          ansible.builtin.import_tasks: tasks/component-lock-release.yml
          when: not ansible_check_mode

- name: Deploy one Cloudfall component release
  # The intersection keeps cloudfall_servers' inventory order. Without the
  # component id (a syntax check) the pattern names no group; a run never gets
  # here without it, since the first play refuses that.
  hosts: >-
    cloudfall_servers:&component_{{
    cloudfall_deploy_component_id | default('') | replace('-', '_')
    }}:!cloudfall_release_servers
  become: true
  # Facts are gathered by rollout-start.yml, after its reach check.
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  pre_tasks:
    # The release server came before every server of this play, so it must
    # have finished too.
    - name: Stop at a server whose earlier servers did not finish
      ansible.builtin.import_tasks: tasks/rollout-start.yml
      vars:
        cloudfall_rollout_earlier_servers: >-
          {{ groups['cloudfall_release_servers'] | default([]) }}
  tasks:
    - name: Hold the component's lock on the server for the deploy
      block:
        - name: Take the component's lock
          ansible.builtin.import_tasks: tasks/component-lock-take.yml
          vars:
            cloudfall_component_lock_action: deploy
          when: not ansible_check_mode

        - name: Deploy the selected component on its declared servers
          ansible.builtin.include_role:
            name: cloudfall_deploy
          vars:
            cloudfall_deploy_component: "{{ cloudfall_component_item }}"
          loop: >-
            {{
              cloudfall_components | default([])
              | selectattr('id', 'equalto', cloudfall_deploy_component_id)
              | list
            }}
          loop_control:
            loop_var: cloudfall_component_item
            label: "{{ cloudfall_component_item.id }}"
      always:
        - name: Release the component's lock
          ansible.builtin.import_tasks: tasks/component-lock-release.yml
          when: not ansible_check_mode
