---
- name: Inspect Cloudfall servers without changing remote state
  hosts: cloudfall_servers
  become: true
  gather_facts: true
  any_errors_fatal: true
  serial: 1
  # Inspect only reads, so it goes on past a server it cannot reach and
  # reports it as missing: no rollout-start.yml check here, unlike the
  # playbooks that change servers one by one.
  roles:
    - role: cloudfall_inspect
      cloudfall_inspect_server_id: "{{ cloudfall_server_id }}"
      cloudfall_inspect_baseline: "{{ cloudfall_baseline }}"
      cloudfall_inspect_logging_backend: >-
        {{ cloudfall_logging_backend | default({}) }}
      cloudfall_inspect_components: >-
        {{ cloudfall_components | default([]) }}
      cloudfall_inspect_certificates: >-
        {{ cloudfall_certificates | default([]) }}
      cloudfall_inspect_volumes: >-
        {{ cloudfall_volumes | default([]) }}
      cloudfall_inspect_alert_channel: >-
        {{ cloudfall_alert_channel | default('') }}
      cloudfall_inspect_elasticsearch_configuration: >-
        {{
          '/etc/elasticsearch/elasticsearch.yml'
          if cloudfall_services | default([])
          | selectattr('serviceKind', 'equalto', 'elasticsearch')
          | list | length > 0
          else ''
        }}
