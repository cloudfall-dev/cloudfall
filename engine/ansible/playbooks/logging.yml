---
- name: Validate Cloudfall logging deployment inventory
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Require one declared logging backend and at least one collector
      ansible.builtin.assert:
        that:
          - groups["cloudfall_logging_backends"] | length == 1
          - groups["cloudfall_logging_collectors"] | length > 0
        fail_msg: >-
          Validated state must declare exactly one logging backend and at least
          one collector before deployment

- name: Provide the volumes the controller decided
  hosts: cloudfall_logging_backends
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    # S-014: create, grow and mount each volume before its service's role
    # makes the data directory on it
    - name: Apply the volume actions for this host
      ansible.builtin.include_role:
        name: cloudfall_volumes
      vars:
        cloudfall_volumes_actions: >-
          {{ (cloudfall_volume_actions | default({})).get(cloudfall_server_id, []) }}
      when: >-
        (cloudfall_volume_actions | default({})).get(cloudfall_server_id, [])
        | length > 0

- name: Open the logging gateway to its remote collectors
  hosts: cloudfall_logging_backends
  become: true
  gather_facts: true
  any_errors_fatal: true
  tasks:
    # The declared firewall carries the gateway rule (S-011): the gateway port
    # opened to each remote collector's addresses only
    - name: Enforce the declared firewall with the gateway rule
      ansible.builtin.include_role:
        name: cloudfall_firewall
      vars:
        cloudfall_firewall_ruleset: "{{ cloudfall_firewall }}"
      when: cloudfall_firewall is defined

- name: Deploy Cloudfall logging backend
  hosts: cloudfall_logging_backends
  become: true
  # Facts are gathered by rollout-start.yml, after its reach check.
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  pre_tasks:
    - name: Stop at a server whose earlier servers did not finish
      ansible.builtin.import_tasks: tasks/rollout-start.yml
  roles:
    - role: cloudfall_logging_backend
      cloudfall_logging_backend_stack: >-
        {{ hostvars[inventory_hostname].cloudfall_logging_backend }}

- name: Deploy Cloudfall logging collectors
  hosts: cloudfall_logging_collectors
  become: true
  # Facts are gathered by rollout-start.yml, after its reach check.
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  pre_tasks:
    - name: Stop at a server whose earlier servers did not finish
      ansible.builtin.import_tasks: tasks/rollout-start.yml
  roles:
    - role: cloudfall_logging_collector
      cloudfall_logging_collector_stack: >-
        {{ hostvars[inventory_hostname].cloudfall_logging_collector }}
