---
- name: Bootstrap Cloudfall application servers
  hosts: cloudfall_servers
  become: true
  # Facts are gathered by rollout-start.yml, after its reach check.
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  pre_tasks:
    - name: Stop at a server whose earlier servers did not finish
      ansible.builtin.import_tasks: tasks/rollout-start.yml
  vars:
    cloudfall_bootstrap_component_keys:
      - id
      - install_root
      - application
      - application_user
  roles:
    - role: cloudfall_bootstrap
      cloudfall_bootstrap_applications: "{{ cloudfall_applications }}"
      cloudfall_bootstrap_components: >-
        {{
          cloudfall_components
          | map('dict2items')
          | map('selectattr', 'key', 'in', cloudfall_bootstrap_component_keys)
          | map('items2dict')
          | list
        }}
