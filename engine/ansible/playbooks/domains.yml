---
# `upstream` and `routes` are optional in the schema, since a fleet may route a
# Domain with its own proxy, but cloudfall_nginx_site cannot render one with
# neither. The check runs across every host of the run before the serial play
# below, so a refused run changes no server.
- name: Refuse Domains the site role cannot render
  hosts: cloudfall_servers
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Require an upstream or routes on every Domain this run renders
      ansible.builtin.assert:
        that:
          - cloudfall_domains_without_upstream | length == 0
        fail_msg: >-
          {{ 'Domain' if cloudfall_domains_without_upstream | length == 1
          else 'Domains' }} {{ cloudfall_domains_without_upstream | join(', ') }}
          {{ 'has' if cloudfall_domains_without_upstream | length == 1
          else 'have' }} no proxy.upstream or routes, which cloudfall_nginx_site
          needs to render {{ 'it' if cloudfall_domains_without_upstream | length == 1
          else 'them' }}; no server was changed
        quiet: true
      vars:
        cloudfall_domains_in_run: >-
          {{
            ansible_play_hosts_all
            | map('extract', hostvars)
            | map(attribute='cloudfall_domains', default=[])
            | flatten(levels=1)
          }}
        # The same one-Domain filter as the render loop below.
        cloudfall_domains_without_upstream: >-
          {{
            (
              cloudfall_domains_in_run
              | selectattr('id', 'equalto', cloudfall_domains_domain_id)
              | list
              if cloudfall_domains_domain_id is defined
              else cloudfall_domains_in_run
            )
            | rejectattr('proxy.upstream', 'defined')
            | rejectattr('routes', 'defined')
            | map(attribute='id')
            | unique
            | sort
          }}
      run_once: true

- name: Deploy declared Cloudfall public domain routes
  hosts: cloudfall_servers
  become: true
  gather_facts: true
  any_errors_fatal: true
  serial: 1
  tasks:
    - name: Render declared domains as managed virtual hosts
      ansible.builtin.include_role:
        name: cloudfall_nginx_site
      vars:
        cloudfall_nginx_site_domain: "{{ cloudfall_domain_item }}"
        cloudfall_nginx_site_issue_certificate: >-
          {{ cloudfall_domains_issue_certificates | default(false) | bool }}
        cloudfall_nginx_site_receipt_directory: >-
          {{ cloudfall_domains_receipt_directory | default("") }}
      # cloudfall_domains_domain_id limits the run to one Domain.
      loop: >-
        {{
          cloudfall_domains | default([])
          | selectattr('id', 'equalto', cloudfall_domains_domain_id)
          | list
          if cloudfall_domains_domain_id is defined
          else cloudfall_domains | default([])
        }}
      loop_control:
        loop_var: cloudfall_domain_item
        label: "{{ cloudfall_domain_item.id }}"
