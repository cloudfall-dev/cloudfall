# Managed by Cloudfall. Local changes will be overwritten.
server {
    listen 80;
    listen [::]:80;
    server_name crm.example.test www.crm.example.test;

    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crm.example.test www.crm.example.test;

    ssl_certificate /etc/letsencrypt/live/crm.example.test/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.example.test/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    location / {
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:8100;
        proxy_pass_request_headers on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}
